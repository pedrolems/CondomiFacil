      summary: Avança o estado de um chamado de manutenção
      description: 'Atualiza o chamado de manutenção: aberto, orçamento, agendado; Reaberto exige triagem explícita para Orçamento ou Agendado com autoria/momento (RN-CH-07), sem conclusão direta. (RN-CH-05, RN-CH-06 pede a primeira
        atualização em até 48h por padrão). **Subsíndico:** só em substituição. Fora da substituição a resposta
        é `403` (RN-CD-27, RN-CD-28).'
      tags:
      - chamados
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: '#/components/parameters/ChamadoId'
      requestBody:
