          - negado
        fundamentacao:
          type: string
          minLength: 1
x-lacunas:
- 'Denúncia de conteúdo (`POST /v1/denuncias`): os docs não definem o que o destinatário vê do conteúdo denunciado nem como a anonimidade de avaliador (RN-PE-09) e de reclamante (RN-SC-12, RN-RC-08) é preservada quando a denúncia de avaliação, resposta de pesquisa ou reclamação chega ao síndico (RN-RC-13); também não definem estados da denúncia, ações do síndico sobre ela, nem consulta pelo destinatário; o MER tem `denuncia_conteudo` com `estado` e `encaminhado_vinculo_id`, sem valores. Sem listagem nem tratamento aqui.'
- 'Nota dos setores: casas decimais e arredondamento da nota não estão definidos; a lista de setores não tem fonte (`setor` é texto livre); parâmetro `competencia` e padrão "último mês fechado" são Proposta, e o comportamento para mês futuro ou não fechado é lacuna.'
- 'Tipos denunciáveis: o MER cita mensagem de comunicado, reclamação, avaliação de atendimento e resposta de pesquisa; a ordem e o alcance por perfil não estão nos docs.'
- 'Limites de taxa (requisições e janela) nos endpoints de acesso: lacuna do guia (seção 10); nenhum número aparece neste arquivo.'
- 'Tempo de expiração dos URLs assinados de envio e de leitura ("minutos" e "curta duração"): lacuna (arquitetura 3.8).'
- 'Lista de tipos de mídia aceitos, formato do hash, verificação de vírus e retenção de arquivos: lacuna (arquitetura 3.8).'
- 'Estados de `pedido_lgpd` e códigos de `origem_tipo` de `movimento_score`: o MER/DER não os lista; ficam como texto livre com exemplo.'
- 'Tolerância da rotação do refresh em rede instável (uma renovação perdida derruba a sessão legítima): em aberto no ADR-007.'
- 'Listagem e encerramento de sessões (`/v1/eu/sessoes`), `/v1/acesso/renovar` e `/v1/acesso/sair`: sem ID de produto que os sustente; derivam do ADR-007, da arquitetura 3.3.1 e 3.7 e do MER (`sessao`, `dispositivo`) e são Proposta. O guia só aceita IDs RF, RN, US e SEG em `x-rastreabilidade`, por isso a lista dessas operações fica vazia.'
- 'Lista de notificações (`GET /v1/eu/notificacoes`): RF-NO-01 só trata da escolha de tipos; a lista vem do MER (`notificacao`) e da arquitetura 3.7. Marcar como lida (`lida_em`) ficou fora por falta de RF.'
- 'Primeira unidade ativa lembrada entre sessões e ordem do seletor de unidade: sem regra nos docs; o cliente decide.'
- 'Cobrança em atraso como notificação obrigatória: proposta de produto fora das RN (UF 17); não consta como tipo obrigatório.'
- 'Comportamento de `X-App-Version` ausente: lacuna do guia (seção 3).'
- Julgamento de recurso por papéis variados está aqui (`/v1/recursos/{recurso_id}/decisoes`) por ser comum a síndico, subsíndico, administradora e conselho fiscal; as listas e telas de julgamento de reclamação ficam nos arquivos de `sindico`, `conselho-fiscal` e `administradora`.
- 'Listagem de pedidos de LGPD (`GET /v1/eu/pedidos-lgpd`): sem RF dedicado; Proposta, sustentada só por SEG-11.'
- 'Unidade em `escopo=sindico`: RF-RS-11 só autoriza identificar a unidade no próprio score; RN-SC-02 e UF 9.4 pedem a referência do mandato na Transparência. Aqui `unidade` vem nula fora do próprio; dúvida para o Pedro.'
- 'Mapeamento API x MER/DER no recurso: `reclamacao_id` (API) liga-se a `recurso_reclamacao.decisao_id` por `decisao_reclamacao` (UQ por reclamação); `resultado` e `decidido_em` (API) correspondem ao `estado`, `decidido_em` e `fundamentacao` do MER, cujos valores de `estado` não estão definidos.'
