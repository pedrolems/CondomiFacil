          - 2026-11
        ciclo_inicio:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
        ciclo_fim:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
        unidades_apuradas:
          type: integer
          examples:
          - 120
        franquia_apurada:
          type:
          - integer
          - 'null'
          examples:
          - 10
        total_centavos:
          $ref: ./componentes/comum.yaml#/components/schemas/Centavos
        estado:
          type: string
          description: 'Estado da fatura (valores: lacuna).'
