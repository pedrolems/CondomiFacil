                    - reabrir_chamado
                    - abrir_novo_chamado
                    description: Oferta após avaliação baixa (RN-CH-18).
              example:
                nota: 2
                base: vi_as_fotos
                comentario: A faixa de segurança não foi recolocada.
                avaliada_em: '2026-11-09T10:00:00-03:00'
                oferta: reabrir_chamado
