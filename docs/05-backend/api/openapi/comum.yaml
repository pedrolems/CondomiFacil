                    saldo: 85
                    proxima_recuperacao_em: '2027-01-02'
                    reservas_gratuitas_liberadas: true
                    situacao_texto: Reservas gratuitas liberadas nesta unidade.
                    funcionario_id: null
                    reclamacao_id: null
