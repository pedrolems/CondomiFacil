  /v1/administradora/avaliacoes-atendimento/funcionarios:
    get:
      operationId: administradoraListarAvaliacoesFuncionarios
      summary: Lista as avaliações do atendimento agregadas por funcionário de limpeza
      description: >-
        A administradora vê só o agregado por funcionário de limpeza: média, quantidade e distribuição por estrelas, sem comentários, sem chamados e sem identificar quem avaliou (RF-CH-10, RN-CH-19).
        Quem tem menos de 3 avaliações aparece só com a quantidade, com `media` e `distribuicao` nulas (RN-CH-20; a regra dos 3 é da média e dos comentários, estender à distribuição é Proposta, porque com 1 ou 2 avaliações ela revela a média). Funcionário desligado some da lista e segue no agregado do setor (RN-CH-20).
        O comentário e a base da avaliação ficam só no detalhe do chamado, para o síndico (RN-CH-19). A avaliação não altera score (RN-CH-21).
        Os agregados por funcionário e por empresa do síndico estão em `sindico.yaml`; os campos têm os mesmos nomes. O suporte da plataforma usa esta rota no plano Gestão + Suporte, como a administradora (PRD 3).
      tags:
      - chamados
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: ./componentes/comum.yaml#/components/parameters/Limite
      - $ref: ./componentes/comum.yaml#/components/parameters/Cursor
      - name: ordenar
        in: query
        required: false
        description: Ordenação. Padrão `-quantidade`.
        schema:
          type: string
          enum:
          - media
          - -media
          - quantidade
          - -quantidade
          default: -quantidade
      responses:
        '200':
          description: Página de agregados.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                type: object
                required:
                - dados
                - paginacao
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/AvaliacaoAtendimentoAgregadoAdministradora'
                  paginacao:
                    $ref: ./componentes/comum.yaml#/components/schemas/Paginacao
              example:
                dados:
                - atendente_id: 00000032-1111-4222-8333-000000000032
                  atendente_nome: Joana Prado
                  media: 4.6
                  quantidade: 12
                  distribuicao:
                  - estrelas: 5
                    quantidade: 9
                  - estrelas: 4
                    quantidade: 2
                  - estrelas: 1
                    quantidade: 1
                - atendente_id: 00000035-1111-4222-8333-000000000035
                  atendente_nome: Atendente Exemplo
                  media: null
                  quantidade: 2
                  distribuicao: null
                paginacao:
                  proximo_cursor: null
                  tem_mais: false
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-CH-10
      - RN-CH-19
      - RN-CH-20
      - RN-CH-21
      - US-CH-05
