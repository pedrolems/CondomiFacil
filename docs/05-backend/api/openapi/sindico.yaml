openapi: 3.1.0
info:
  title: CondomiFacil API - interface do síndico, subsíndico e síndico profissional
  version: 0.1.0-proposta
  description: '**Proposta de 10/11/2026**, não aceita pelo Pedro. Tudo o que não vem de decisão do Pedro ou do
    PRD (caminhos, nomes de campos, códigos de erro, filtros, ordenações padrão) é Proposta; o guia `../01-guia-da-api.md`
    é a fonte das convenções.


    Interface do **síndico morador, síndico profissional e subsíndico** (`/v1/sindico/*`). Não existe pasta `subsindico`:
    o papel por mandato é dado resolvido no servidor (RN-CD-12, RN-CD-28), então a mesma rota responde ou recusa
    conforme o papel efetivo. A `description` de cada operação diz quando o subsíndico recebe `403`:


    - **Em substituição:** operação que o subsíndico só usa quando a substituição está ativa (matriz do PRD 3, "Em
    substituição"). Fora da substituição a resposta é `403` (RN-CD-27, RN-CD-28), com o texto de UF 4.4: "Esta função
    é do síndico. Você passa a ter acesso quando a substituição pelo subsíndico estiver ativa."

    - **Só síndico:** ativar e desativar a substituição nunca são do subsíndico, nem em substituição (RN-CD-12,
    RN-CD-28).

    - **Só subsíndico fora da substituição:** sugerir comunicado (RN-CO-05).


    O síndico morador que age como morador usa `morador.yaml`; o síndico profissional não tem funções de morador
    (RN-CD-11). Identidade do reclamante só chega ao julgador (RN-SC-02); score nunca aparece nestes DTOs: vem do
    endpoint único de score (ADR-010). Finanças do condomínio são só leitura e comentário aqui; quem lança, fecha
    e estorna é a administradora (RN-FI-29). Nenhuma operação deste arquivo escreve em lançamento financeiro.'
tags:
- name: chamados
  description: Chamados de limpeza e manutenção, urgência, empresas e avaliações do atendimento.
- name: convivencia
  description: Reclamações, recursos, semáforo de prazo e resultado da pesquisa mensal.
- name: comunicados
  description: Comunicados gerais e individuais e sugestões do subsíndico.
- name: governanca
  description: Reuniões, pautas, votações, eleições e atas.
- name: cobranca
  description: Painel de inadimplência e pedido de cobrança extra.
- name: financas
  description: 'Finanças do condomínio: leitura, comentário e exportação.'
- name: condominio
  description: Substituição do síndico, solicitações à administradora e empresas de manutenção.
- name: encomendas
  description: Encomendas com prazo de guarda vencido.
- name: visitantes
  description: Lista de entrada bloqueada (só leitura).
paths:
  /v1/sindico/chamados:
    get:
      operationId: sindicoListarChamados
      summary: Lista a fila de chamados do condomínio
      description: Abertos antes dos concluídos; dentro de cada grupo, urgência alta, média e leve e, no empate,
        o mais antigo primeiro (RN-CH-13, RF-CH-06); fora do prazo em destaque (RN-CH-06). Subsíndico fora da substituição
        acompanha só os de manutenção, sem alterar (RN-CD-27); pedir `tipo=limpeza` nessa condição responde `403`.
      tags:
      - chamados
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: ./componentes/comum.yaml#/components/parameters/Limite
      - $ref: ./componentes/comum.yaml#/components/parameters/Cursor
      - $ref: '#/components/parameters/EstadoChamadoFiltro'
      - $ref: '#/components/parameters/TipoChamadoFiltro'
      - $ref: '#/components/parameters/UrgenciaChamadoFiltro'
      - $ref: '#/components/parameters/ForaDoPrazoFiltro'
      - name: ordenar
        in: query
        required: false
        description: Ordenação. `prioridade` é a ordem de RN-CH-13 (padrão); `aberto_em` e `-aberto_em` ordenam
          só pela abertura.
        schema:
          type: string
          enum:
          - prioridade
          - aberto_em
          - -aberto_em
          default: prioridade
      responses:
        '200':
          description: Página de chamados.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                type: object
                required:
                - dados
                - paginacao
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChamadoResumoSindico'
                  paginacao:
                    $ref: ./componentes/comum.yaml#/components/schemas/Paginacao
              example:
                dados:
                - id: 00000001-1111-4222-8333-000000000001
                  tipo: manutencao
                  categoria: Elevador
                  local: Elevador social, bloco B
                  urgencia: alta
                  estado: aberto
                  aberto_em: '2026-11-09T08:15:00-03:00'
                  fora_do_prazo: false
                  autor_nome: Marina Teixeira
                  unidade_identificacao: Bloco B, 302
                  empresa_atual: null
                paginacao:
                  proximo_cursor: null
                  tem_mais: false
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: '#/components/responses/Erro403ForaDaSubstituicao'
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-CH-04
      - RF-CH-06
      - RN-CH-06
      - RN-CH-10
      - RN-CH-13
      - RN-CD-27
      - US-CH-03
      - US-AD-12
    post:
      operationId: sindicoAbrirChamado
      summary: Abre um chamado como síndico
      description: >-
        O síndico profissional, que não usa as rotas de morador, abre chamado de limpeza ou de manutenção, com categoria, descrição e urgência obrigatórias e foto opcional (RF-CH-01, RN-CH-02, RN-CH-03, RN-CH-09).
        Não leva `X-Unidade-Id`: o chamado não é de uma unidade. O síndico morador e o subsíndico também podem abrir chamado pela rota de morador, com a unidade ativa (`POST /v1/morador/chamados`, `morador.yaml`).
        O chamado nasce em Aberto, com o prazo de RN-CH-06, e pode ser avaliado por quem o abriu (RF-CH-08).
      tags:
      - chamados
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbrirChamadoSindico'
            example:
              tipo: manutencao
              categoria: Elevador
              local: Elevador social, bloco B
              descricao: O elevador social parou entre andares e voltou a funcionar sozinho.
              urgencia: alta
      responses:
        '201':
          description: Chamado aberto.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChamadoSindico'
              example:
                id: 00000001-1111-4222-8333-000000000001
                tipo: manutencao
                categoria: Elevador
                local: Elevador social, bloco B
                urgencia: alta
                estado: aberto
                aberto_em: '2026-11-09T08:15:00-03:00'
                fora_do_prazo: false
                autor_nome: Carlos Menezes
                unidade_identificacao: null
                empresa_atual: null
                descricao: O elevador social parou entre andares e voltou a funcionar sozinho.
                fotos_abertura_arquivo_ids: []
                historico: []
                conclusao: null
        '400':
          description: Entrada inválida.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                urgencia:
                  summary: Urgência não escolhida (RN-CH-09; texto Proposta)
                  value:
                    codigo: REQUISICAO_INVALIDA
                    mensagem: Confira os campos destacados e tente de novo.
                    detalhes:
                    - campo: urgencia
                      mensagem: Escolha a urgência do chamado.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-CH-01
      - RN-CH-02
      - RN-CH-03
      - RN-CH-09
      - US-CH-01
  /v1/sindico/chamados/{chamado_id}:
    get:
      operationId: sindicoObterChamado
      summary: Detalha um chamado
      description: Mostra urgência, histórico de ajustes, fotos, conclusão e, no detalhe, nota, comentário e base
        da avaliação do atendimento (RN-CH-19, RN-CH-16). Disponível ao subsíndico também fora da substituição,
        só para chamado de manutenção (RN-CD-27); chamado de limpeza responde `403` a ele fora da substituição.
      tags:
      - chamados
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: '#/components/parameters/ChamadoId'
      responses:
        '200':
          description: Chamado.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChamadoSindico'
              example:
                id: 00000001-1111-4222-8333-000000000001
                tipo: manutencao
                categoria: Elevador
                local: Elevador social, bloco B
                urgencia: alta
                estado: aberto
                aberto_em: '2026-11-09T08:15:00-03:00'
                fora_do_prazo: false
                autor_nome: Marina Teixeira
                unidade_identificacao: Bloco B, 302
                empresa_atual: null
                descricao: O elevador social parou entre andares e voltou a funcionar sozinho.
                fotos_abertura_arquivo_ids:
                - 00000046-1111-4222-8333-000000000046
                historico:
                - tipo: urgencia_ajustada
                  registrado_em: '2026-11-09T09:00:00-03:00'
                  autor_nome: Carlos Menezes
                  urgencia_anterior: media
                  urgencia_nova: alta
                  estado_anterior: null
                  estado_novo: null
                conclusao: null
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: '#/components/responses/Erro403ForaDaSubstituicao'
        '404':
          $ref: ./componentes/comum.yaml#/components/responses/Erro404
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-CH-04
      - RF-CH-10
      - RN-CH-14
      - RN-CH-16
      - RN-CH-19
      - RN-CD-27
      - US-CH-03
  /v1/sindico/chamados/{chamado_id}/urgencia:
    patch:
      operationId: sindicoAjustarUrgenciaChamado
      summary: Ajusta a urgência de um chamado aberto
      description: Registra quem, quando, o valor anterior e o novo, e avisa quem abriu; não altera prazos nem estado
        (RN-CH-11, RN-CH-12). Funcionários e portaria não ajustam. **Subsíndico:** só em substituição. Fora da substituição
        a resposta é `403` (RN-CD-27, RN-CD-28).
