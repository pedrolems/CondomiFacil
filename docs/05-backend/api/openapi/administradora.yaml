  /v1/administradora/reclamacoes/{reclamacao_id}/conversa:
    post:
      operationId: administradoraIniciarConversaComAlvo
      summary: Inicia a conversa com o alvo da reclamação
      description: 'Quando a administradora é a julgadora (RN-RC-03), inicia a conversa antes de decidir: comunicado individual vinculado à reclamação, exceção a RN-CO-01. Com alvo unidade, a conversa é com o morador habilitado; em unidade desocupada, com o proprietário (RN-RC-04, RN-CO-04). A reclamação passa a Em conversa com o alvo. O suporte da plataforma não vê reclamações nem scores e recebe `403` nesta operação (PRD 3, `01-backend.md` 3.3, SEG-13).'
      tags:
      - comunicados
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - name: reclamacao_id
        in: path
        required: true
        description: Identificador da reclamação.
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IniciarConversaEntradaAdministradora'
            example:
              texto: Recebemos uma reclamação sobre ruído. Pode nos contar o que houve?
      responses:
        '201':
          description: Conversa iniciada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversaReclamacaoAdministradora'
              example:
                comunicado_id: 00000137-0000-4000-8000-000000000137
                reclamacao_id: 0000012d-0000-4000-8000-00000000012d
                estado_reclamacao: em_conversa_com_o_alvo
                enviada_em: '2026-11-10T09:00:00-03:00'
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          description: Sem permissão para o papel efetivo ou sem vínculo com o condomínio (guards de contexto e papel).
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                semPermissao:
                  summary: Suporte da plataforma recebe 403 (PRD 3)
                  value:
                    codigo: SEM_PERMISSAO
                    mensagem: Esta área é só para administradora.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '404':
          $ref: ./componentes/comum.yaml#/components/responses/Erro404
        '409':
          description: Conflito com o estado atual do recurso.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                jaIniciada:
                  summary: Conversa já iniciada por outra pessoa (UF 15)
                  value:
                    codigo: CONFLITO_DADO_ALTERADO
                    mensagem: Estas informações mudaram. Atualizamos a tela.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '422':
          description: Regra de negócio violada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                foraDaCompetencia:
                  summary: Julgador definido pela tabela 5.1 é outro (RN-RC-03)
                  value:
                    codigo: RECLAMACAO_FORA_DA_COMPETENCIA_DA_ADMINISTRADORA
                    mensagem: Esta reclamação não cabe à administradora julgar.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '426':
