openapi: 3.1.0
info:
  title: CondomiFacil API - interface da plataforma
  version: 0.1.0-proposta
  description: '**Proposta de 10/11/2026**, não aceita pelo Pedro. Tudo o que não vem de decisão do Pedro nem do PRD (caminhos, nomes de campos de entrada, códigos de erro, códigos de plano) é Proposta. Estados e regras vêm das Regras de Negócio e do MER/DER.


    Interface do painel da plataforma, em `/v1/plataforma/*` (pasta `plataforma/`, `01-backend.md` 3.3). O **Admin da plataforma** cadastra condomínios, planos e acessos de suporte e não acessa dados de condomínios (arquitetura 4.4). O **Suporte da plataforma** abre contexto em condomínio do plano Gestão + Suporte e passa a operar por `/v1/administradora/*` com `X-Condominio-Id`, exceto reclamações e scores (SEG-13, RN-CD-16).


    Nenhuma rota deste arquivo leva `X-Condominio-Id` nem `X-Unidade-Id`: não pertencem a um contexto de condomínio; quando a operação trata de um condomínio, ele vai no caminho. Os detalhes do painel da plataforma além de "condomínios, planos, suporte" são lacuna nos docs (arquitetura 3.2 e 9.3): documenta-se só o que tem fonte. Ações sensíveis são auditadas (SEG-08).'
servers:
- url: https://api.condomifacil.example
  description: Endereço fictício; ambientes ainda não definidos (ADR-004, ADR-011).
tags:
- name: plataforma
  description: Condomínios, planos, assinaturas e faturas.
- name: configuracao
  description: Padrões de plataforma dos parâmetros.
- name: auditoria
  description: Acesso do suporte e auditoria global.
paths:
  /v1/plataforma/planos:
    get:
      operationId: plataformaListarPlanos
      summary: Lista os planos e as faixas de preço
      description: 'Essencial (com administradora ou autogestão sem administradora e sem suporte de gestão) e Gestão + Suporte (sem administradora), por faixa de unidades (RN 11). Os planos não se criam: só os preços têm versões. Só o Admin da plataforma; o suporte recebe `403`. Rota da plataforma: não leva `X-Condominio-Id` nem `X-Unidade-Id`; o condomínio, quando houver, vai no caminho.'
      tags:
      - plataforma
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: ./componentes/comum.yaml#/components/parameters/Limite
      - $ref: ./componentes/comum.yaml#/components/parameters/Cursor
      responses:
        '200':
          description: Página de resultados.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                type: object
                required:
                - dados
                - paginacao
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlanoPlataforma'
                  paginacao:
                    $ref: ./componentes/comum.yaml#/components/schemas/Paginacao
              example:
                dados:
                - id: 00000191-0000-4000-8000-000000000191
                  codigo: essencial
                  nome: Essencial
                  precos:
                  - id: 00000192-0000-4000-8000-000000000192
                    unidades_de: 1
                    unidades_ate: 30
                    valor_centavos: 9900
                    franquia_solicitacoes: null
                    extra_centavos: 1500
                    vigente_desde: '2026-01-01T00:00:00-03:00'
                    vigente_ate: null
                    sob_consulta: false
                paginacao:
                  proximo_cursor: null
                  tem_mais: false
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          description: Sem permissão para o papel efetivo ou sem vínculo com o condomínio (guards de contexto e papel).
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                semPermissao:
                  summary: Suporte da plataforma recebe 403 (PRD 3)
                  value:
                    codigo: SEM_PERMISSAO
                    mensagem: Esta área é só para admin da plataforma.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RN-PL-01
      - RN-PL-02
      - RN-PL-07
      - US-PL-01
  /v1/plataforma/planos/{plano_id}/precos:
    post:
      operationId: plataformaPublicarPreco
      summary: Publica uma nova versão de preço
      description: 'Nova versão de preço, revista uma vez por ano; o cliente é avisado com 30 dias de antecedência e o valor vale a partir do ciclo seguinte (RN-PL-07). Faixas não se sobrepõem no mesmo plano e período (RN-PL-01). Não recalcula fatura antiga. Ação auditada (SEG-08). Só o Admin da plataforma; o suporte recebe `403`. Rota da plataforma: não leva `X-Condominio-Id` nem `X-Unidade-Id`; o condomínio, quando houver, vai no caminho.'
      tags:
      - plataforma
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - name: plano_id
        in: path
        required: true
        description: Identificador do plano.
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoPrecoPlanoEntradaPlataforma'
            example:
              unidades_de: 1
              unidades_ate: 30
              valor_centavos: 10900
              franquia_solicitacoes: null
              extra_centavos: 1500
              vigente_desde: '2027-01-01T00:00:00-03:00'
              sob_consulta: false
      responses:
        '201':
          description: Versão publicada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrecoPlanoPlataforma'
              example:
                id: 00000192-0000-4000-8000-000000000192
                unidades_de: 1
                unidades_ate: 30
                valor_centavos: 9900
                franquia_solicitacoes: null
                extra_centavos: 1500
                vigente_desde: '2026-01-01T00:00:00-03:00'
                vigente_ate: null
                sob_consulta: false
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          description: Sem permissão para o papel efetivo ou sem vínculo com o condomínio (guards de contexto e papel).
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                semPermissao:
                  summary: Suporte da plataforma recebe 403 (PRD 3)
                  value:
                    codigo: SEM_PERMISSAO
                    mensagem: Esta área é só para admin da plataforma.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '404':
          $ref: ./componentes/comum.yaml#/components/responses/Erro404
        '422':
          description: Regra de negócio violada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                sobreposicao:
                  summary: Faixas sobrepostas no mesmo plano e período (RN-PL-01)
                  value:
                    codigo: PRECO_FAIXA_SOBREPOSTA
                    mensagem: Já existe preço vigente para esta faixa no período.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RN-PL-01
      - RN-PL-07
      - US-PL-01
      - SEG-08
  /v1/plataforma/condominios:
    get:
      operationId: plataformaListarCondominios
      summary: Lista os condomínios
      description: 'Condomínios cadastrados, com plano e número de unidades. Só dados da plataforma (arquitetura 4.4). Só o Admin da plataforma; o suporte recebe `403`. Rota da plataforma: não leva `X-Condominio-Id` nem `X-Unidade-Id`; o condomínio, quando houver, vai no caminho.'
      tags:
      - plataforma
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: ./componentes/comum.yaml#/components/parameters/Limite
      - $ref: ./componentes/comum.yaml#/components/parameters/Cursor
      - name: plano
        in: query
        required: false
        description: Filtra pelo código do plano.
        schema:
          type: string
          enum:
          - essencial
          - gestao_suporte
      - name: busca
        in: query
        required: false
        description: Texto livre no nome.
        schema:
          type: string
      - name: ordenar
        in: query
        required: false
        description: Ordenação. Padrão `nome`.
        schema:
          type: string
          enum:
          - nome
          - -nome
          default: nome
      responses:
        '200':
          description: Página de resultados.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                type: object
                required:
                - dados
                - paginacao
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/CondominioPlataforma'
                  paginacao:
                    $ref: ./componentes/comum.yaml#/components/schemas/Paginacao
              example:
                dados:
                - id: 0000019b-0000-4000-8000-00000000019b
                  nome: Condomínio Residencial Exemplo
                  documento_mascarado: '**.***.***/0001-**'
                  fuso_horario: America/Sao_Paulo
                  plano:
                    codigo: essencial
                    nome: Essencial
                  unidades_apuradas: 120
                  administradora_id: 0000019c-0000-4000-8000-00000000019c
                paginacao:
                  proximo_cursor: null
                  tem_mais: false
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          description: Sem permissão para o papel efetivo ou sem vínculo com o condomínio (guards de contexto e papel).
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                semPermissao:
                  summary: Suporte da plataforma recebe 403 (PRD 3)
                  value:
                    codigo: SEM_PERMISSAO
                    mensagem: Esta área é só para admin da plataforma.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RN-PL-01
      - RN-PL-02
      - US-PL-01
    post:
      operationId: plataformaCadastrarCondominio
      summary: Cadastra um condomínio
      description: 'Cadastra o condomínio e sua assinatura; a faixa vem do número de unidades cadastradas e a mudança de faixa vale a partir do ciclo seguinte (RN-PL-01). Ação auditada na auditoria da plataforma (SEG-08). Só o Admin da plataforma; o suporte recebe `403`. Rota da plataforma: não leva `X-Condominio-Id` nem `X-Unidade-Id`; o condomínio, quando houver, vai no caminho.'
      tags:
      - plataforma
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CondominioEntradaPlataforma'
            example:
              nome: Condomínio Residencial Exemplo
              documento: '12345678000190'
              fuso_horario: America/Sao_Paulo
              plano_codigo: essencial
              ciclo_dia: 10
      responses:
        '201':
          description: Condomínio cadastrado.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CondominioPlataforma'
              example:
                id: 0000019b-0000-4000-8000-00000000019b
                nome: Condomínio Residencial Exemplo
                documento_mascarado: '**.***.***/0001-**'
                fuso_horario: America/Sao_Paulo
                plano:
                  codigo: essencial
                  nome: Essencial
                unidades_apuradas: 120
                administradora_id: 0000019c-0000-4000-8000-00000000019c
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          description: Sem permissão para o papel efetivo ou sem vínculo com o condomínio (guards de contexto e papel).
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                semPermissao:
                  summary: Suporte da plataforma recebe 403 (PRD 3)
                  value:
                    codigo: SEM_PERMISSAO
                    mensagem: Esta área é só para admin da plataforma.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '422':
          description: Regra de negócio violada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                negociado:
                  summary: Faixa sob consulta sem valor negociado (RN 11)
                  value:
                    codigo: ASSINATURA_ACIMA_DE_600_SEM_VALOR_NEGOCIADO
                    mensagem: Acima de 600 unidades, informe o valor e a franquia contratados.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RN-PL-01
      - RN-PL-02
      - US-PL-01
      - SEG-08
  /v1/plataforma/condominios/{condominio_id}:
    get:
      operationId: plataformaObterCondominio
      summary: Detalha um condomínio
      description: 'Dados da plataforma do condomínio. Só o Admin da plataforma; o suporte recebe `403`. Rota da plataforma: não leva `X-Condominio-Id` nem `X-Unidade-Id`; o condomínio, quando houver, vai no caminho.'
