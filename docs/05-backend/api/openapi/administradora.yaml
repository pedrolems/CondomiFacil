      - US-CO-02
  /v1/administradora/reclamacoes/{reclamacao_id}/decisao:
    post:
      operationId: administradoraDecidirReclamacao
      summary: Valida ou nega uma reclamação
      description: Só quando a tabela 5.1 atribui à administradora (por exemplo, síndico alvo sem subsíndico, RN-RC-03). Liberada com a resposta do alvo ou após o prazo sem resposta (RN-RC-04). Negativa exige motivo da lista; motivo com penalidade exige justificativa (RN-RC-05). A decisão aplica pontos (RN-SC-03) e notifica o alvo sem revelar o reclamante (RN-RC-10). Decisão da administradora não tem recurso no app (RN 5.3). O recurso de quem perdeu pontos é decidido em `comum.yaml` (`/v1/recursos`, RN-RC-07). Ação auditada (SEG-08). O suporte da plataforma não vê reclamações nem scores e recebe `403` nesta operação (PRD 3, `01-backend.md` 3.3, SEG-13).
