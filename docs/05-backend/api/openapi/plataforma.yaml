        iniciado_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        encerrado_em:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          - type: 'null'
        finalidade:
          type: string
          examples:
          - Atender solicitação de cadastro de moradores.
        recurso_acessado:
          type:
          - string
          - 'null'
          description: Tela ou recurso acessado, preenchido pelo servidor (arquitetura 4.4).
    AuditoriaPlataformaItem:
