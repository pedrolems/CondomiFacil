              autor_nome:
                type: string
              urgencia_anterior:
                oneOf:
                - $ref: '#/components/schemas/UrgenciaChamadoSindico'
                - type: 'null'
              urgencia_nova:
                oneOf:
                - $ref: '#/components/schemas/UrgenciaChamadoSindico'
                - type: 'null'
              estado_anterior:
                oneOf:
                - $ref: ./componentes/enums.yaml#/components/schemas/EstadoChamado
                - type: 'null'
              estado_novo:
                oneOf:
                - $ref: ./componentes/enums.yaml#/components/schemas/EstadoChamado
                - type: 'null'
          description: 'Ajustes de urgência e de estado: quem, quando, de e para (RN-CH-11).'
        conclusao:
          oneOf:
          - type: object
            description: Conclusão efetiva. A avaliação mostra nota, comentário e base ao síndico e ao subsíndico
              (RN-CH-19).
            required:
            - ciclo
            - concluida_em
            - atendente_nome
            - fotos_arquivo_ids
            - avaliacao
            properties:
              ciclo:
                type: integer
              concluida_em:
                $ref: ./componentes/comum.yaml#/components/schemas/DataHora
              atendente_nome:
                type:
                - string
                - 'null'
              fotos_arquivo_ids:
                type: array
                items:
                  $ref: ./componentes/comum.yaml#/components/schemas/Uuid
                maxItems: 5
              avaliacao:
                oneOf:
                - $ref: '#/components/schemas/AvaliacaoChamadoSindico'
                - type: 'null'
          - type: 'null'
    AjustarUrgenciaChamadoSindico:
      type: object
      required:
      - urgencia
      properties:
        urgencia:
          $ref: '#/components/schemas/UrgenciaChamadoSindico'
    IndicarEmpresaChamadoSindico:
      type: object
      required:
      - empresa_id
      properties:
        empresa_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
    AvancarEstadoChamadoSindico:
      type: object
      required:
      - estado
      properties:
        estado:
          type: string
          enum:
          - orcamento
          - agendado
          description: Novo estado. A conclusão tem operação própria.
    ConcluirChamadoSindico:
      type: object
      required: []
      properties:
        fotos_arquivo_ids:
          type: array
          items:
            $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          maxItems: 5
          description: Fotos do serviço, opcionais, até 5 (RN-CH-14), já enviadas por `/v1/arquivos/*`.
    AvaliacaoAtendimentoAgregadoSindico:
      type: object
      description: Agregado por funcionário de limpeza ou por empresa de manutenção. Sem identificar quem avaliou.
      required:
      - atendente_id
      - atendente_nome
      - media
      - quantidade
      - distribuicao
      - avaliacao_baixa_nos_ultimos_30_dias
      properties:
        atendente_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        atendente_nome:
          type: string
        media:
          type: number
          minimum: 1
          maximum: 5
        quantidade:
          type: integer
        distribuicao:
          type: array
          items:
            type: object
            required:
            - estrelas
            - quantidade
            properties:
              estrelas:
                type: integer
                minimum: 1
                maximum: 5
              quantidade:
                type: integer
          description: Quantidade por número de estrelas (RN-CH-19).
        avaliacao_baixa_nos_ultimos_30_dias:
          type: boolean
          description: Selo "Avaliações baixas" (UF 8.5).
    AvaliacaoBaixaSindico:
      type: object
      description: Avaliação baixa (1 ou 2 estrelas) com o comentário (RN-CH-18). O aviso nunca vai ao funcionário
        nem à empresa.
      required:
      - chamado_id
      - categoria
      - local
      - nota
      - base
      - comentario
      - avaliada_em
      - atendente_nome
      - atendente_tipo
      properties:
        chamado_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        categoria:
          type: string
        local:
          type: string
        nota:
          type: integer
          minimum: 1
          maximum: 2
        base:
          $ref: '#/components/schemas/BaseAvaliacaoSindico'
        comentario:
          type:
          - string
          - 'null'
        avaliada_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        atendente_nome:
          type: string
        atendente_tipo:
          type: string
          enum:
          - funcionario
          - empresa
    CriarEmpresaManutencaoSindico:
      type: object
