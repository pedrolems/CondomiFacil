      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvaliarAtendimentoMorador'
            example:
              nota: 2
              base: vi_as_fotos
              comentario: A faixa de segurança não foi recolocada.
      responses:
        '201':
          description: Avaliação registrada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
