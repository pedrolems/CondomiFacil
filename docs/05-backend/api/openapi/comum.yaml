          enum:
          - PUT
        url_envio:
          type: string
          format: uri
          description: 'URL assinado de envio. Expira em minutos (número: lacuna).'
        cabecalhos:
          type: object
          additionalProperties:
            type: string
          description: Cabeçalhos que o cliente deve repetir no PUT.
        expira_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
    ArquivoComum:
      type: object
      required:
      - id
      - modulo
      - tipo_midia
      - tamanho_bytes
      - criado_em
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        modulo:
          $ref: '#/components/schemas/ModuloArquivoComum'
        tipo_midia:
          type: string
        tamanho_bytes:
