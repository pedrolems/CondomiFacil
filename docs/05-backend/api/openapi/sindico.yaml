        estado:
          $ref: ./componentes/enums.yaml#/components/schemas/EstadoReclamacao
        aberta_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        alvo:
          $ref: '#/components/schemas/AlvoReclamacaoSindico'
        reclamante:
          $ref: '#/components/schemas/ReclamanteReclamacaoSindico'
        voce_e_o_julgador:
          type: boolean
          description: Verdadeiro quando você é o julgador vigente desta reclamação.
        semaforo:
          oneOf:
          - $ref: '#/components/schemas/SemaforoPrazoReclamacaoSindico'
          - type: 'null'
    MensagemReclamacaoSindico:
      type: object
      description: Mensagem da conversa com o alvo (comunicado individual vinculado, RN-CO-04). Nunca traz o nome
        do reclamante ao alvo.
      required:
      - autor_papel
      - texto
      - enviada_em
      properties:
        autor_papel:
          type: string
          enum:
          - julgador
          - alvo
        texto:
          type: string
        enviada_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
    DecisaoReclamacaoSindico:
      type: object
      required:
