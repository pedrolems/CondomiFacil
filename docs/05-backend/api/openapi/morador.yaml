    ComunicadoMorador:
      type: object
      required:
      - id
      - tipo
      - titulo
      - enviado_em
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        tipo:
          type: string
          enum:
          - geral
          - individual
        titulo:
          type: string
        resumo:
          oneOf:
          - type: string
          - type: 'null'
        autor:
          type: object
          required:
          - nome
          properties:
            nome:
              type: string
            papel:
              oneOf:
              - type: string
              - type: 'null'
        enviado_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        lido_em:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          - type: 'null'
        aceita_resposta:
          type: boolean
          description: Só comunicado individual aceita resposta (RN-CO-03).
        reclamacao_recebida_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
        mensagens:
          type: array
          items:
            $ref: '#/components/schemas/MensagemComunicadoMorador'
          description: Só no detalhe; texto inicial e respostas.
    OpcaoVotacaoMorador:
      type: object
      required:
      - id
      - texto
      - ordem
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        texto:
          type: string
        ordem:
          type: integer
    MinhaSituacaoDeVotoMorador:
      type: object
      description: Situação do usuário nesta votação. Nunca contém a opção escolhida (SEG-06).
      required:
      - pode_votar
      properties:
        pode_votar:
          type: boolean
        qualidade:
          oneOf:
          - type: string
            enum:
            - proprietario
            - inquilino
            - procurador
          - type: 'null'
        motivo:
          oneOf:
          - type: string
            enum:
            - nao_vota_pela_unidade
            - inquilino_pauta_com_despesa_extraordinaria
            - unidade_em_atraso
            - unidade_ja_votou
            - votacao_encerrada
          - type: 'null'
        mensagem:
          oneOf:
          - type: string
            description: Texto de UF 11.1. `unidade_em_atraso` só aparece para quem vota pela unidade e para os responsáveis financeiros dela (RN-VO-16, RN-FI-11).
          - type: 'null'
        aviso:
          oneOf:
          - type: string
            description: 'Aviso ao inquilino: se o proprietário votar até o encerramento, o voto dele vale no lugar do seu (RN-VO-18).'
          - type: 'null'
        unidade_representada_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
    VotacaoDaPautaMorador:
      type: object
      required:
      - id
      - estado
      - opcoes
      - minha_situacao
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        estado:
          type: string
          description: Estados de reunião, votação e eleição não estão enumerados nos docs; `Encerrada`, `Sem quórum` e `Empate` são citados em MER/DER 4.9 (lacuna).
        quorum_regra:
          oneOf:
          - type: string
          - type: 'null'
        abre_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        encerra_em:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          - type: 'null'
        opcoes:
          type: array
          items:
            $ref: '#/components/schemas/OpcaoVotacaoMorador'
        minha_situacao:
          $ref: '#/components/schemas/MinhaSituacaoDeVotoMorador'
        resultado:
          oneOf:
          - type: object
            required:
            - situacao
            - opcoes
            properties:
              situacao:
                type: string
                enum:
                - encerrada
                - sem_quorum
                - empate
              opcoes:
                type: array
                items:
                  type: object
                  required:
                  - opcao_id
                  - texto
                  - quantidade
                  properties:
                    opcao_id:
                      $ref: ./componentes/comum.yaml#/components/schemas/Uuid
                    texto:
                      type: string
                    quantidade:
                      type: integer
          - type: 'null'
        resultado_rotulo:
          oneOf:
          - type: string
            description: '"O resultado aparece quando a reunião for encerrada." enquanto não há resultado (RN-VO-03).'
          - type: 'null'
    PautaReuniaoMorador:
      type: object
      required:
      - id
      - ordem
      - titulo
      - tipo
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        ordem:
          type: integer
        titulo:
          type: string
        descricao:
          type: string
        tipo:
          type: string
