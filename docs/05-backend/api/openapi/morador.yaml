      - nome
      properties:
        nome:
          type: string
          minLength: 1
        documento:
          type: string
    ListaVisitantesMorador:
      type: object
      required:
      - id
      - nome
      - data
      - estado
      - pessoas
      - chegaram
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        nome:
          type: string
        data:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
        inicio_faixa:
          oneOf:
          - type: string
          - type: 'null'
        fim_faixa:
          oneOf:
          - type: string
          - type: 'null'
        local:
          oneOf:
          - type: string
            description: Local ou motivo, opcional.
          - type: 'null'
        reserva_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
        estado:
          type: string
          description: 'Estados da lista não são definidos nas RN: lacuna. Exemplos: ativa, cancelada.'
        pessoas:
          type: integer
        chegaram:
          type: integer
          description: Contador "N pessoas, M chegaram" (RN-VI-17).
        itens:
          type: array
          items:
            type: object
            required:
            - visitante_id
            - nome
            - estado
            properties:
              visitante_id:
                $ref: ./componentes/comum.yaml#/components/schemas/Uuid
              nome:
                type: string
              estado:
                $ref: ./componentes/enums.yaml#/components/schemas/EstadoVisita
        avisos:
          type: array
          items:
            type: object
            required:
            - codigo
            - mensagem
            properties:
              codigo:
                type: string
              mensagem:
                type: string
          description: 'Avisos que não bloqueiam: capacidade da área e nome repetido (RN-VI-12, RN-VI-14).'
    CriarListaVisitantesMorador:
      type: object
      description: Quando `reserva_id` é informado, data, faixa e local vêm da reserva e não são editáveis (RN-VI-14).
      required:
      - nome
      - data
      - pessoas
      properties:
        nome:
          type: string
          minLength: 1
        data:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
        inicio_faixa:
          type: string
        fim_faixa:
          type: string
        local:
          type: string
        reserva_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        pessoas:
          type: array
          items:
            $ref: '#/components/schemas/PessoaListaMorador'
          minItems: 1
    ModeloListaMorador:
      type: object
      required:
      - id
      - nome
      - pessoas
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        nome:
          type: string
        pessoas:
          type: array
          items:
            $ref: '#/components/schemas/PessoaListaMorador'
    EncomendaMorador:
      type: object
      required:
      - id
      - remetente
      - estado
      - recebida_em
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        remetente:
          type: string
        estado:
          $ref: ./componentes/enums.yaml#/components/schemas/EstadoEncomenda
        recebida_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        foto_etiqueta_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
        retirada_em:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          - type: 'null'
        devolvida_em:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          - type: 'null'
    EntregaEsperadaMorador:
      type: object
      required:
      - id
      - data_esperada
      - estado
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        data_esperada:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
        descricao:
          oneOf:
          - type: string
            maxLength: 60
          - type: 'null'
        origem:
          oneOf:
          - type: string
            enum:
            - amazon
            - correios
            - mercado_livre
            - shopee
            - ifood_entregador
            - outra
            description: Origem (RN-EN-07). `ifood_entregador` é só aviso à portaria (RN-EN-12).
          - type: 'null'
        origem_outra:
          oneOf:
          - type: string
            maxLength: 30
          - type: 'null'
        inicio_faixa:
          oneOf:
          - type: string
            pattern: ^[0-2][0-9]:[0-5][0-9]$
          - type: 'null'
        fim_faixa:
          oneOf:
          - type: string
            pattern: ^[0-2][0-9]:[0-5][0-9]$
          - type: 'null'
        estado:
          $ref: ./componentes/enums.yaml#/components/schemas/EstadoEntregaEsperada
        pode_reagendar:
          type: boolean
          description: Verdadeiro em "Não chegou" (RN-EN-13).
    CriarEntregaEsperadaMorador:
      type: object
      description: 'Só a data é obrigatória (RN-EN-07). Faixa: as duas horas juntas, com o fim depois do início.'
      required:
      - data_esperada
      properties:
        data_esperada:
          allOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Data
          description: De hoje a 30 dias.
        descricao:
          type: string
          maxLength: 60
        origem:
          type: string
          enum:
          - amazon
          - correios
          - mercado_livre
          - shopee
          - ifood_entregador
          - outra
          description: Origem (RN-EN-07). `ifood_entregador` é só aviso à portaria (RN-EN-12).
        origem_outra:
          type: string
          maxLength: 30
        inicio_faixa:
          type: string
          pattern: ^[0-2][0-9]:[0-5][0-9]$
        fim_faixa:
          type: string
          pattern: ^[0-2][0-9]:[0-5][0-9]$
    ChamadoMorador:
      type: object
      description: Chamado que o usuário abriu (RF-CH-05). Não traz o nome de quem atende.
      required:
      - id
      - tipo
      - categoria
      - descricao
      - urgencia
      - estado
      - aberto_em
      - avaliacao_situacao
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        tipo:
          type: string
          enum:
          - limpeza
          - manutencao
        categoria:
          type: string
        local:
          oneOf:
          - type: string
          - type: 'null'
        descricao:
          type: string
        urgencia:
          type: string
          enum:
          - alta
          - media
          - leve
          description: Urgência obrigatória, sem valor pré-selecionado (RN-CH-09). Alta em vermelho, média em amarelo e leve em verde, sempre com texto (RN-CH-10).
        estado:
          $ref: ./componentes/enums.yaml#/components/schemas/EstadoChamado
        aberto_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        fotos:
          type: array
          items:
            $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          description: Identificadores de arquivo das fotos de abertura (envio por `/v1/arquivos/*`).
        fotos_conclusao:
          type: array
          items:
            $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          description: Fotos do serviço concluído, até 5 (RN-CH-14).
        concluido_em:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          - type: 'null'
        pode_reabrir:
          type: boolean
          description: Dentro das 48h da conclusão efetiva (RN-CH-07).
        reabrir_ate:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          - type: 'null'
        avaliacao_situacao:
          type: string
          enum:
          - nao_aplicavel
          - pendente
          - avaliado
          - prazo_encerrado
          description: Marcação extra, não é estado (RN 9.2). `prazo_encerrado` vem de UF 8.4 (7 dias, RN-CH-17).
        avaliar_ate:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          - type: 'null'
        avaliacao:
          oneOf:
          - type: object
            description: A própria avaliação do usuário, definitiva (RN-CH-17).
            required:
            - nota
            - base
            - avaliada_em
            properties:
              nota:
                type: integer
                minimum: 1
                maximum: 5
              base:
                type: string
                enum:
                - vi_as_fotos
                - conferi_pessoalmente
              comentario:
                oneOf:
                - type: string
                  maxLength: 500
                - type: 'null'
              avaliada_em:
                $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          - type: 'null'
        ajustes_de_urgencia:
          type: array
          items:
            type: object
            required:
            - de
            - para
            - em
            properties:
              de:
                type: string
                enum:
                - alta
                - media
                - leve
                description: Urgência anterior.
              para:
                type: string
                enum:
                - alta
                - media
                - leve
                description: Urgência nova.
              em:
                $ref: ./componentes/comum.yaml#/components/schemas/DataHora
              por:
                type: string
                description: Nome de quem ajustou (síndico).
          description: Cada ajuste registra quem, quando e de/para (RN-CH-11).
    AbrirChamadoMorador:
      type: object
      required:
      - tipo
      - categoria
      - descricao
      - urgencia
      properties:
        tipo:
          type: string
          enum:
          - limpeza
          - manutencao
        categoria:
          type: string
          minLength: 1
        local:
          type: string
        descricao:
          type: string
          minLength: 1
        urgencia:
          type: string
          enum:
          - alta
          - media
          - leve
          description: Urgência obrigatória, sem valor pré-selecionado (RN-CH-09). Alta em vermelho, média em amarelo e leve em verde, sempre com texto (RN-CH-10).
        fotos:
          type: array
          items:
            $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          description: 'Fotos já enviadas por `/v1/arquivos/*` (opcionais, RN-CH-03). Limite na abertura: lacuna.'
    AvaliarAtendimentoMorador:
      type: object
      required:
      - nota
      - base
      properties:
        nota:
          type: integer
          description: 1 a 5 estrelas.
          minimum: 1
          maximum: 5
        base:
          type: string
          enum:
          - vi_as_fotos
          - conferi_pessoalmente
          description: '`vi_as_fotos` só vale se há fotos; sem fotos a base é `conferi_pessoalmente` (RN-CH-16).'
        comentario:
          type: string
          maxLength: 500
    AlvoReclamacaoMorador:
      type: object
      required:
      - tipo
      - id
      - rotulo
      properties:
        tipo:
          type: string
          enum:
          - funcionario
          - unidade
          - sindico
          - subsindico
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        rotulo:
          type: string
          description: Nome do funcionário, identificação da unidade ou cargo.
    CategoriaReclamacaoMorador:
      type: object
      required:
      - id
      - nome
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        nome:
          type: string
    ReclamacaoMorador:
      type: object
      description: Reclamação aberta pelo próprio usuário. Não traz pontos de score (ADR-010).
      required:
      - id
      - alvo
      - categoria
      - descricao
      - data_ocorrencia
      - estado
      - aberta_em
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        alvo:
          $ref: '#/components/schemas/AlvoReclamacaoMorador'
        categoria:
          type: string
        descricao:
          type: string
        data_ocorrencia:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
        fotos:
          type: array
          items:
            $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        estado:
          $ref: ./componentes/enums.yaml#/components/schemas/EstadoReclamacao
        aberta_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        prazo:
          oneOf:
          - type: object
            description: Semáforo do prazo de decisão. Só em Aberta e Em conversa com o alvo; nulo em Pendente e depois da decisão (RN-RC-17, RN-RC-19).
            required:
            - situacao
            - rotulo
            properties:
              situacao:
                type: string
                enum:
                - no_prazo
                - prazo_se_esgotando
                - prazo_esgotado
              rotulo:
                type: string
                description: Texto e ícone vão além da cor.
          - type: 'null'
        decisao:
          oneOf:
          - type: object
            required:
            - resultado
            - decidida_em
            properties:
              resultado:
                type: string
                enum:
                - validada
                - negada
              decidida_em:
                $ref: ./componentes/comum.yaml#/components/schemas/DataHora
              motivo_negativa:
                oneOf:
                - type: string
                  enum:
                  - nao_procede_boa_fe
                  - desproporcional
                  - falsa_ou_ma_fe
                  - duplicada
                - type: 'null'
          - type: 'null'
    AbrirReclamacaoMorador:
      type: object
      required:
      - alvo
      - categoria_id
      - descricao
      - data_ocorrencia
      properties:
        alvo:
          type: object
          required:
          - tipo
          - id
          properties:
            tipo:
              type: string
              enum:
              - funcionario
              - unidade
              - sindico
              - subsindico
            id:
              $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        categoria_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        descricao:
          type: string
          minLength: 1
        data_ocorrencia:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
        fotos:
          type: array
          items:
            $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          description: Foto opcional, enviada por `/v1/arquivos/*`.
    ReclamacaoRecebidaMorador:
      type: object
      description: Reclamação em que o usuário (ou a unidade dele) é o alvo. Nunca traz o autor, a conversa de outros nem o semáforo (RN-RC-01, RN-RC-19, ADR-010).
      required:
      - id
      - categoria
      - descricao
      - data_ocorrencia
      - estado
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        categoria:
          type: string
        descricao:
          type: string
        data_ocorrencia:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
        estado:
          $ref: ./componentes/enums.yaml#/components/schemas/EstadoReclamacao
        comunicado_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
        responder_ate:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          - type: 'null'
        decisao:
          oneOf:
          - type: object
            required:
            - resultado
            - decidida_em
            properties:
              resultado:
                type: string
                enum:
                - validada
                - negada
              decidida_em:
                $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          - type: 'null'
    MensagemComunicadoMorador:
      type: object
      required:
      - id
      - autor
      - texto
      - enviada_em
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        autor:
          type: object
          required:
          - nome
          properties:
            nome:
              type: string
            papel:
              oneOf:
              - type: string
                description: Por exemplo, síndico.
              - type: 'null'
            eu:
              type: boolean
        texto:
          type: string
        enviada_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
    PesquisaMensalMorador:
      type: object
      required:
      - competencia
      - estado
      - funcionarios
      properties:
        competencia:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}$
        estado:
          type: string
          enum:
          - aberta
          - fechada
          description: Abre no primeiro dia e fecha no último, às 23h59 (RN-PE-01).
        encerra_em:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          - type: 'null'
        funcionarios:
          type: array
          items:
            type: object
            required:
            - funcionario_id
            - nome
            - setor
            properties:
              funcionario_id:
                $ref: ./componentes/comum.yaml#/components/schemas/Uuid
              nome:
                type: string
              setor:
                type: string
              minha_nota:
                oneOf:
                - type: integer
                  minimum: 1
                  maximum: 5
                - type: 'null'
              meu_comentario:
                oneOf:
                - type: string
                - type: 'null'
