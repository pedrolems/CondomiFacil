      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        usuario:
          type: object
          required:
          - id
          - nome
          properties:
            id:
              $ref: ./componentes/comum.yaml#/components/schemas/Uuid
            nome:
              type: string
              examples:
              - Rita Campos
        condominio_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        inicio:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        fim:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          - type: 'null'
        concedido_por:
          type: object
          required:
          - nome
          properties:
            nome:
              type: string
              examples:
              - Admin da Plataforma
    AutorizacaoSuporteEntradaPlataforma:
      type: object
      required:
      - usuario_id
      - condominio_id
      properties:
        usuario_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        condominio_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        inicio:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
    AbrirContextoSuporteEntradaPlataforma:
      type: object
      required:
      - finalidade
      properties:
        finalidade:
          type: string
          description: Motivo do acesso, registrado (SEG-13).
          examples:
          - Atender solicitação de cadastro de moradores.
    AcessoSuportePlataforma:
      type: object
      description: Registro do acesso. Nunca guarda conteúdo de reclamação nem de score (MER/DER 4.3).
      required:
      - id
      - autorizacao_id
      - condominio_id
      - iniciado_em
      - finalidade
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        autorizacao_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        condominio_id:
          allOf:
