        inicio_previsto:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        local:
          type: string
        estado:
          type: string
          description: 'Estado da reunião. O ciclo de vida não está definido nos docs (lacuna): os códigos usados
            nos exemplos (`convocada`, `encerrada`) são Proposta, sem fonte literal.'
        fim_efetivo:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
