        ata_arquivo_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
        presenca_arquivo_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
        pautas:
          type: array
          items:
            $ref: '#/components/schemas/PautaSindico'
