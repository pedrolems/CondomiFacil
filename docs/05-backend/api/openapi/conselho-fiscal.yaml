openapi: 3.1.0
info:
  title: CondomiFacil API - interface do conselho fiscal
  version: 0.1.0-proposta
  description: '**Proposta de 10/11/2026**, não aceita pelo Pedro. Tudo o que não vem de decisão do Pedro ou do
    PRD (caminhos, campos, códigos de erro, filtros) é Proposta; o guia `../01-guia-da-api.md` é a fonte das convenções.


    Interface do **membro do conselho fiscal** (`/v1/conselho-fiscal/*`). Os membros também são moradores e usam
    `morador.yaml` para o que é de morador (PRD 3). Aqui ficam:


    - **Finanças do condomínio, só leitura, comentário e exportação** (Menu > Finanças do condomínio; RF-FI-17,
    RF-FI-21, RF-FI-22, RF-FI-24, RN-FI-29). Nenhuma operação escreve em lançamento: quem lança, fecha e estorna
    é a administradora, e mês fechado só muda por estorno (RN-FI-28). Telas e exportações não trazem unidade nem
    responsável financeiro (RN-FI-30, SEG-17).

    - **Julgamento de reclamações em primeira instância** nos casos em que o conselho julga: reclamação contra o
    síndico quando o condomínio não tem subsíndico nem administradora (tabela 5.1, RN-RC-03). Vê identidade do reclamante
    e do alvo e conversa com o alvo (PRD 3); o score vem do endpoint único `GET /v1/score` de `comum.yaml` (ADR-010).
    O recurso (RN-RC-07, RN-RC-14) é criado, consultado e decidido por `/v1/recursos` de `comum.yaml`; decisão do
    conselho não tem recurso no app (RN 5.3).


    Conselho fiscal não envia comunicados (exceto a conversa com o alvo de reclamação, RN-CO-04), não convoca reunião
    e não tem as demais funções de síndico.'
tags:
- name: financas
  description: 'Finanças do condomínio: leitura, comentário e exportação.'
- name: convivencia
  description: Reclamações que o conselho fiscal julga em primeira instância.
paths:
  /v1/conselho-fiscal/reclamacoes:
    get:
      operationId: conselhoFiscalListarReclamacoes
      summary: Lista as reclamações que você pode consultar como julgador
      description: 'Painel do julgador com identidade do reclamante e semáforo de prazo (RF-RS-03, RF-RS-16); reclamação
        contra você ou sua unidade nunca aparece (RN-RC-11, RN-RC-14). Conselho fiscal julga reclamação contra o
        síndico ou a unidade dele só quando o condomínio não tem subsíndico nem administradora (tabela 5.1, RN-RC-03); fora desses
        casos a lista vem vazia e o acesso direto responde `403`. O score do reclamante e do alvo não vem neste
        DTO: o julgador o consulta no endpoint único `GET /v1/score` de `comum.yaml` com `escopo=reclamacao` (RF-RS-03,
        ADR-010, RN-SC-02); o painel faz chamadas adicionais a `/v1/score`, e devolver em lote é ponto a avaliar.
        O score é referência, não decide sozinho (RN-SC-11). `ordenar=score_reclamante` e `score_alvo` ordenam por
        um valor que este DTO não mostra (o valor vem de `/v1/score`).'
      tags:
      - convivencia
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: ./componentes/comum.yaml#/components/parameters/Limite
      - $ref: ./componentes/comum.yaml#/components/parameters/Cursor
      - $ref: '#/components/parameters/EstadoReclamacaoFiltroConselhoFiscal'
      - $ref: '#/components/parameters/AlvoReclamacaoFiltroConselhoFiscal'
      - $ref: '#/components/parameters/SemaforoFiltroConselhoFiscal'
      - $ref: '#/components/parameters/ALulgarFiltroConselhoFiscal'
      - name: de
        in: query
        required: false
        description: Abertas a partir desta data, inclusive (aaaa-mm-dd).
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
      - name: ate
        in: query
        required: false
        description: Abertas até esta data, inclusive (aaaa-mm-dd).
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
      - name: ordenar
        in: query
        required: false
        description: Ordenação por data ou por score (RF-RS-03). Padrão `aberta_em`. Os campos de score ordenam
          por valor que o DTO não mostra.
        schema:
          type: string
          enum:
          - aberta_em
          - -aberta_em
          - score_reclamante
          - -score_reclamante
          - score_alvo
          - -score_alvo
          default: aberta_em
      responses:
        '200':
          description: Página de reclamações.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                type: object
                required:
                - dados
                - paginacao
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReclamacaoResumoConselhoFiscal'
                  paginacao:
                    $ref: ./componentes/comum.yaml#/components/schemas/Paginacao
              example:
                dados:
                - id: 000000c8-1111-4222-8333-0000000000c8
                  categoria: Barulho
                  gravidade_inicial: leve
                  estado: aberta
                  aberta_em: '2026-11-02T20:10:00-03:00'
                  alvo:
                    tipo: unidade
                    rotulo: Bloco A, 101
                  reclamante:
                    tipo: pessoa
                    vinculo_id: 0000012c-1111-4222-8333-00000000012c
                    nome: Rafaela Duarte
                    unidade_identificacao: Bloco A, 201
                  voce_e_o_julgador: true
                  semaforo:
                    cor: amarelo
                    texto: Prazo se esgotando
                    vence_em: '2026-11-17'
                paginacao:
                  proximo_cursor: null
                  tem_mais: false
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-RS-03
      - RF-RS-04
      - RF-RS-16
      - RN-RC-03
      - RN-RC-08
      - RN-RC-17
      - RN-RC-19
      - RN-SC-02
      - US-RS-04
      - US-RS-07
      - US-RS-08
  /v1/conselho-fiscal/reclamacoes/{reclamacao_id}:
    get:
      operationId: conselhoFiscalObterReclamacao
      summary: Detalha uma reclamação
      description: 'Mostra reclamante, alvo, conversa, decisão e semáforo ao julgador (RN-RC-08, RN-RC-17). Reclamação
        em que você é parte responde `403` (RN-RC-11, RN-RC-14). Conselho fiscal julga reclamação contra o síndico ou a unidade dele
        só quando o condomínio não tem subsíndico nem administradora (tabela 5.1, RN-RC-03); fora desses casos a
        lista vem vazia e o acesso direto responde `403`. O score do reclamante e do alvo não vem neste DTO: o julgador
        o consulta no endpoint único `GET /v1/score` de `comum.yaml` com `escopo=reclamacao` (RF-RS-03, ADR-010,
        RN-SC-02); o painel faz chamadas adicionais a `/v1/score`, e devolver em lote é ponto a avaliar. O score
        é referência, não decide sozinho (RN-SC-11).'
      tags:
      - convivencia
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: '#/components/parameters/ReclamacaoIdConselhoFiscal'
      responses:
        '200':
          description: Reclamação.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReclamacaoConselhoFiscal'
              example:
                id: 000000c8-1111-4222-8333-0000000000c8
                categoria: Barulho
                gravidade_inicial: leve
                estado: aberta
                aberta_em: '2026-11-02T20:10:00-03:00'
                alvo:
                  tipo: unidade
                  rotulo: Bloco A, 101
                reclamante:
                  tipo: pessoa
                  vinculo_id: 0000012c-1111-4222-8333-00000000012c
                  nome: Rafaela Duarte
                  unidade_identificacao: Bloco A, 201
                voce_e_o_julgador: true
                semaforo:
                  cor: amarelo
                  texto: Prazo se esgotando
                  vence_em: '2026-11-17'
                descricao: Música alta depois da meia-noite.
                data_ocorrencia: '2026-11-01'
                alvo_respondeu: false
                decisao_liberada: false
                decisao_liberada_em: '2026-11-12T20:10:00-03:00'
                mensagens: []
                decisao: null
                recurso_id: null
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: '#/components/responses/Erro403ConselhoNaoJulga'
        '404':
          $ref: ./componentes/comum.yaml#/components/responses/Erro404
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-RS-03
      - RF-RS-05
      - RF-RS-16
      - RN-RC-01
      - RN-RC-08
      - RN-RC-17
      - RN-SC-02
      - US-RS-02
      - US-RS-08
  /v1/conselho-fiscal/reclamacoes/{reclamacao_id}/conversa:
    post:
      operationId: conselhoFiscalIniciarConversaReclamacao
      summary: Inicia a conversa com o alvo
      description: O julgador, seja quem for, inicia a conversa com o alvo antes de decidir; é um comunicado individual
        vinculado e a única exceção a RN-CO-01 (RN-RC-04, RN-CO-04). Na unidade, a conversa é com o morador habilitado
        e, na desocupada, com o proprietário. A mensagem ao alvo nunca revela o reclamante (RN-RC-10). Conselho
        fiscal julga reclamação contra o síndico ou a unidade dele só quando o condomínio não tem subsíndico nem administradora (tabela
        5.1, RN-RC-03); fora desses casos o acesso responde `403`. Em recurso, o conselho
        julga só os casos de RN-RC-14 (quem é parte nunca julga o recurso), por `/v1/recursos` de `comum.yaml`.
      tags:
      - convivencia
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: '#/components/parameters/ReclamacaoIdConselhoFiscal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IniciarConversaReclamacaoConselhoFiscal'
            example:
              texto: Recebemos uma reclamação sobre barulho. Pode nos contar o que houve?
      responses:
        '201':
          description: Conversa iniciada; reclamação em conversa com o alvo.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReclamacaoConselhoFiscal'
              example:
                id: 000000c8-1111-4222-8333-0000000000c8
                categoria: Barulho
                gravidade_inicial: leve
                estado: em_conversa_com_o_alvo
                aberta_em: '2026-11-02T20:10:00-03:00'
                alvo:
                  tipo: unidade
                  rotulo: Bloco A, 101
                reclamante:
                  tipo: pessoa
                  vinculo_id: 0000012c-1111-4222-8333-00000000012c
                  nome: Rafaela Duarte
                  unidade_identificacao: Bloco A, 201
                voce_e_o_julgador: true
                semaforo:
                  cor: amarelo
                  texto: Prazo se esgotando
                  vence_em: '2026-11-17'
                descricao: Música alta depois da meia-noite.
                data_ocorrencia: '2026-11-01'
                alvo_respondeu: false
                decisao_liberada: false
                decisao_liberada_em: '2026-11-12T20:10:00-03:00'
                mensagens:
                - autor_papel: julgador
                  texto: Recebemos uma reclamação sobre barulho. Pode nos contar o que houve?
                  enviada_em: '2026-11-03T10:00:00-03:00'
                decisao: null
                recurso_id: null
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: '#/components/responses/Erro403ConselhoNaoJulga'
        '404':
          $ref: ./componentes/comum.yaml#/components/responses/Erro404
        '409':
          $ref: '#/components/responses/Erro409ConversaConselhoFiscal'
        '422':
          $ref: '#/components/responses/Erro422ConversaConselhoFiscal'
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-RS-05
      - RF-RS-07
      - RN-RC-04
      - RN-RC-10
      - RN-RC-13
      - RN-CO-04
      - US-RS-02
  /v1/conselho-fiscal/reclamacoes/{reclamacao_id}/decisao:
    post:
      operationId: conselhoFiscalDecidirReclamacao
      summary: Valida ou nega a reclamação
      description: Liberada com a resposta do alvo ou após 5 dias sem resposta ("alvo não respondeu"); negar exige
        motivo da lista e, com penalidade, justificativa (RN-RC-04, RN-RC-05, RN-RC-09). Os pontos são aplicados
        pelo sistema (RN 4.1) e abrem o prazo de recurso de 7 dias; decisão da administradora ou do conselho fiscal
        não tem recurso no app (RN 5.3). O alvo é notificado sem a identidade do reclamante (RN-RC-10). Conselho
        fiscal julga reclamação contra o síndico ou a unidade dele só quando o condomínio não tem subsíndico nem administradora (tabela
        5.1, RN-RC-03); fora desses casos o acesso responde `403`. Em recurso, o conselho
        julga só os casos de RN-RC-14 (quem é parte nunca julga o recurso), por `/v1/recursos` de `comum.yaml`.
      tags:
      - convivencia
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: '#/components/parameters/ReclamacaoIdConselhoFiscal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecidirReclamacaoConselhoFiscal'
            example:
              resultado: negada
              motivo_negativa: nao_procede_boa_fe
      responses:
        '200':
          description: Reclamação decidida.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReclamacaoConselhoFiscal'
              example:
                id: 000000c8-1111-4222-8333-0000000000c8
                categoria: Barulho
                gravidade_inicial: leve
                estado: negada
                aberta_em: '2026-11-02T20:10:00-03:00'
                alvo:
                  tipo: unidade
                  rotulo: Bloco A, 101
                reclamante:
                  tipo: pessoa
                  vinculo_id: 0000012c-1111-4222-8333-00000000012c
                  nome: Rafaela Duarte
                  unidade_identificacao: Bloco A, 201
                voce_e_o_julgador: true
                semaforo: null
                descricao: Música alta depois da meia-noite.
                data_ocorrencia: '2026-11-01'
                alvo_respondeu: true
                decisao_liberada: true
                decisao_liberada_em: '2026-11-12T20:10:00-03:00'
                mensagens: []
                decisao:
                  resultado: negada
                  motivo_negativa: nao_procede_boa_fe
                  gravidade_final: null
                  justificativa: null
                  decidida_em: '2026-11-05T09:30:00-03:00'
                recurso_id: null
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: '#/components/responses/Erro403ConselhoNaoJulga'
        '404':
          $ref: ./componentes/comum.yaml#/components/responses/Erro404
        '409':
          $ref: '#/components/responses/Erro409DecisaoConselhoFiscal'
        '422':
          $ref: '#/components/responses/Erro422DecisaoConselhoFiscal'
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-RS-06
      - RF-RS-07
      - RF-RS-08
      - RN-RC-04
      - RN-RC-05
      - RN-RC-09
      - RN-RC-10
      - RN-SC-05
      - RN-SC-11
      - US-RS-03
  /v1/conselho-fiscal/financas/resumo:
    get:
      operationId: conselhoFiscalObterResumoFinanceiro
      summary: Consulta o resumo financeiro do condomínio
      description: 'Receitas, despesas e saldo do período, despesas por categoria e evolução (RF-FI-17, RN-FI-21).
        Só leitura: o conselho fiscal não lança, edita, fecha nem estorna lançamentos (RN-FI-29). Receitas de cobrança
        vêm agregadas, sem unidade nem responsável financeiro (RN-FI-30, SEG-17). **Perfil:** membro do conselho
        fiscal, cadastrado pela administradora ou pelo suporte (PRD 3); morador comum, proprietário não residente
        e funcionário recebem `403`.'
      tags:
      - financas
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: '#/components/parameters/MesReferenciaFinancasConselhoFiscal'
      - $ref: '#/components/parameters/PeriodoMesesFinancasConselhoFiscal'
      responses:
        '200':
          description: Resumo.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumoFinanceiroConselhoFiscal'
              example:
                mes_referencia: 2026-10
                periodo_meses: 1
                receitas_centavos: 4180000
                despesas_centavos: 3560000
                saldo_centavos: 620000
                comparacao_mes_anterior:
                  receitas_centavos: 4100000
                  despesas_centavos: 3700000
                  saldo_centavos: 400000
                receitas_por_categoria:
                - categoria: taxa_condominial
                  valor_centavos: 3900000
                  quantidade_cobrancas_pagas: 117
                - categoria: cobrancas_extras
                  valor_centavos: 280000
                  quantidade_cobrancas_pagas: 14
                despesas_por_categoria:
                - categoria: energia
                  valor_centavos: 820000
                  quantidade_cobrancas_pagas: null
                - categoria: folha_de_funcionarios
                  valor_centavos: 1900000
                  quantidade_cobrancas_pagas: null
                evolucao: null
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: '#/components/responses/Erro403FinancasConselho'
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-FI-17
      - RN-FI-21
      - RN-FI-29
      - RN-FI-30
      - SEG-17
      - SEG-18
      - US-FI-07
  /v1/conselho-fiscal/financas/lancamentos:
    get:
      operationId: conselhoFiscalListarLancamentosFinanceiros
      summary: Lista os lançamentos financeiros do período
      description: 'Filtra por período, categoria, tipo e texto (RF-FI-21). Só leitura: o conselho fiscal não lança,
        edita, fecha nem estorna lançamentos (RN-FI-29). Receitas de cobrança vêm agregadas, sem unidade nem responsável
        financeiro (RN-FI-30, SEG-17). **Perfil:** membro do conselho fiscal, cadastrado pela administradora ou
        pelo suporte (PRD 3); morador comum, proprietário não residente e funcionário recebem `403`.'
      tags:
      - financas
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: ./componentes/comum.yaml#/components/parameters/Limite
      - $ref: ./componentes/comum.yaml#/components/parameters/Cursor
      - $ref: '#/components/parameters/MesReferenciaFinancasConselhoFiscal'
      - $ref: '#/components/parameters/PeriodoMesesFinancasConselhoFiscal'
      - $ref: '#/components/parameters/CategoriaFinanceiraFiltroConselhoFiscal'
      - $ref: '#/components/parameters/TipoLancamentoFiltroConselhoFiscal'
      - name: busca
        in: query
        required: false
        description: Texto livre no fornecedor ou origem e na descrição.
        schema:
          type: string
      - $ref: '#/components/parameters/EstadoLancamentoFiltroConselhoFiscal'
      - name: ordenar
        in: query
        required: false
        description: Ordenação. Padrão `-data_caixa`.
        schema:
          type: string
          enum:
          - data_caixa
          - -data_caixa
          - valor_centavos
          - -valor_centavos
          default: -data_caixa
      responses:
        '200':
