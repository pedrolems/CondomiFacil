openapi: 3.1.0
info:
  title: CondomiFacil API - interface da portaria
  version: 0.1.0-proposta
  description: |-
    **Proposta de 10/11/2026**, não aceita pelo Pedro. Rotas `/v1/portaria/*` do funcionário de portaria, coluna Portaria da matriz de permissões do PRD seção 3.

    **Decidido (PRD e regras de negócio):** a portaria vê a lista do dia só dos blocos que atende (RF-VI-04); registra entrada e saída, também sem internet (RF-VI-06); registra encomendas e retiradas; vê as entregas esperadas do dia; consulta as reservas do dia, marca Em andamento e registra vistoria (Cumprida ou Não comparecimento, inclusive em reserva paga); abre chamados e responde comunicados individuais.

    **Offline:** só entrada e saída de visitantes funcionam sem internet, pela fila de `POST /v1/sync` (`sync.yaml`). Encomendas, reservas, vistoria, chamados e comunicados exigem internet (RN-RE-13, UF 6.3).

    **Tempo real:** a lista é atualizada por WebSocket; os eventos estão em `asyncapi/tempo-real.yaml`.

    **Proposta:** caminhos, nomes de campos, códigos de estado de evento e códigos de erro específicos. Os DTOs não trazem situação financeira, score nem identidade protegida. A autorização é validada nos guards e na RLS, não pela pasta (`01-backend.md` 3.4). Perfil Manutenção não tem operações.

    **Ações atendidas por `comum.yaml`:** "Denunciar conteúdo ofensivo" (RF-RS-14, RN-RC-13, `POST /v1/denuncias`) e "Ver score do síndico e nota dos setores" (RF-RS-12, `GET /v1/score` com `escopo=sindico` e `GET /v1/notas-dos-setores`) são abertas a três ou mais perfis com o mesmo DTO e ficam em `comum.yaml`. Esta interface não tem rota para elas.
tags:
- name: visitantes
  description: Lista do dia, entrada, saída, desfazer e divergência.
- name: encomendas
  description: Encomendas e entregas esperadas.
- name: reservas
  description: Reservas do dia e vistoria.
- name: chamados
  description: Abertura de chamados.
- name: comunicados
  description: Comunicados recebidos e respostas.
- name: condominio
  description: Portarias, blocos e unidades que a portaria atende.
paths:
  /v1/portaria/visitas:
    get:
      operationId: portariaListarVisitas
      summary: Lista os visitantes do dia dos blocos que a portaria atende
      description: Devolve as visitas do dia só dos blocos que a portaria atende, com busca por nome, unidade e bloco (RF-VI-04, RN-CD-17, RN-OF-01). Pessoas de lista de visitantes vêm com `lista` preenchida; o alerta de bloqueio vem na própria linha (RN-VI-05). O filtro "esperados hoje" é `estado=esperado`. A lista é atualizada por WebSocket (eventos em `asyncapi/tempo-real.yaml`) e, na queda do socket, por consulta incremental (`GET /v1/sync`); sem internet, o app usa a cópia salva (RN-OF-02).
      tags:
      - visitantes
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: ./componentes/comum.yaml#/components/parameters/Limite
      - $ref: ./componentes/comum.yaml#/components/parameters/Cursor
      - name: portaria_id
        in: query
        required: false
        description: 'Portaria a consultar. Padrão: as portarias do funcionário (`funcionario_portaria`). Proposta: a cardinalidade por turno não está definida.'
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        example: 1e4f6a73-2b95-4c08-a7d1-8f3c0e5b9d26
      - name: estado
        in: query
        required: false
        description: Um ou mais estados, separados por vírgula.
        style: form
        explode: false
        schema:
          type: array
          items:
            $ref: ./componentes/enums.yaml#/components/schemas/EstadoVisita
        example:
        - esperado
      - name: busca
        in: query
        required: false
        description: Texto livre no nome do visitante, na unidade ou no nome do bloco.
        schema:
          type: string
        example: Carlos
      - name: bloco_id
        in: query
        required: false
        description: Restringe a um bloco atendido.
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        example: 5a8d2e91-7c4b-4f13-b6a0-2d9e1c8f7a35
      - name: lista_id
        in: query
        required: false
        description: Mostra só as pessoas de uma lista.
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        example: 8b3d5c17-6e2a-4f90-9d14-7a1c3e5b8f20
      - name: ordenar
        in: query
        required: false
        description: 'Ordenação. Padrão `nome` (Proposta: as RN não definem).'
        schema:
          type: string
          enum:
          - nome
          - -nome
          - unidade
          - entrada_em
          - -entrada_em
          default: nome
      responses:
        '200':
          description: Página de visitas do dia.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                type: object
                required:
                - dados
                - paginacao
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/VisitaPortaria'
                  paginacao:
                    $ref: ./componentes/comum.yaml#/components/schemas/Paginacao
              example:
                dados:
                - id: 3f6c1a52-8b1e-4d3a-9a0e-5c1d2b7e9f10
                  estado: esperado
                  dia: '2026-11-10'
                  nome_visitante: Carlos Souza
                  tipo: avulsa
                  unidade:
                    unidade_id: 9c1e7f20-4b3a-4d65-8a12-6e0f5b7c3d41
                    bloco_id: 5a8d2e91-7c4b-4f13-b6a0-2d9e1c8f7a35
                    bloco_nome: Bloco A
                    identificacao: Apto 101
                    rotulo: Bloco A · Apto 101
                  inicio_faixa: '14:00'
                  fim_faixa: '16:00'
                  lista: null
                  alerta_bloqueio: null
                  fora_do_horario_cadastrado: false
                  entrada_em: null
                  saida_em: null
                paginacao:
                  proximo_cursor: null
                  tem_mais: false
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-VI-04
      - RF-VI-15
      - RN-VI-05
      - RN-OF-01
      - RN-CD-17
      - US-VI-03
      - US-VI-08
    post:
      operationId: portariaRegistrarEntradaPorInterfone
      summary: Registra a entrada de visitante não cadastrado, autorizado por interfone
      description: Cria a autorização e a visita já com estado "Autorizado por interfone" (RF-VI-07, RN-VI-04). Nome obrigatório, documento opcional (RN-VI-02). Pessoa bloqueada gera o alerta e exige a decisão da portaria (RN-VI-05). Unidade fora dos blocos da portaria é recusada com o aviso "Esta portaria atende os blocos X e Y." (RN-CD-17; a recusa pela API é Proposta). O morador recebe push (RN-VI-06). Sem internet, esta operação não tem tipo de sincronização definido (lacuna).
      tags:
      - visitantes
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntradaPorInterfonePortaria'
            example:
              nome_visitante: Ana Paula Ribeiro
              unidade_id: 9c1e7f20-4b3a-4d65-8a12-6e0f5b7c3d41
      responses:
        '201':
          description: Entrada registrada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoVisitaPortaria'
              example:
                evento_id: 6d2b9f84-1a7c-4e35-8b09-3c5e7a1d4f62
                tipo: entrada
                registrado_em: '2026-11-10T14:10:00-03:00'
                evento_desfeito_id: null
                visita:
                  id: 3f6c1a52-8b1e-4d3a-9a0e-5c1d2b7e9f10
                  estado: autorizado_por_interfone
                  dia: '2026-11-10'
                  nome_visitante: Ana Paula Ribeiro
                  tipo: autorizada_por_interfone
                  unidade:
                    unidade_id: 9c1e7f20-4b3a-4d65-8a12-6e0f5b7c3d41
                    bloco_id: 5a8d2e91-7c4b-4f13-b6a0-2d9e1c8f7a35
                    bloco_nome: Bloco A
                    identificacao: Apto 101
                    rotulo: Bloco A · Apto 101
                  inicio_faixa: '14:00'
                  fim_faixa: '16:00'
                  lista: null
                  alerta_bloqueio: null
                  fora_do_horario_cadastrado: false
                  entrada_em: '2026-11-10T14:10:00-03:00'
                  saida_em: null
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '422':
          description: Regra violada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                foraDosBlocos:
                  summary: Unidade de bloco que a portaria não atende
                  value:
                    codigo: UNIDADE_FORA_DOS_BLOCOS_DA_PORTARIA
                    mensagem: Esta portaria atende os blocos A e B.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
                motivoObrigatorio:
                  summary: Liberar apesar do bloqueio exige motivo
                  value:
                    codigo: BLOQUEIO_MOTIVO_OBRIGATORIO
                    mensagem: Informe o motivo para liberar a entrada.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-VI-07
      - RN-VI-02
      - RN-VI-04
      - RN-VI-05
      - RN-VI-06
      - RN-CD-17
      - US-VI-05
  /v1/portaria/listas-visitantes:
    get:
      operationId: portariaListarListasVisitantes
      summary: Lista as listas de visitantes do dia, agrupadas
      description: Mostra o nome da lista, a unidade e o contador "N pessoas, M chegaram" (RF-VI-15, RN-VI-17). A portaria só vê a lista no dia da data (RN-VI-13). A entrada e a saída são registradas pessoa a pessoa pelas rotas de visita.
      tags:
      - visitantes
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: ./componentes/comum.yaml#/components/parameters/Limite
      - $ref: ./componentes/comum.yaml#/components/parameters/Cursor
      - name: portaria_id
        in: query
        required: false
        description: 'Portaria a consultar. Padrão: as portarias do funcionário (`funcionario_portaria`). Proposta: a cardinalidade por turno não está definida.'
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        example: 1e4f6a73-2b95-4c08-a7d1-8f3c0e5b9d26
      - name: busca
        in: query
        required: false
        description: Texto livre no nome da lista ou da unidade.
        schema:
          type: string
      responses:
        '200':
          description: Página de listas do dia.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                type: object
                required:
                - dados
                - paginacao
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/ListaVisitantesPortaria'
                  paginacao:
                    $ref: ./componentes/comum.yaml#/components/schemas/Paginacao
              example:
                dados:
                - lista_id: 8b3d5c17-6e2a-4f90-9d14-7a1c3e5b8f20
                  nome: Aniversário do Theo
                  data: '2026-11-10'
                  unidade:
                    unidade_id: 9c1e7f20-4b3a-4d65-8a12-6e0f5b7c3d41
                    bloco_id: 5a8d2e91-7c4b-4f13-b6a0-2d9e1c8f7a35
                    bloco_nome: Bloco A
                    identificacao: Apto 101
                    rotulo: Bloco A · Apto 101
                  total_pessoas: 18
                  total_chegaram: 12
                paginacao:
                  proximo_cursor: null
                  tem_mais: false
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-VI-15
      - RN-VI-13
      - RN-VI-17
      - US-VI-08
  /v1/portaria/bloqueios:
    get:
      operationId: portariaListarBloqueios
      summary: Lista as pessoas com entrada bloqueada
      description: A portaria vê a lista mantida pela administradora (matriz do PRD 3; RN-CD-15). Serve à busca e ao alerta no registro de entrada (RN-VI-05). Só leitura.
      tags:
      - visitantes
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: ./componentes/comum.yaml#/components/parameters/Limite
      - $ref: ./componentes/comum.yaml#/components/parameters/Cursor
      - name: busca
        in: query
        required: false
        description: Texto livre no nome ou no documento.
        schema:
          type: string
      responses:
        '200':
          description: Página de bloqueios vigentes.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                type: object
                required:
                - dados
                - paginacao
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/BloqueioPortaria'
                  paginacao:
                    $ref: ./componentes/comum.yaml#/components/schemas/Paginacao
              example:
                dados:
                - id: 2a4c6e8b-0d1f-4a35-b7c9-1e3b5d7f9a46
                  nome: Mauro Teixeira
                  documento: 529.982.247-25
                  motivo: Entrada vetada pela administração em 03/11/2026.
                  inicio: '2026-11-03T09:00:00-03:00'
                  fim: null
                paginacao:
                  proximo_cursor: null
                  tem_mais: false
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-AD-15
      - RN-CD-15
      - RN-VI-05
      - US-VI-05
  /v1/portaria/visitas/{visita_id}/entrada:
    post:
      operationId: portariaRegistrarEntrada
      summary: Registra a entrada de um visitante esperado
      description: Registra a entrada sem diálogo de confirmação, em 1 toque; o erro se corrige com o Desfazer (`portariaDesfazerRegistroVisita`) (RN-VI-17, US-VI-03). O morador recebe push (RN-VI-06). Se o visitante está na lista de bloqueio, o corpo traz a decisão de liberar com motivo (RN-VI-05). Visita cancelada pelo morador antes do registro responde `409`. A mesma operação, feita sem internet, vai pela fila de `POST /v1/sync` com tipo `entrada_visita` (RN-OF-03).
      tags:
      - visitantes
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - name: visita_id
        in: path
        required: true
        description: Identificador da visita.
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        example: 3f6c1a52-8b1e-4d3a-9a0e-5c1d2b7e9f10
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntradaVisitaPortaria'
            examples:
              semBloqueio:
                summary: Visitante esperado, sem bloqueio
                value: {}
              liberandoBloqueio:
                summary: Liberar apesar do bloqueio
                value:
                  decisao_bloqueio:
                    bloqueio_id: 2a4c6e8b-0d1f-4a35-b7c9-1e3b5d7f9a46
                    decisao: liberar
                    motivo: Morador confirmou por interfone que a pessoa é convidada.
      responses:
        '200':
          description: Entrada registrada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoVisitaPortaria'
              example:
                evento_id: 6d2b9f84-1a7c-4e35-8b09-3c5e7a1d4f62
                tipo: entrada
                registrado_em: '2026-11-10T14:10:00-03:00'
                evento_desfeito_id: null
                visita:
                  id: 3f6c1a52-8b1e-4d3a-9a0e-5c1d2b7e9f10
                  estado: entrou
                  dia: '2026-11-10'
                  nome_visitante: Carlos Souza
                  tipo: avulsa
                  unidade:
                    unidade_id: 9c1e7f20-4b3a-4d65-8a12-6e0f5b7c3d41
                    bloco_id: 5a8d2e91-7c4b-4f13-b6a0-2d9e1c8f7a35
                    bloco_nome: Bloco A
                    identificacao: Apto 101
                    rotulo: Bloco A · Apto 101
                  inicio_faixa: '14:00'
                  fim_faixa: '16:00'
                  lista: null
                  alerta_bloqueio: null
                  fora_do_horario_cadastrado: false
                  entrada_em: '2026-11-10T14:10:00-03:00'
                  saida_em: null
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '404':
          $ref: ./componentes/comum.yaml#/components/responses/Erro404
        '409':
          description: Dado alterado antes do registro.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                canceladaPeloMorador:
                  summary: Morador cancelou a visita
                  value:
                    codigo: CONFLITO_DADO_ALTERADO
                    mensagem: Estas informações mudaram. Atualizamos a tela.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '422':
          description: Regra violada no registro de entrada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                motivoObrigatorio:
                  summary: Liberar apesar do bloqueio exige motivo
                  value:
                    codigo: BLOQUEIO_MOTIVO_OBRIGATORIO
                    mensagem: Informe o motivo para liberar a entrada.
                    detalhes:
                    - campo: decisao_bloqueio.motivo
                      mensagem: Informe o motivo.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
                estadoInvalido:
                  summary: Visita que já entrou
                  value:
                    codigo: VISITA_ESTADO_NAO_PERMITE_ENTRADA
                    mensagem: Esta visita não está esperando entrada.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-VI-06
      - RF-VI-09
      - RF-VI-10
      - RN-VI-05
      - RN-VI-06
      - RN-VI-17
      - US-VI-03
      - US-VI-08
  /v1/portaria/visitas/{visita_id}/entrada-negada:
    post:
      operationId: portariaRegistrarEntradaNegada
      summary: Registra que a portaria não liberou pessoa bloqueada
      description: 'Grava a decisão "Não liberar", com autor e momento, para visitante na lista de bloqueio (RN-VI-05; UF 6.2: "Entrada negada e registrada"). A decisão final é da portaria. Operação sem tipo de sincronização definido: exige internet.'
      tags:
      - visitantes
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
