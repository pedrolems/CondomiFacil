# Flyway 13.12.2 OSS (imagem oficial fixada por digest em db/scripts/ambiente.ts).
# Sem segredo: URL, usuário e senha chegam por FLYWAY_URL, FLYWAY_USER e FLYWAY_PASSWORD.
# Regras da P5 (RM-16), aceitas no ADR-008 com ressalvas em 20/11/2026.
flyway.locations=filesystem:/flyway/sql
flyway.encoding=UTF-8
# Histórico em esquema próprio, criado pelo provisionamento, sem acesso do app_user.
flyway.defaultSchema=infra_migracoes
flyway.schemas=infra_migracoes
flyway.table=flyway_schema_history
flyway.createSchemas=false
# validate estrito: vazio desliga o padrão *:future (a última aplicada ausente seria aceita).
flyway.ignoreMigrationPatterns=
flyway.validateOnMigrate=true
flyway.validateMigrationNaming=true
flyway.outOfOrder=false
flyway.baselineOnMigrate=false
flyway.cleanDisabled=true
# Trava de sessão: com a transacional, CREATE INDEX CONCURRENTLY trava (P5a).
flyway.postgresql.transactional.lock=false
flyway.connectRetries=10
