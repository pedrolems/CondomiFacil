      - nome
      - servico
      - telefone
      properties:
        nome:
          type: string
        servico:
          type: string
        telefone:
          type: string
    ReclamanteReclamacaoSindico:
      type: object
      description: Identidade do reclamante, entregue só ao julgador (RN-SC-02, ADR-010).
      required:
      - tipo
      - vinculo_id
      - nome
      - unidade_identificacao
      properties:
        tipo:
          type: string
          enum:
          - pessoa
          - condominio
          description: '`condominio` na reclamação gerada por vistoria (RN-RC-12), sem reclamante pessoa.'
        vinculo_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
        nome:
          type:
          - string
          - 'null'
        unidade_identificacao:
          type:
          - string
          - 'null'
    AlvoReclamacaoSindico:
      type: object
      required:
      - tipo
      - rotulo
      properties:
        tipo:
          type: string
          enum:
          - funcionario
          - unidade
          - sindico
          - subsindico
        rotulo:
          type: string
          description: Nome do funcionário, identificação da unidade ou do mandatário.
    SemaforoPrazoReclamacaoSindico:
      type: object
      description: Semáforo do prazo de decisão (RN-RC-17 a RN-RC-19). Só no DTO do julgador e só em Aberta e Em
        conversa com o alvo; é informação, não bloqueia a decisão.
      required:
      - cor
      - texto
      - vence_em
      properties:
        cor:
          type: string
          enum:
          - verde
          - amarelo
          - vermelho
        texto:
          type: string
          description: Texto sempre junto da cor, por exemplo "No prazo", "Prazo se esgotando" ou "Prazo esgotado"
            (RN-RC-17).
        vence_em:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
    ReclamacaoResumoSindico:
      type: object
      required:
      - id
      - categoria
      - gravidade_inicial
      - estado
      - aberta_em
      - alvo
      - reclamante
      - voce_e_o_julgador
      - semaforo
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        categoria:
          type: string
        gravidade_inicial:
          type: string
          enum:
          - leve
          - media
          - grave
