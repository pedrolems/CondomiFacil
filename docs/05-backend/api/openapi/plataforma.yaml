      - RN-GE-03
      - US-AD-04
      - SEG-08
  /v1/plataforma/parametros/{chave}/padrao/historico:
    get:
      operationId: plataformaListarHistoricoDoPadrao
      summary: Histórico do padrão de plataforma
      description: 'Histórico imutável com vigências passadas e futuras (RN-GE-01, RN-GE-02). Só o Admin da plataforma; o suporte recebe `403`. Rota da plataforma: não leva `X-Condominio-Id` nem `X-Unidade-Id`; o condomínio, quando houver, vai no caminho.'
      tags:
      - configuracao
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - name: chave
        in: path
        required: true
        description: Chave do parâmetro do catálogo (RN 13).
        schema:
          type: string
          enum:
          - score.limite_bloqueio_gratuitas
          - score.pontos_leve
          - score.pontos_media
          - score.pontos_grave
          - score.penalidade_desproporcional
          - score.penalidade_falsa
          - reclamacao.prazo_decisao_dias
          - reclamacao.prazo_resposta_alvo_dias
          - reserva.tipo
          - reserva.valor
          - reserva.prazo_pagamento_horas
          - reserva.prazo_cancelamento_reembolso_horas
          - reserva.antecedencia_min_horas
          - reserva.antecedencia_max_dias
          - reserva.limite_mensal_por_unidade
          - reserva.lembrete_antecedencia_horas
          - chamado.prazo_limpeza_horas
          - chamado.prazo_manutencao_resposta_horas
          - chamado.janela_avaliacao_dias
          - encomenda.prazo_guarda_dias
          - entrega_esperada.limite_por_unidade
          - entrega_esperada.tolerancia_vinculo_dias
          - visitante.retencao_meses
          - visitante.lista_max_pessoas
          - mandato.reeleicao_permitida
          - cobranca.formas_pagamento
          - cobranca.dia_vencimento
          - cobranca.antecedencia_emissao_dias
          - cobranca.multa_atraso_pct
          - cobranca.juros_mes_pct
          - cobranca.desconto_pontualidade_pct
          - cobranca.bloqueia_reserva_em_atraso
          - financeiro.dia_fechamento_mes
          - locacao.aviso_fim_contrato_dias
          - locacao.carencia_fim_contrato_dias
          - locacao.temporada_permitida
          examples:
          - cobranca.dia_vencimento
      - $ref: ./componentes/comum.yaml#/components/parameters/Limite
      - $ref: ./componentes/comum.yaml#/components/parameters/Cursor
      responses:
        '200':
          description: Página de resultados.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                type: object
                required:
                - dados
                - paginacao
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/PadraoHistoricoPlataforma'
                  paginacao:
                    $ref: ./componentes/comum.yaml#/components/schemas/Paginacao
              example:
                dados:
                - valor: 10
                  vigente_desde: '2026-01-01T00:00:00-03:00'
                  registrado_em: '2025-12-20T10:00:00-03:00'
                  registrado_por:
                    nome: Admin da Plataforma
                paginacao:
                  proximo_cursor: null
                  tem_mais: false
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          description: Sem permissão para o papel efetivo ou sem vínculo com o condomínio (guards de contexto e papel).
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                semPermissao:
                  summary: Suporte da plataforma recebe 403 (PRD 3)
                  value:
                    codigo: SEM_PERMISSAO
                    mensagem: Esta área é só para admin da plataforma.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '404':
          $ref: ./componentes/comum.yaml#/components/responses/Erro404
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RN-GE-01
      - RN-GE-02
      - RN-GE-03
      - US-AD-04
components:
  securitySchemes:
    bearerJwt:
      $ref: ./componentes/comum.yaml#/components/securitySchemes/bearerJwt
  schemas:
    PrecoPlanoPlataforma:
      type: object
      required:
      - id
      - unidades_de
      - extra_centavos
      - vigente_desde
      - sob_consulta
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        unidades_de:
          type: integer
          examples:
          - 1
        unidades_ate:
          type:
          - integer
          - 'null'
          examples:
          - 30
        valor_centavos:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Centavos
          - type: 'null'
        franquia_solicitacoes:
          type:
          - integer
          - 'null'
          examples:
          - 10
        extra_centavos:
          $ref: ./componentes/comum.yaml#/components/schemas/Centavos
        vigente_desde:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        vigente_ate:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          - type: 'null'
        sob_consulta:
          type: boolean
          examples:
          - false
    PlanoPlataforma:
      type: object
      required:
      - id
      - codigo
      - nome
      - precos
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        codigo:
          type: string
          enum:
          - essencial
          - gestao_suporte
          description: Código (Proposta).
          examples:
          - essencial
        nome:
          type: string
          examples:
          - Essencial
        precos:
          type: array
          items:
            $ref: '#/components/schemas/PrecoPlanoPlataforma'
          description: Faixas e versões de preço, sem sobreposição no mesmo plano e período.
    NovoPrecoPlanoEntradaPlataforma:
      type: object
      required:
      - unidades_de
      - extra_centavos
      - vigente_desde
      properties:
        unidades_de:
          type: integer
          examples:
          - 1
        unidades_ate:
          type:
          - integer
          - 'null'
          examples:
          - 30
        valor_centavos:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Centavos
          - type: 'null'
        franquia_solicitacoes:
          type:
          - integer
          - 'null'
          examples:
          - 10
        extra_centavos:
          allOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Centavos
          description: Valor de cada solicitação além da franquia (RN-PL-05).
        vigente_desde:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        sob_consulta:
          type: boolean
          examples:
          - false
    CondominioPlataforma:
      type: object
      description: Só dados da plataforma; nenhum dado operacional do condomínio.
      required:
      - id
      - nome
      - plano
      - unidades_apuradas
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        nome:
          type: string
          examples:
          - Condomínio Residencial Exemplo
        documento_mascarado:
          type:
          - string
          - 'null'
          examples:
          - '**.***.***/0001-**'
        fuso_horario:
          type:
          - string
          - 'null'
          examples:
          - America/Sao_Paulo
        plano:
          type: object
          required:
          - codigo
          - nome
          properties:
            codigo:
              type: string
              examples:
              - essencial
            nome:
              type: string
              examples:
              - Essencial
        unidades_apuradas:
          type: integer
          description: Unidades cadastradas, que definem a faixa (RN-PL-01).
          examples:
          - 120
        administradora_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
    CondominioEntradaPlataforma:
      type: object
      required:
      - nome
      - plano_codigo
      properties:
        nome:
          type: string
          examples:
          - Condomínio Residencial Exemplo
        documento:
          type:
          - string
          - 'null'
          examples:
          - '12345678000190'
        fuso_horario:
          type:
          - string
          - 'null'
          description: Proposta do ADR-012.
          examples:
          - America/Sao_Paulo
        plano_codigo:
          type: string
          enum:
          - essencial
          - gestao_suporte
          examples:
          - essencial
        ciclo_dia:
          type: integer
          minimum: 1
          maximum: 28
          description: Dia do ciclo de cobrança da assinatura.
          examples:
          - 10
        valor_negociado_centavos:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Centavos
          - type: 'null'
          description: Só acima de 600 unidades (sob consulta).
        franquia_negociada:
          type:
          - integer
          - 'null'
    AssinaturaEntradaPlataforma:
      type: object
      required:
      - plano_codigo
      properties:
        plano_codigo:
          type: string
          enum:
          - essencial
          - gestao_suporte
          examples:
          - gestao_suporte
        valor_negociado_centavos:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Centavos
          - type: 'null'
        franquia_negociada:
          type:
          - integer
          - 'null'
    AssinaturaPlataforma:
      type: object
      required:
      - condominio_id
      - plano
      - preco_plano_id
      - efetiva_a_partir_de
      properties:
        condominio_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        plano:
          type: object
          required:
          - codigo
          - nome
          properties:
            codigo:
              type: string
              examples:
              - gestao_suporte
            nome:
              type: string
              examples:
              - Gestão + Suporte
        preco_plano_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        ciclo_dia:
          type: integer
          examples:
          - 10
        efetiva_a_partir_de:
          allOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          description: Início do ciclo seguinte (RN-PL-01, RN-PL-06).
        valor_negociado_centavos:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Centavos
          - type: 'null'
        franquia_negociada:
          type:
          - integer
          - 'null'
    AdministracaoEntradaPlataforma:
      type: object
      required:
      - administradora_id
      properties:
        administradora_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        inicio:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
    AdministracaoPlataforma:
      type: object
      required:
      - condominio_id
      - administradora_id
      - inicio
      - plano_apos
      - suporte_perde_acesso_em
      properties:
        condominio_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        administradora_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        inicio:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        plano_apos:
          type: string
          description: Plano a partir do ciclo seguinte.
          examples:
          - essencial
        suporte_perde_acesso_em:
          allOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          description: O suporte perde o acesso no ciclo seguinte (RN-PL-06).
    FaturaPlataforma:
      type: object
