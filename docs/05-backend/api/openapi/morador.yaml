openapi: 3.1.0
info:
  title: CondomiFacil API - interface do morador
  version: 0.1.0-proposta
  summary: Rotas /v1/morador/* do perfil Morador.
  description: '**Proposta de 10/11/2026**, não aceita pelo Pedro. Tudo o que não vem de decisão do Pedro ou do PRD é Proposta.


    Interface do perfil Morador (proprietário que mora, inquilino ou dependente). Síndico morador, subsíndico e membros do conselho fiscal usam estas mesmas rotas nas funções de morador (PRD 3). A pasta organiza, não protege: a autorização é validada nos guards e na RLS (`01-backend.md` 3.4). Perfil Manutenção não tem rotas.


    Fora deste arquivo: `/v1/eu/*`, `/v1/acesso/*`, `/v1/arquivos/*`, `/v1/sync` e o endpoint de score (ADR-010), em `comum.yaml`; recurso de decisão de reclamação, denúncia de conteúdo e preferências de notificação também são de `comum` (`01-backend.md` 3.3, decisão 5). Convenções em `../01-guia-da-api.md`.


    Dados de cartão nunca passam pela API (SEG-12). O alvo de uma reclamação nunca recebe o autor (RN-RC-01, ADR-010). Nenhum DTO devolve pontos de score.'
servers:
- url: https://api.condomifacil.exemplo
  description: Endereço de exemplo (Proposta; sem ambiente definido)
tags:
- name: condominio
  description: Dados do condomínio e da unidade que o morador consulta.
- name: reservas
  description: Áreas comuns, disponibilidade, reservas, cancelamento e reembolso.
- name: pagamentos
  description: Pagamento de reserva e de cobrança pelo gateway (Asaas).
- name: visitantes
  description: Visitantes avulsos e recorrentes, listas de visitantes e modelos salvos.
- name: encomendas
  description: Encomendas da unidade e entregas esperadas.
- name: chamados
  description: Chamados de limpeza e manutenção, avaliação do atendimento e reabertura.
- name: convivencia
  description: Reclamações, conversa com o alvo e pesquisa mensal de funcionários.
- name: comunicados
  description: Comunicados gerais e individuais.
- name: governanca
  description: Reuniões, pautas, votações, eleições e procuração.
- name: cobranca
  description: Cobrança da taxa condominial e de cobranças extras.
paths:
  /v1/morador/condominio:
    get:
      operationId: moradorConsultarCondominio
      summary: Consulta os dados do condomínio ativo
      description: Devolve nome, blocos e as formas de pagamento aceitas, para montar as telas do morador. Só o condomínio do cabeçalho `X-Condominio-Id` (RN-CD-05).
      tags:
      - condominio
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/UnidadeId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      responses:
        '200':
          description: Dados do condomínio.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CondominioMorador'
              example:
                id: 7a1d3c55-0e2b-4c8f-b1a4-9d6e5f302b18
                nome: Residencial Jardim das Acácias
                cobranca_ativa: true
                meios_cobranca_aceitos:
                - boleto
                - pix
                - cartao
                blocos:
                - id: 3f6c1a52-8b1e-4d3a-9a0e-5c1d2b7e9f10
                  nome: Bloco A
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-AD-17
      - RF-FI-01
      - RF-FI-02
      - RN-CD-05
      - RN-CD-17
      - RN-FI-01
      - RN-FI-02
  /v1/morador/unidade:
    get:
      operationId: moradorConsultarUnidadeAtiva
      summary: Consulta a unidade ativa
      description: Dados da unidade do cabeçalho `X-Unidade-Id` (obrigatório) e o vínculo do usuário com ela. Para inquilino, traz o fim do contrato, que limita reservas e visitas recorrentes (RN-CD-22). A escolha da unidade ativa é de `/v1/eu/*`.
      tags:
      - condominio
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/UnidadeIdObrigatorio
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      responses:
        '200':
          description: Unidade ativa.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnidadeMorador'
              example:
                id: c2b8e1a4-5d3f-4a6b-8e7c-1f0a9b2d4c63
                identificacao: Apto 101
                bloco: Bloco A
                situacao_ocupacao: alugada
                meu_vinculo: inquilino
                morador_habilitado: true
                contrato_fim: '2027-06-30'
                responsavel_financeiro:
                  ordinarias: true
                  extraordinarias: false
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-AC-04
      - RN-CD-04
      - RN-CD-05
      - RN-CD-22
      - RN-FI-03
  /v1/morador/areas:
    get:
      operationId: moradorListarAreas
      summary: Lista as áreas comuns reserváveis
      description: Áreas ativas do condomínio com tipo, valor e regras efetivas. Área paga exige conta recebedora apta (RN-PG-03), por isso só aparece paga quando o condomínio pode cobrar.
      tags:
      - reservas
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/UnidadeId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: ./componentes/comum.yaml#/components/parameters/Limite
      - $ref: ./componentes/comum.yaml#/components/parameters/Cursor
      - name: busca
        in: query
        required: false
        description: Texto livre, no nome da área.
        schema:
          type: string
      - name: tipo_reserva
        in: query
        required: false
        description: Filtra por tipo.
        schema:
          type: string
          enum:
          - paga
          - gratuita
      - name: ordenar
        in: query
        required: false
        description: Ordenação; prefixo - para decrescente.
        schema:
          type: string
          enum:
          - nome
          - -nome
          default: nome
      responses:
        '200':
          description: Página de áreas.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                type: object
                required:
                - dados
                - paginacao
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/AreaComumMorador'
                  paginacao:
                    $ref: ./componentes/comum.yaml#/components/schemas/Paginacao
              example:
                dados:
                - id: 7a1d3c55-0e2b-4c8f-b1a4-9d6e5f302b18
                  nome: Salão de festas
                  tipo_reserva: paga
                  capacidade: 80
                  valor_centavos: 15000
                  foto_id: null
                  regras:
                    antecedencia_minima_horas: 24
                    antecedencia_maxima_dias: 60
                    limite_reservas_por_mes: 2
                    prazo_reembolso_horas: 12
                    prazo_pagamento_horas: 24
                paginacao:
                  proximo_cursor: null
                  tem_mais: false
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-RE-01
      - RF-RE-03
      - RN-RE-01
      - RN-RE-06
      - RN-RE-07
      - RN-CA-02
      - RN-PG-03
      - US-RE-01
  /v1/morador/areas/{area_id}/disponibilidade:
    get:
      operationId: moradorConsultarDisponibilidadeArea
      summary: Consulta a disponibilidade de uma área
      description: Calendário de ocupação e indisponibilidade da área para a unidade ativa (exige `X-Unidade-Id`). Score igual ou menor que 60 torna indisponíveis as áreas gratuitas só para essa pessoa nessa unidade (RN-RE-08, RN-SC-09, RN-SC-10). `unidade_em_atraso` só aparece para quem pode ver a situação financeira da unidade; os demais veem `unidade_indisponivel` (SEG-17, RN-FI-10).
      tags:
      - reservas
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/UnidadeIdObrigatorio
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: '#/components/parameters/AreaId'
      - name: de
        in: query
        required: true
        description: Início do período consultado (aaaa-mm-dd).
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
      - name: ate
        in: query
        required: true
        description: Fim do período consultado (aaaa-mm-dd).
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
      responses:
        '200':
          description: Intervalos ocupados e indisponíveis.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisponibilidadeAreaMorador'
              examples:
                comum:
                  summary: Área gratuita com score baixo
                  value:
                    area_id: 7a1d3c55-0e2b-4c8f-b1a4-9d6e5f302b18
                    intervalos:
                    - inicio: '2026-11-20T18:00:00-03:00'
                      fim: '2026-11-20T22:00:00-03:00'
                      estado: ocupado
                      rotulo: Ocupado
                      motivo: null
                      mensagem: null
                    - inicio: '2026-11-10T00:00:00-03:00'
                      fim: '2026-11-11T00:00:00-03:00'
                      estado: indisponivel
                      rotulo: Indisponível
                      motivo: fora_da_antecedencia
                      mensagem: 'Reservas desta área: de 24h a 60 dias antes.'
                    aviso: null
                score:
                  summary: Aviso de score baixo (texto de UF 5.1)
                  value:
                    area_id: 7a1d3c55-0e2b-4c8f-b1a4-9d6e5f302b18
                    intervalos:
                    - inicio: '2026-11-25T00:00:00-03:00'
                      fim: '2026-11-26T00:00:00-03:00'
                      estado: indisponivel
                      rotulo: Indisponível
                      motivo: score_baixo
                      mensagem: null
                    aviso: Seu score está em 58. Reservas gratuitas voltam quando ele passar de 60. Áreas pagas continuam liberadas.
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '404':
          $ref: ./componentes/comum.yaml#/components/responses/Erro404
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-RE-01
      - RF-RE-06
      - RN-RE-05
      - RN-RE-06
      - RN-RE-07
      - RN-RE-08
      - RN-RE-11
      - RN-SC-09
      - RN-SC-10
      - RN-CD-22
      - RN-FI-10
      - SEG-17
      - US-RE-01
      - US-RE-05
  /v1/morador/reservas:
    get:
      operationId: moradorListarReservas
      summary: Lista as reservas da unidade ativa
      description: Histórico de reservas da unidade ativa, da mais recente para a mais antiga, com comprovantes de pagamento e reembolso no detalhe (RN-CD-05, RN-PG-07). Exige `X-Unidade-Id`.
      tags:
      - reservas
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/UnidadeIdObrigatorio
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: ./componentes/comum.yaml#/components/parameters/Limite
      - $ref: ./componentes/comum.yaml#/components/parameters/Cursor
      - name: estado
        in: query
        required: false
        description: Um ou mais estados, separados por vírgula.
        schema:
          type: array
          items:
            $ref: ./componentes/enums.yaml#/components/schemas/EstadoReserva
        style: form
        explode: false
      - name: de
        in: query
        required: false
        description: Data inicial, inclusive (aaaa-mm-dd).
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
      - name: ate
        in: query
        required: false
        description: Data final, inclusive (aaaa-mm-dd).
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
      - name: busca
        in: query
        required: false
        description: Texto livre, no nome da área.
        schema:
          type: string
      - name: ordenar
        in: query
        required: false
        description: Ordenação; prefixo - para decrescente.
        schema:
          type: string
          enum:
          - criado_em
          - -criado_em
          - inicio
          - -inicio
          default: -criado_em
      responses:
        '200':
          description: Página de reservas.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                type: object
                required:
                - dados
                - paginacao
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReservaMorador'
                  paginacao:
                    $ref: ./componentes/comum.yaml#/components/schemas/Paginacao
              example:
                dados:
                - id: 3f6c1a52-8b1e-4d3a-9a0e-5c1d2b7e9f10
                  area_id: 7a1d3c55-0e2b-4c8f-b1a4-9d6e5f302b18
                  area_nome: Salão de festas
                  inicio: '2026-11-20T18:00:00-03:00'
                  fim: '2026-11-20T22:00:00-03:00'
                  estado: confirmada
                  tipo: paga
                  valor_centavos: 15000
                  criada_em: '2026-11-10T14:30:00-03:00'
                  pagar_ate: null
                  sugerir_lista_visitantes: true
                  lista_vinculada: null
                  cancelamento_previsto:
                    direito_reembolso: true
                    valor_reembolso_centavos: 15000
                    aviso: null
                  comprovantes:
                  - tipo: pagamento
                    arquivo_id: 9e4d2b71-6a3c-4f58-b0d1-2c7e5a8f3b19
                    emitido_em: '2026-11-10T14:35:00-03:00'
                  cancelamento: null
                paginacao:
                  proximo_cursor: null
                  tem_mais: false
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-RE-02
      - RF-RE-03
      - RF-RE-05
      - RF-PG-04
      - RN-CD-05
      - RN-RE-12
      - RN-PG-07
      - US-RE-02
    post:
      operationId: moradorCriarReserva
      summary: Cria uma reserva
      description: Cria a reserva da área. Gratuita nasce Confirmada; paga nasce Aguardando pagamento e segura o horário por até 24h (configurável) ou até o início (RN-RE-02, RN-RE-03). O primeiro pedido bloqueia o horário (RN-RE-04). `Idempotency-Key` evita duplicar o pedido (proposta técnica).
      tags:
      - reservas
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/UnidadeIdObrigatorio
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: ./componentes/comum.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - area_id
              - inicio
              - fim
              properties:
                area_id:
                  $ref: ./componentes/comum.yaml#/components/schemas/Uuid
                inicio:
                  $ref: ./componentes/comum.yaml#/components/schemas/DataHora
                fim:
                  $ref: ./componentes/comum.yaml#/components/schemas/DataHora
            example:
              area_id: 7a1d3c55-0e2b-4c8f-b1a4-9d6e5f302b18
              inicio: '2026-11-20T18:00:00-03:00'
              fim: '2026-11-20T22:00:00-03:00'
      responses:
        '201':
          description: Reserva criada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaMorador'
              example:
                id: 3f6c1a52-8b1e-4d3a-9a0e-5c1d2b7e9f10
                area_id: 7a1d3c55-0e2b-4c8f-b1a4-9d6e5f302b18
                area_nome: Salão de festas
                inicio: '2026-11-20T18:00:00-03:00'
                fim: '2026-11-20T22:00:00-03:00'
                estado: confirmada
                tipo: paga
                valor_centavos: 15000
                criada_em: '2026-11-10T14:30:00-03:00'
                pagar_ate: null
                sugerir_lista_visitantes: true
                lista_vinculada: null
                cancelamento_previsto:
                  direito_reembolso: true
                  valor_reembolso_centavos: 15000
                  aviso: null
                comprovantes:
                - tipo: pagamento
                  arquivo_id: 9e4d2b71-6a3c-4f58-b0d1-2c7e5a8f3b19
                  emitido_em: '2026-11-10T14:35:00-03:00'
                cancelamento: null
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '409':
          description: Conflito de estado ou de dado.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                horario:
                  summary: Horário já reservado (texto de UF 5.1)
                  value:
                    codigo: RESERVA_HORARIO_INDISPONIVEL
                    mensagem: Este horário acabou de ser reservado.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
                dadoAlterado:
                  summary: Dado alterado por outra pessoa (texto de UF 15)
                  value:
                    codigo: CONFLITO_DADO_ALTERADO
                    mensagem: Estas informações mudaram. Atualizamos a tela.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '422':
          description: Regra de negócio violada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                antecedencia:
                  summary: Fora da antecedência (RN-RE-06)
                  value:
                    codigo: RESERVA_FORA_DA_ANTECEDENCIA
                    mensagem: 'Reservas desta área: de 24h a 60 dias antes.'
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
                score:
                  summary: Score que bloqueia reserva gratuita (RN-SC-09)
                  value:
                    codigo: RESERVA_GRATUITA_BLOQUEADA_POR_SCORE
                    mensagem: Seu score está em 58. Reservas gratuitas voltam quando ele passar de 60. Áreas pagas continuam liberadas.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
                limite:
                  summary: Limite mensal (RN-RE-07; o 2 do texto é o padrão do parâmetro, o número real vem da regra efetiva da área)
                  value:
                    codigo: RESERVA_LIMITE_MENSAL_ATINGIDO
                    mensagem: Sua unidade já usou as 2 reservas deste mês nesta área.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
                atraso:
                  summary: Bloqueio por atraso ligado (RN-RE-11)
                  value:
                    codigo: RESERVA_BLOQUEADA_POR_ATRASO
                    mensagem: Novas reservas estão bloqueadas enquanto houver cobrança em atraso.
