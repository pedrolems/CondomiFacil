      type: object
      required:
      - id
      - unidade_id
      - procurador_vinculo_id
      - inicio
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        unidade_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        reuniao_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
        eleicao_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
        outorgante_nome:
          type: string
        procurador_vinculo_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        procurador_nome:
          type: string
        inicio:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        fim:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          - type: 'null'
        papel:
          type: string
          enum:
          - outorgante
          - procurador
          description: Papel do usuário nesta procuração.
    PossivelProcuradorProprietarioNaoResidente:
      type: object
      required:
      - vinculo_condominio_id
      - nome
      properties:
        vinculo_condominio_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        nome:
          type: string
    DadosDePagamentoProprietarioNaoResidente:
      type: object
      description: 'Dados que o cliente usa para concluir o pagamento. Os nomes dos cinco campos de pagamento são fixos. Dados de cartão nunca passam pela API (SEG-12): o cartão é pago no checkout hospedado do Asaas, aberto em `url_checkout`. Os campos que não se aplicam ao meio vêm nulos.'
      required:
      - id
      - meio
      - valor_centavos
      - criada_em
      - expira_em
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        meio:
          type: string
          enum:
          - boleto
          - pix
          - cartao
          description: Boleto vale só para cobrança; reserva aceita Pix e cartão (MER/DER 4.10).
        valor_centavos:
          $ref: ./componentes/comum.yaml#/components/schemas/Centavos
        criada_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        linha_digitavel:
          oneOf:
          - type: string
            description: Linha digitável do boleto.
          - type: 'null'
        pix_copia_e_cola:
          oneOf:
          - type: string
            description: Código Pix copia e cola.
          - type: 'null'
        pix_qr_code_base64:
          oneOf:
          - type: string
            description: Imagem do QR Code Pix em base64.
          - type: 'null'
        url_checkout:
          oneOf:
          - type: string
            description: Endereço do checkout hospedado do Asaas, para pagamento por cartão.
            format: uri
          - type: 'null'
        expira_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
    ComprovanteProprietarioNaoResidente:
      type: object
      required:
      - tipo
      - arquivo_id
      - emitido_em
      properties:
        tipo:
          type: string
          enum:
          - pagamento
          - reembolso
        arquivo_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        emitido_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
    CobrancaProprietarioNaoResidente:
      type: object
      description: 'Cobrança da unidade. Situação financeira só para quem a SEG-17 permite: responsável financeiro e, no caso do proprietário, a unidade; nunca para outros moradores (RN-FI-10).'
      required:
      - id
      - competencia
      - natureza_despesa
      - principal_centavos
      - total_centavos
      - vencimento
      - estado
      - pode_pagar
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        competencia:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}$
        origem:
          type: string
          description: Mensal ou extra (MER/DER 4.10; enumeração completa é lacuna).
        natureza_despesa:
          type: string
          enum:
          - ordinaria
          - extraordinaria
          description: Taxa mensal é ordinária; fundo de reserva e obras são extraordinárias (RN-FI-20, RF-FI-16).
        descricao:
          oneOf:
          - type: string
            description: Por exemplo, Taxa condominial de novembro ou multa por infração.
          - type: 'null'
        principal_centavos:
          $ref: ./componentes/comum.yaml#/components/schemas/Centavos
        desconto_centavos:
          $ref: ./componentes/comum.yaml#/components/schemas/Centavos
        multa_centavos:
          $ref: ./componentes/comum.yaml#/components/schemas/Centavos
        juros_centavos:
          $ref: ./componentes/comum.yaml#/components/schemas/Centavos
        total_centavos:
          allOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Centavos
          description: Valor atualizado até `valor_calculado_em`, com multa (até 2%) e juros do dia (RN-FI-06, RN-FI-08).
        valor_calculado_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        vencimento:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
        estado:
          $ref: ./componentes/enums.yaml#/components/schemas/EstadoCobranca
        emitida_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        responsavel_papel:
          oneOf:
          - type: string
            enum:
            - proprietario
            - inquilino
            description: Quem é o responsável financeiro desta cobrança, para o selo "Paga pelo inquilino" (UF 13.1).
          - type: 'null'
        pode_pagar:
          type: boolean
          description: 'Falso quando a cobrança foi emitida a outro responsável: aparece com o selo de estado e sem botão de pagar (UF 13.1).'
        comprovantes:
          type: array
          items:
            $ref: '#/components/schemas/ComprovanteProprietarioNaoResidente'
    PagarCobrancaRequisicaoProprietarioNaoResidente:
      type: object
      required:
      - meio
      properties:
        meio:
          type: string
          enum:
          - boleto
          - pix
          - cartao
          description: Entre as formas ativas do condomínio (RN-FI-02). Boleto já traz QR Code Pix.
x-lacunas:
- Estados da tentativa de pagamento e prazos reais de confirmação de boleto e Pix dependem da validação do Asaas em sandbox (MER/DER 4.10, ADR-002); o texto "Boleto pode levar até 3 dias úteis" é o de UF 13.1.
- Recusa de cartão ("O cartão não foi aprovado. Tente outro cartão, Pix ou boleto.") ocorre no checkout hospedado e chega por webhook; não é erro desta operação.
- Enumeração completa de `origem` da cobrança (mensal, extra, reemissão de multa) não está definida (MER/DER 4.10).
- 'Revogação de procuração: o DER tem `revogada_em`, mas RF e RN não definem a operação; não há rota.'
- 'Identidade do inquilino não é exposta ao proprietário: os docs só dão a ele as datas do contrato (RN-CD-19).'
- O módulo `visitantes` não consta em `01-backend.md` 3.3 para este perfil, mas RF-VI-13 e RN-VI-10 dão ao proprietário o cadastro de hóspede de temporada.
- Estado do contrato de locação (`contrato_locacao.estado`) não é enumerado nos docs.
- 'Ações vedadas a este perfil e sem rota por decisão do PRD 3: reservar, abrir chamado, reclamar, avaliar funcionários, ver score (RN-CD-19, RN-SC-01).'
