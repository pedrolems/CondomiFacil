components:
  securitySchemes:
    bearerJwt:
      $ref: ./componentes/comum.yaml#/components/securitySchemes/bearerJwt
  schemas:
    UnidadeResumoPortaria:
      type: object
      description: Unidade como a portaria a vê. Sem situação financeira, situação de ocupação nem score (SEG-17, RN-RE-13).
      required:
      - unidade_id
      - identificacao
      - rotulo
      properties:
        unidade_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        bloco_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
        bloco_nome:
          oneOf:
          - type: string
          - type: 'null'
        identificacao:
          type: string
          description: Identificação da unidade no bloco (coluna `unidade.identificacao`).
        rotulo:
          type: string
          description: Texto pronto para a tela, no formato "Bloco A · Apto 101".
      examples:
      - unidade_id: 9c1e7f20-4b3a-4d65-8a12-6e0f5b7c3d41
        bloco_id: 5a8d2e91-7c4b-4f13-b6a0-2d9e1c8f7a35
        bloco_nome: Bloco A
        identificacao: Apto 101
        rotulo: Bloco A · Apto 101
    AlertaBloqueioPortaria:
      type: object
      required:
      - bloqueio_id
      - motivo
      properties:
        bloqueio_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        motivo:
          type: string
          description: Motivo registrado pela administradora (RN-CD-15).
    ListaResumoPortaria:
      type: object
      required:
      - lista_id
      - nome
      properties:
        lista_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        nome:
          type: string
    VisitaPortaria:
      type: object
      description: Visita do dia como a portaria a vê (RF-VI-04).
      required:
      - id
      - estado
      - dia
      - nome_visitante
      - tipo
      - unidade
      - fora_do_horario_cadastrado
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        estado:
          $ref: ./componentes/enums.yaml#/components/schemas/EstadoVisita
        dia:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
        nome_visitante:
          type: string
          description: Nome informado no cadastro. O documento do visitante não vem na lista (RN 8.4).
        tipo:
          type: string
          enum:
          - avulsa
          - recorrente
          - hospede_de_temporada
