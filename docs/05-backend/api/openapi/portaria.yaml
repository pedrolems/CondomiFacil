          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        example: d5f7a9c1-3b4e-4682-a1d3-9c0e2b4f6a85
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarVistoriaPortaria'
            examples:
