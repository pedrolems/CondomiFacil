  /v1/sindico/chamados/{chamado_id}/conclusao:
    post:
      operationId: sindicoConcluirChamado
      summary: Conclui um chamado de manutenção
      description: Conclui o chamado de manutenção com fotos opcionais; exige empresa registrada e abre as janelas
        de reabertura (48h) e de avaliação (RN-CH-05, RN-CH-07, RN-CH-14, RN-CH-15). **Subsíndico:** só em substituição.
        Fora da substituição a resposta é `403` (RN-CD-27, RN-CD-28).
      tags:
      - chamados
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: '#/components/parameters/ChamadoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConcluirChamadoSindico'
            example:
              fotos_arquivo_ids:
              - 00000047-1111-4222-8333-000000000047
      responses:
        '201':
          description: Conclusão registrada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChamadoSindico'
              example:
