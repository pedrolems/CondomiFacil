      - SEG-08
  /v1/plataforma/condominios/{condominio_id}/assinatura:
    put:
      operationId: plataformaAlterarAssinatura
      summary: Altera o plano do condomínio
      description: 'Mudança de plano ou de faixa vale a partir do ciclo seguinte e não recalcula fatura antiga (RN-PL-01). Ação auditada (SEG-08). Só o Admin da plataforma; o suporte recebe `403`. Rota da plataforma: não leva `X-Condominio-Id` nem `X-Unidade-Id`; o condomínio, quando houver, vai no caminho.'
      tags:
      - plataforma
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - name: condominio_id
        in: path
        required: true
        description: Identificador do condomínio.
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssinaturaEntradaPlataforma'
            example:
              plano_codigo: gestao_suporte
      responses:
        '200':
          description: Assinatura agendada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssinaturaPlataforma'
              example:
                condominio_id: 0000019b-0000-4000-8000-00000000019b
                plano:
                  codigo: gestao_suporte
                  nome: Gestão + Suporte
                preco_plano_id: 00000193-0000-4000-8000-000000000193
                ciclo_dia: 10
                efetiva_a_partir_de: '2026-12-10T00:00:00-03:00'
                valor_negociado_centavos: null
                franquia_negociada: null
        '400':
