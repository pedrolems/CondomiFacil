                summary: Uso sem dano
                value:
                  resultado: cumprida
                  itens:
                  - item: Piso e bancadas
                    resultado: conforme
                  - item: Mobiliário
                    resultado: conforme
                  fotos:
                  - e3b5d7f9-1a2c-4e64-8f06-0b2d4f6a8c91
              naoComparecimento:
                summary: Reserva paga não usada
                value:
                  resultado: nao_comparecimento
