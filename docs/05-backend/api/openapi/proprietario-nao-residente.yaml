openapi: 3.1.0
info:
  title: CondomiFacil API - interface do proprietário não residente
  version: 0.1.0-proposta
  summary: Rotas /v1/proprietario-nao-residente/*.
  description: '**Proposta de 10/11/2026**, não aceita pelo Pedro. Tudo o que não vem de decisão do Pedro ou do PRD é Proposta.


    Conjunto restrito do proprietário que não mora na unidade, alugada ou desocupada (PRD 3, "Perfis fora da matriz"; `01-backend.md` 3.3, decisão 1; RN-CD-19): vota e indica procurador, vê e paga as cobranças de que é responsável financeiro e vê a situação das demais da unidade, acompanha o contrato de locação, as multas e as reclamações validadas contra a unidade (RN-RC-16) e lê comunicados gerais. Não reserva, não abre chamado, não reclama, não avalia funcionários, não tem score e nunca vê visitantes, chamados, reservas, encomendas nem o score do inquilino. O proprietário que mora na unidade é morador e usa `morador.yaml`.


    Fora deste arquivo: `/v1/eu/*`, `/v1/acesso/*`, `/v1/arquivos/*`, `/v1/sync` e `/v1/score` em `comum.yaml`. Recurso de decisão de reclamação: `/v1/recursos` em `comum.yaml`. Convenções em `../01-guia-da-api.md`.


    Dados de cartão nunca passam pela API (SEG-12). Nenhum DTO devolve o autor de reclamação, a conversa, o conteúdo de voto ou pontos de score.'
servers:
- url: https://api.condomifacil.exemplo
  description: Endereço de exemplo (Proposta; sem ambiente definido)
tags:
- name: condominio
  description: Dados do condomínio, da unidade e do contrato de locação.
- name: convivencia
  description: Reclamações validadas contra a unidade (visão limitada).
- name: comunicados
  description: Comunicados gerais.
- name: visitantes
  description: Hóspede de temporada em unidade desocupada.
- name: governanca
  description: Reuniões, pautas, votações, eleições e procuração.
- name: cobranca
  description: Cobrança da taxa condominial e de cobranças extras.
- name: pagamentos
  description: Pagamento de cobrança pelo gateway (Asaas).
paths:
  /v1/proprietario-nao-residente/condominio:
    get:
      operationId: proprietarioNaoResidenteConsultarCondominio
      summary: Consulta os dados do condomínio ativo
      description: Nome, formas de pagamento aceitas e se o condomínio permite hóspede de temporada (a opção só aparece com a temporada ligada, UF 4.5).
      tags:
      - condominio
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/UnidadeId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      responses:
        '200':
          description: Dados do condomínio.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CondominioProprietarioNaoResidente'
              example:
                id: 7a1d3c55-0e2b-4c8f-b1a4-9d6e5f302b18
                nome: Residencial Jardim das Acácias
                cobranca_ativa: true
                meios_cobranca_aceitos:
                - boleto
                - pix
                - cartao
                temporada_permitida: false
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-FI-01
      - RF-FI-02
      - RN-FI-01
      - RN-VI-10
      - US-AD-11
  /v1/proprietario-nao-residente/unidade:
    get:
      operationId: proprietarioNaoResidenteConsultarUnidade
      summary: Consulta a unidade acompanhada
      description: Unidade do cabeçalho `X-Unidade-Id` (obrigatório), alugada ou desocupada. Quando o proprietário volta a morar, a administradora muda o vínculo e ele passa a usar as rotas de `morador` (RN-CD-25).
      tags:
      - condominio
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/UnidadeIdObrigatorio
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      responses:
        '200':
          description: Unidade.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnidadeProprietarioNaoResidente'
              example:
                id: c2b8e1a4-5d3f-4a6b-8e7c-1f0a9b2d4c63
                identificacao: Apto 101
                bloco: Bloco A
                situacao_ocupacao: alugada
                contrato_fim: '2027-06-30'
                contrato_vence_em_dias: 232
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-AD-19
      - RN-CD-19
      - RN-CD-24
      - RN-CD-25
      - US-AD-11
  /v1/proprietario-nao-residente/contrato-locacao:
    get:
      operationId: proprietarioNaoResidenteConsultarContratoDeLocacao
      summary: Consulta o contrato de locação da unidade
      description: Datas de início e fim do contrato vigente e das renovações; fim nulo é prazo indeterminado (RN-CD-20). Aviso 30 dias antes do fim (RN-CD-21). Unidade desocupada responde 404.
      tags:
      - condominio
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/UnidadeIdObrigatorio
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      responses:
        '200':
          description: Contrato.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratoLocacaoProprietarioNaoResidente'
              example:
                estado: ativo
                inicio: '2026-07-01'
                encerrado_em: null
                versao_atual:
                  numero: 1
                  inicio_contratual: '2026-07-01'
                  fim_contratual: '2027-06-30'
                versoes:
                - numero: 1
                  inicio_contratual: '2026-07-01'
                  fim_contratual: '2027-06-30'
                  registrado_em: '2026-07-01T10:00:00-03:00'
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '404':
          $ref: ./componentes/comum.yaml#/components/responses/Erro404
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-AD-18
      - RF-AD-20
      - RN-CD-19
      - RN-CD-20
      - RN-CD-21
      - US-AD-11
  /v1/proprietario-nao-residente/solicitacoes-de-locacao:
    post:
      operationId: proprietarioNaoResidenteSolicitarCadastroRenovacaoOuEncerramento
      summary: Pede cadastro, renovação ou encerramento do inquilino
      description: Entra na mesma fila de solicitações da administradora; ela atende ou recusa com motivo, e o proprietário é avisado do resultado (RN-CD-23, RF-AD-19). No plano Gestão + Suporte o pedido atendido conta como solicitação (RN-PL-03).
      tags:
      - condominio
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/UnidadeIdObrigatorio
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tipo
              properties:
                tipo:
                  type: string
                  enum:
                  - cadastro_inquilino
                  - renovacao_contrato
                  - encerramento_contrato
                descricao:
                  type: string
                nova_data_fim:
                  $ref: ./componentes/comum.yaml#/components/schemas/Data
            example:
              tipo: renovacao_contrato
              descricao: Renovar por mais 12 meses.
              nova_data_fim: '2028-06-30'
      responses:
        '201':
          description: Pedido enviado.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitacaoLocacaoProprietarioNaoResidente'
              example:
                id: 3f6c1a52-8b1e-4d3a-9a0e-5c1d2b7e9f10
                tipo: renovacao_contrato
                descricao: Renovar por mais 12 meses.
                nova_data_fim: '2028-06-30'
                estado: pendente
                enviada_em: '2026-11-10T09:00:00-03:00'
                atendida_em: null
                motivo_recusa: null
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '422':
          description: Regra de negócio violada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                semcontrato:
                  summary: Unidade sem contrato ativo (renovação ou encerramento)
                  value:
                    codigo: SOLICITACAO_SEM_CONTRATO_ATIVO
                    mensagem: Esta unidade não tem contrato de locação ativo.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
                regraDeNegocio:
                  summary: Regra violada, exemplo genérico (texto Proposta)
                  value:
                    codigo: REGRA_DE_NEGOCIO_VIOLADA
                    mensagem: Não foi possível concluir esta ação pelas regras do condomínio.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-AD-19
      - RN-CD-23
      - RN-PL-03
      - US-AD-11
    get:
      operationId: proprietarioNaoResidenteListarSolicitacoesDeLocacao
      summary: Acompanha os pedidos feitos à administradora
      description: Pedidos do proprietário com status e motivo de recusa (RF-AD-02, RN-CD-23).
      tags:
      - condominio
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/UnidadeIdObrigatorio
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: ./componentes/comum.yaml#/components/parameters/Limite
      - $ref: ./componentes/comum.yaml#/components/parameters/Cursor
      - name: estado
        in: query
        required: false
        description: Um ou mais status, separados por vírgula.
        schema:
          type: array
          items:
            type: string
            enum:
            - pendente
            - concluida
            - recusada
        style: form
        explode: false
      - name: ordenar
        in: query
        required: false
        description: Ordenação; prefixo - para decrescente.
        schema:
          type: string
          enum:
          - enviada_em
          - -enviada_em
          default: -enviada_em
      responses:
        '200':
          description: Página de pedidos.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                type: object
                required:
                - dados
                - paginacao
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/SolicitacaoLocacaoProprietarioNaoResidente'
                  paginacao:
                    $ref: ./componentes/comum.yaml#/components/schemas/Paginacao
              example:
                dados:
                - id: 3f6c1a52-8b1e-4d3a-9a0e-5c1d2b7e9f10
                  tipo: renovacao_contrato
                  descricao: Renovar por mais 12 meses.
                  nova_data_fim: '2028-06-30'
                  estado: recusada
                  enviada_em: '2026-11-10T09:00:00-03:00'
                  atendida_em: '2026-11-11T10:00:00-03:00'
                  motivo_recusa: Contrato ainda não foi assinado.
                paginacao:
                  proximo_cursor: null
                  tem_mais: false
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-AD-02
      - RF-AD-19
      - RN-CD-23
      - US-AD-11
  /v1/proprietario-nao-residente/reclamacoes-validadas:
    get:
      operationId: proprietarioNaoResidenteListarReclamacoesValidadasDaUnidade
      summary: Lista as reclamações validadas contra a unidade
      description: 'Reclamações contra a unidade alugada ou desocupada que foram validadas: categoria, data, decisão e multa. O proprietário não vê a conversa nem quem reclamou e não perde pontos (RN-RC-16, RN-SC-13). Não registra reclamação (RN-CD-19). Recurso, se houver, é de `/v1/recursos` em `comum.yaml`.'
      tags:
      - convivencia
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/UnidadeIdObrigatorio
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: ./componentes/comum.yaml#/components/parameters/Limite
      - $ref: ./componentes/comum.yaml#/components/parameters/Cursor
      - name: de
        in: query
        required: false
        description: Data inicial, inclusive (aaaa-mm-dd).
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
      - name: ate
        in: query
        required: false
        description: Data final, inclusive (aaaa-mm-dd).
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
      - name: ordenar
        in: query
        required: false
        description: Ordenação; prefixo - para decrescente.
        schema:
          type: string
          enum:
          - decidida_em
          - -decidida_em
          default: -decidida_em
      responses:
        '200':
          description: Página de reclamações validadas.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                type: object
                required:
                - dados
                - paginacao
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReclamacaoValidadaProprietarioNaoResidente'
                  paginacao:
                    $ref: ./componentes/comum.yaml#/components/schemas/Paginacao
              example:
                dados:
                - id: 3f6c1a52-8b1e-4d3a-9a0e-5c1d2b7e9f10
                  categoria: Barulho
                  data_ocorrencia: '2026-11-07'
                  decidida_em: '2026-11-20T14:00:00-03:00'
                  decisao: validada
                  multa:
                    cobranca_id: 7a1d3c55-0e2b-4c8f-b1a4-9d6e5f302b18
                    valor_centavos: 20000
                paginacao:
                  proximo_cursor: null
                  tem_mais: false
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-RS-15
      - RN-RC-16
      - RN-CD-19
      - RN-SC-13
      - US-AD-11
  /v1/proprietario-nao-residente/hospedes-de-temporada:
    post:
      operationId: proprietarioNaoResidenteCadastrarHospedeDeTemporada
      summary: Cadastra hóspede de temporada
      description: Só em unidade desocupada e se o condomínio permitir a temporada (desligado por padrão). A portaria vê o hóspede marcado como "hóspede de temporada"; ele não tem login nem score (RN-VI-10). Única operação de visitante deste perfil (RN-CD-19).
      tags:
      - visitantes
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/UnidadeIdObrigatorio
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nome
              - data_entrada
              - data_saida
              properties:
                nome:
                  type: string
                  minLength: 1
                documento:
                  type: string
                data_entrada:
                  $ref: ./componentes/comum.yaml#/components/schemas/Data
                data_saida:
                  $ref: ./componentes/comum.yaml#/components/schemas/Data
            example:
              nome: Fernanda Dias
              data_entrada: '2026-12-20'
              data_saida: '2026-12-27'
      responses:
        '201':
          description: Hóspede cadastrado.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HospedeTemporadaProprietarioNaoResidente'
              example:
                id: 9e4d2b71-6a3c-4f58-b0d1-2c7e5a8f3b19
                nome: Fernanda Dias
                documento: null
                data_entrada: '2026-12-20'
                data_saida: '2026-12-27'
                estado: esperado
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '422':
          description: Regra de negócio violada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                desligada:
                  summary: Temporada desligada no condomínio (RN-VI-10)
                  value:
                    codigo: TEMPORADA_NAO_PERMITIDA
                    mensagem: Este condomínio não permite aluguel por temporada.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
                ocupada:
                  summary: Unidade não está desocupada (RN-VI-10)
                  value:
                    codigo: UNIDADE_NAO_DESOCUPADA
                    mensagem: Hóspede de temporada só vale em unidade desocupada.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
                regraDeNegocio:
                  summary: Regra violada, exemplo genérico (texto Proposta)
                  value:
                    codigo: REGRA_DE_NEGOCIO_VIOLADA
                    mensagem: Não foi possível concluir esta ação pelas regras do condomínio.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-VI-13
      - RN-VI-10
      - RN-CD-19
      - RN-CD-24
      - US-AD-11
    get:
      operationId: proprietarioNaoResidenteListarHospedesDeTemporada
      summary: Lista os hóspedes de temporada cadastrados
      description: Hóspedes que o proprietário cadastrou na unidade (RN-VI-10).
      tags:
      - visitantes
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/UnidadeIdObrigatorio
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: ./componentes/comum.yaml#/components/parameters/Limite
      - $ref: ./componentes/comum.yaml#/components/parameters/Cursor
      - name: de
        in: query
        required: false
        description: Data inicial, inclusive (aaaa-mm-dd).
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
      - name: ate
        in: query
        required: false
        description: Data final, inclusive (aaaa-mm-dd).
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
      - name: ordenar
