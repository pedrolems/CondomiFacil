        unidade_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        resultado:
          type: string
          enum:
          - registrado
          - recusado
        motivo:
          type:
          - string
          - 'null'
          description: '`UNIDADE_JA_VOTOU` quando recusado ("Esta unidade já votou pelo app.", RN-VO-11).'
        substituiu_voto_do_inquilino:
          type: boolean
          description: Voto presencial do proprietário substitui o do inquilino (RN-VO-11, RN-VO-18).
    AnexarAtaSindico:
      type: object
      description: 'Dois PDFs já enviados por `/v1/arquivos/*`: ata e lista de presença.'
      required:
      - ata_arquivo_id
      - presenca_arquivo_id
      properties:
        ata_arquivo_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        presenca_arquivo_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
    ResultadoReuniaoSindico:
      type: object
      description: Contagem por opção, sem votante (RN-VO-03).
      required:
      - reuniao_id
      - pautas
      properties:
        reuniao_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        pautas:
          type: array
          items:
            type: object
            required:
            - pauta_id
            - titulo
            - resultado
            - contagem
            properties:
              pauta_id:
                $ref: ./componentes/comum.yaml#/components/schemas/Uuid
              titulo:
                type: string
              resultado:
                type: string
                enum:
                - encerrada
                - sem_quorum
                - empate
                description: '`sem_quorum` e `empate` são os rótulos de RN-VO-17; `encerrada` (votação apurada)
                  é código Proposto, sem fonte literal (RN-VO-03 só fala em encerramento). A consequência segue
                  a convenção, fora do app.'
              contagem:
                type: array
                items:
                  type: object
                  required:
                  - opcao_id
                  - texto
                  - quantidade
                  properties:
                    opcao_id:
                      $ref: ./componentes/comum.yaml#/components/schemas/Uuid
                    texto:
                      type: string
                    quantidade:
                      type: integer
    CandidaturaSindico:
      type: object
      required:
      - id
      - cargo
      - candidato_nome
      - unidade_identificacao
      - estado
      - motivo_inelegibilidade
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        cargo:
          type: string
          enum:
          - sindico
          - subsindico
        candidato_nome:
          type: string
        unidade_identificacao:
          type: string
        estado:
          type: string
          description: Ciclo da candidatura não definido nos docs (lacuna); códigos como `aceita` são Proposta,
            sem fonte literal.
        motivo_inelegibilidade:
          type:
          - string
          - 'null'
    EleicaoSindico:
      type: object
      required:
      - id
      - candidaturas_inicio
      - candidaturas_fim
      - estado
      - candidaturas
      - resultado
      properties:
        resultado_inconclusivo:
          type: [object, 'null']
          description: 'Somente após encerramento. Decisão de 12/11/2026: segundo empate ou ausência de elegível, sem vencedor automático; encaminhado ao condutor legitimado vigente de RN-VO-13, sem exigir administradora ou suporte pago (atualização de 13/11/2026).'
          required: [motivo]
          properties:
            motivo:
              type: string
              enum: [segundo_turno_empatado, sem_candidato_elegivel]
              description: Códigos propostos; não enumera todo o ciclo eleitoral.
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        candidaturas_inicio:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        candidaturas_fim:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        estado:
          type: string
          description: Ciclo da eleição não definido nos docs (lacuna); códigos como `candidaturas_abertas` são
            Proposta, sem fonte literal.
        candidaturas:
          type: array
          items:
            $ref: '#/components/schemas/CandidaturaSindico'
        resultado:
          type:
          - array
          - 'null'
          description: Só depois do encerramento (RF-VO-07).
          items:
            type: object
            required:
            - cargo
            - candidatura_id
            - classificacao
            - quantidade_votos
            properties:
              cargo:
                type: string
                enum:
                - sindico
                - subsindico
              candidatura_id:
                $ref: ./componentes/comum.yaml#/components/schemas/Uuid
              classificacao:
                type: integer
              quantidade_votos:
                type: integer
    AbrirEleicaoSindico:
      type: object
      required:
      - candidaturas_inicio
      - candidaturas_fim
      properties:
        candidaturas_inicio:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        candidaturas_fim:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
    CategoriaFinanceiraSindico:
      type: string
      enum:
      - energia
      - agua_e_esgoto
      - gas
      - servicos_terceirizados
      - folha_de_funcionarios
      - manutencao_e_obras
      - seguros
      - administracao
      - outros
      - taxa_condominial
      - cobrancas_extras
      - multas_e_juros_por_atraso
      - multas_por_infracao
      - aluguel_de_areas
      - outras_receitas
      description: 'Categoria fixa de RN-FI-32 (códigos sem acento são Proposta de nomenclatura). Despesas: energia,
        agua_e_esgoto, gas, servicos_terceirizados, folha_de_funcionarios, manutencao_e_obras, seguros, administracao,
        outros. Receitas: taxa_condominial, cobrancas_extras, multas_e_juros_por_atraso, multas_por_infracao, aluguel_de_areas,
        outras_receitas.'
    ValorPorCategoriaFinancasSindico:
      type: object
      required:
      - categoria
      - valor_centavos
      - quantidade_cobrancas_pagas
      properties:
        categoria:
          $ref: '#/components/schemas/CategoriaFinanceiraSindico'
        valor_centavos:
          $ref: ./componentes/comum.yaml#/components/schemas/Centavos
        quantidade_cobrancas_pagas:
          type:
          - integer
          - 'null'
          description: Só nas receitas de cobrança agregadas (por exemplo, 117 cobranças pagas).
    ResumoFinanceiroSindico:
      type: object
      description: 'Regime de caixa: vale a data do pagamento, não a do vencimento (RN-FI-21).'
      required:
      - mes_referencia
      - periodo_meses
      - receitas_centavos
      - despesas_centavos
      - saldo_centavos
      - comparacao_mes_anterior
      - receitas_por_categoria
      - despesas_por_categoria
      - evolucao
      properties:
        mes_referencia:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          description: Mês no formato aaaa-mm.
          examples:
          - 2026-10
        periodo_meses:
          type: integer
          enum:
          - 1
          - 3
          - 6
          - 12
        receitas_centavos:
          $ref: ./componentes/comum.yaml#/components/schemas/Centavos
        despesas_centavos:
          $ref: ./componentes/comum.yaml#/components/schemas/Centavos
        saldo_centavos:
          type: integer
          format: int64
          description: Receitas menos despesas, em centavos; pode ser negativo (RN-FI-21).
        comparacao_mes_anterior:
          oneOf:
          - type: object
            description: Valores do mês anterior; só para período de 1 mês (RN-FI-21).
            required:
            - receitas_centavos
            - despesas_centavos
            - saldo_centavos
            properties:
              receitas_centavos:
                $ref: ./componentes/comum.yaml#/components/schemas/Centavos
              despesas_centavos:
                $ref: ./componentes/comum.yaml#/components/schemas/Centavos
              saldo_centavos:
                type: integer
                format: int64
          - type: 'null'
        receitas_por_categoria:
          type: array
          items:
            $ref: '#/components/schemas/ValorPorCategoriaFinancasSindico'
          description: Cobranças extras (fundo de reserva e obras) discriminadas (RN-FI-21).
        despesas_por_categoria:
          type: array
          items:
            $ref: '#/components/schemas/ValorPorCategoriaFinancasSindico'
        evolucao:
          type:
          - array
          - 'null'
          description: Evolução mês a mês; só para períodos de 3, 6 ou 12 meses. Todo gráfico tem esta tabela equivalente
            (RN-FI-21).
          items:
            type: object
            required:
            - mes
            - receitas_centavos
            - despesas_centavos
            - saldo_centavos
            properties:
              mes:
                type: string
                pattern: ^\d{4}-(0[1-9]|1[0-2])$
                description: Mês no formato aaaa-mm.
                examples:
                - 2026-10
              receitas_centavos:
                $ref: ./componentes/comum.yaml#/components/schemas/Centavos
              despesas_centavos:
                $ref: ./componentes/comum.yaml#/components/schemas/Centavos
              saldo_centavos:
                type: integer
                format: int64
    LancamentoFinanceiroSindico:
      type: object
      description: Lançamento em leitura. Sem unidade nem responsável financeiro (RN-FI-30). O comprovante se lê
        por URL assinado em `/v1/arquivos/*`.
      required:
      - id
      - tipo
      - categoria
      - subservico
      - data_caixa
      - valor_centavos
      - fornecedor_ou_origem
      - descricao
      - origem
      - estado
      - quantidade_cobrancas_pagas
      - tem_comprovante
      - comprovante_arquivo_id
      - lancamento_original_id
      - motivo_estorno
      - mes_fechado
      - quantidade_comentarios
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        tipo:
          type: string
          enum:
          - receita
          - despesa
        categoria:
          $ref: '#/components/schemas/CategoriaFinanceiraSindico'
        subservico:
          type:
          - string
          - 'null'
          enum:
          - portaria
          - limpeza
          - elevador
          - jardinagem
          - outro
          - null
          description: Só em serviços terceirizados (RN-FI-32).
        data_caixa:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
        valor_centavos:
          $ref: ./componentes/comum.yaml#/components/schemas/Centavos
        fornecedor_ou_origem:
          type:
          - string
          - 'null'
        descricao:
          type:
          - string
          - 'null'
        origem:
          type: string
          enum:
          - automatico
          - avulso
          description: '`automatico` vem de cobrança ou reserva paga e não se edita (RN-FI-22).'
        estado:
          $ref: ./componentes/enums.yaml#/components/schemas/EstadoLancamento
        quantidade_cobrancas_pagas:
          type:
          - integer
          - 'null'
        tem_comprovante:
          type: boolean
          description: Falso nas despesas sem comprovante ("Não anexado", RN-FI-24).
        comprovante_arquivo_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
        lancamento_original_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
        motivo_estorno:
          type:
          - string
          - 'null'
        mes_fechado:
          type: boolean
        quantidade_comentarios:
          type: integer
    TotaisLancamentosFinanceirosSindico:
      type: object
      description: Totais do mesmo filtro da lista (RF-FI-21).
      required:
      - receitas_centavos
      - despesas_centavos
      - saldo_centavos
      properties:
        receitas_centavos:
          $ref: ./componentes/comum.yaml#/components/schemas/Centavos
        despesas_centavos:
          $ref: ./componentes/comum.yaml#/components/schemas/Centavos
        saldo_centavos:
          type: integer
          format: int64
    MesFinanceiroSindico:
      type: object
