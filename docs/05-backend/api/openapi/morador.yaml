          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
        eleicao_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
        outorgante_nome:
          type: string
        procurador_vinculo_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        procurador_nome:
