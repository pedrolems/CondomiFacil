      - gravidade_final
      - justificativa
      - decidida_em
      properties:
        resultado:
          type: string
          enum:
          - validada
          - negada
        motivo_negativa:
          type:
          - string
          - 'null'
          enum:
          - nao_procede_boa_fe
          - desproporcional
          - falsa_ma_fe
          - duplicada
          - null
        gravidade_final:
          oneOf:
          - type: string
            enum:
            - leve
            - media
            - grave
            description: Gravidade (RN 5.4).
          - type: 'null'
        justificativa:
          type:
          - string
          - 'null'
        decidida_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
    ReclamacaoSindico:
      type: object
      description: 'Detalhe para o julgador. O score do reclamante e do alvo não vem neste DTO: o julgador o consulta
        no endpoint único `GET /v1/score` de `comum.yaml` com `escopo=reclamacao` (RF-RS-03, ADR-010, RN-SC-02);
        o painel faz chamadas adicionais a `/v1/score`, e devolver em lote é ponto a avaliar. O score é referência,
        não decide sozinho (RN-SC-11). O recurso é criado, consultado e decidido por `/v1/recursos` de `comum.yaml`
        (RN-RC-07).'
      required:
      - id
      - categoria
      - gravidade_inicial
      - estado
      - aberta_em
      - alvo
      - reclamante
      - voce_e_o_julgador
      - semaforo
      - descricao
      - data_ocorrencia
      - alvo_respondeu
      - decisao_liberada
      - decisao_liberada_em
      - mensagens
      - decisao
      - recurso_id
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        categoria:
          type: string
        gravidade_inicial:
          type: string
          enum:
          - leve
          - media
          - grave
          description: Gravidade (RN 5.4).
        estado:
          $ref: ./componentes/enums.yaml#/components/schemas/EstadoReclamacao
        aberta_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        alvo:
          $ref: '#/components/schemas/AlvoReclamacaoSindico'
        reclamante:
          $ref: '#/components/schemas/ReclamanteReclamacaoSindico'
        voce_e_o_julgador:
          type: boolean
          description: Verdadeiro quando você é o julgador vigente desta reclamação.
        semaforo:
          oneOf:
          - $ref: '#/components/schemas/SemaforoPrazoReclamacaoSindico'
          - type: 'null'
        descricao:
          type: string
        data_ocorrencia:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
        alvo_respondeu:
          type: boolean
        decisao_liberada:
          type: boolean
          description: Decisão liberada com a resposta do alvo ou após o prazo sem resposta (RN-RC-04).
        decisao_liberada_em:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          - type: 'null'
        mensagens:
          type: array
          items:
            $ref: '#/components/schemas/MensagemReclamacaoSindico'
        decisao:
          oneOf:
          - $ref: '#/components/schemas/DecisaoReclamacaoSindico'
          - type: 'null'
        recurso_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
    IniciarConversaReclamacaoSindico:
      type: object
