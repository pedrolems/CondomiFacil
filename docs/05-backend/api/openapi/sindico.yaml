    ComentarioFinanceiroSindico:
      type: object
      description: Comentário imutável, com autor e data; não altera valores nem aprova o mês (RN-FI-31).
      required:
      - id
      - lancamento_id
      - competencia
      - autor_nome
      - autor_papel
      - texto
      - criado_em
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        lancamento_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
        competencia:
          type:
          - string
          - 'null'
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
        autor_nome:
          type: string
        autor_papel:
          type: string
          enum:
          - sindico
          - sindico_profissional
          - subsindico_em_substituicao
        texto:
          type: string
        criado_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
    CriarComentarioFinanceiroSindico:
      type: object
      description: 'Exatamente um alvo: `lancamento_id` ou `competencia`.'
      required:
      - texto
      properties:
        lancamento_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
        competencia:
          type:
          - string
          - 'null'
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
        texto:
          type: string
    PedidoExportacaoFinancasSindico:
      type: object
