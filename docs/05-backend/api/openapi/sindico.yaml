      required:
      - formato
      properties:
        formato:
          type: string
          enum:
          - csv
          - pdf
        mes_referencia:
          oneOf:
          - type: string
            pattern: ^\d{4}-(0[1-9]|1[0-2])$
            description: Mês no formato aaaa-mm.
            examples:
            - 2026-10
          - type: 'null'
        periodo_meses:
          type: integer
          enum:
          - 1
          - 3
          - 6
          - 12
          default: 1
        categoria:
          type: array
          items:
            $ref: '#/components/schemas/CategoriaFinanceiraSindico'
        tipo:
          type:
          - string
          - 'null'
          enum:
          - receita
          - despesa
          - null
        busca:
          type:
          - string
          - 'null'
    ExportacaoFinancasSindico:
      type: object
      description: Exportação do resumo e dos lançamentos filtrados, sem dados de unidade nem de responsável (RN-FI-30).
      required:
