components:
  securitySchemes:
    bearerJwt:
      $ref: ./componentes/comum.yaml#/components/securitySchemes/bearerJwt
  parameters:
    ComunicadoId:
      name: comunicado_id
      in: path
      required: true
      description: Identificador do comunicado.
      schema:
        $ref: ./componentes/comum.yaml#/components/schemas/Uuid
    ReuniaoId:
      name: reuniao_id
      in: path
      required: true
      description: Identificador da reunião.
      schema:
        $ref: ./componentes/comum.yaml#/components/schemas/Uuid
    VotacaoId:
      name: votacao_id
      in: path
      required: true
      description: Identificador da votação.
      schema:
        $ref: ./componentes/comum.yaml#/components/schemas/Uuid
    CobrancaId:
      name: cobranca_id
      in: path
      required: true
      description: Identificador da cobrança.
      schema:
        $ref: ./componentes/comum.yaml#/components/schemas/Uuid
  schemas:
    CondominioProprietarioNaoResidente:
      type: object
      required:
      - id
      - nome
      - cobranca_ativa
      - meios_cobranca_aceitos
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        nome:
          type: string
        cobranca_ativa:
          type: boolean
        meios_cobranca_aceitos:
          type: array
          items:
            type: string
            enum:
            - boleto
            - pix
            - cartao
        temporada_permitida:
          type: boolean
          description: Aluguel por temporada permitido no condomínio; desligado por padrão (RN-VI-10).
    UnidadeProprietarioNaoResidente:
      type: object
      description: Unidade do proprietário. Não traz visitantes, chamados, reservas, encomendas nem score do inquilino (RN-CD-19).
      required:
      - id
      - identificacao
      - situacao_ocupacao
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        identificacao:
          type: string
        bloco:
          oneOf:
          - type: string
          - type: 'null'
        situacao_ocupacao:
          type: string
          enum:
          - alugada
          - desocupada
        contrato_fim:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Data
          - type: 'null'
        contrato_vence_em_dias:
          oneOf:
          - type: integer
          - type: 'null'
    ContratoLocacaoProprietarioNaoResidente:
      type: object
      description: Só as datas do contrato, sem dados da rotina do inquilino (RN-CD-19).
      required:
      - estado
      - inicio
      - versao_atual
      properties:
        estado:
          type: string
          description: Estado do contrato (MER/DER 4.2); enumeração é lacuna.
        inicio:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
        encerrado_em:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Data
          - type: 'null'
        versao_atual:
          type: object
          required:
          - numero
          - inicio_contratual
          properties:
            numero:
              type: integer
            inicio_contratual:
              $ref: ./componentes/comum.yaml#/components/schemas/Data
            fim_contratual:
              oneOf:
              - $ref: ./componentes/comum.yaml#/components/schemas/Data
              - type: 'null'
        versoes:
          type: array
          items:
            type: object
            required:
            - numero
            - inicio_contratual
            properties:
              numero:
                type: integer
              inicio_contratual:
                $ref: ./componentes/comum.yaml#/components/schemas/Data
              fim_contratual:
                oneOf:
                - $ref: ./componentes/comum.yaml#/components/schemas/Data
                - type: 'null'
              registrado_em:
                $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          description: Renovações não apagam a data anterior.
    SolicitacaoLocacaoProprietarioNaoResidente:
      type: object
      required:
      - id
      - tipo
      - estado
      - enviada_em
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        tipo:
          type: string
          enum:
          - cadastro_inquilino
          - renovacao_contrato
          - encerramento_contrato
        descricao:
          oneOf:
          - type: string
          - type: 'null'
        nova_data_fim:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Data
          - type: 'null'
        estado:
          type: string
          enum:
          - pendente
          - concluida
          - recusada
          description: Fila com estes status (RF-AD-02).
        enviada_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        atendida_em:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          - type: 'null'
        motivo_recusa:
          oneOf:
          - type: string
            description: Informado pela administradora ao recusar (RN-CD-23).
          - type: 'null'
    ReclamacaoValidadaProprietarioNaoResidente:
      type: object
      description: Só categoria, data, decisão e multa (RN-RC-16). Sem a conversa, sem quem reclamou, sem pontos e sem score (ADR-010).
      required:
      - id
      - categoria
      - data_ocorrencia
      - decidida_em
      - decisao
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        categoria:
          type: string
        data_ocorrencia:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
        decidida_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        decisao:
          type: string
          enum:
          - validada
        multa:
          oneOf:
          - type: object
            required:
            - valor_centavos
            properties:
              cobranca_id:
                oneOf:
                - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
                - type: 'null'
              valor_centavos:
                $ref: ./componentes/comum.yaml#/components/schemas/Centavos
          - type: 'null'
    HospedeTemporadaProprietarioNaoResidente:
      type: object
      required:
      - id
      - nome
      - data_entrada
      - data_saida
      - estado
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        nome:
          type: string
        documento:
          oneOf:
          - type: string
          - type: 'null'
        data_entrada:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
        data_saida:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
        estado:
          $ref: ./componentes/enums.yaml#/components/schemas/EstadoVisita
    ComunicadoProprietarioNaoResidente:
      type: object
      description: Só comunicado geral para moradores ou para todos (RN-CD-19). Não há resposta nem comunicado individual.
      required:
      - id
      - titulo
      - enviado_em
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        titulo:
          type: string
        texto:
          type: string
          description: Só no detalhe.
        autor:
          type: object
          required:
          - nome
          properties:
            nome:
              type: string
            papel:
              oneOf:
              - type: string
              - type: 'null'
        enviado_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        lido_em:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          - type: 'null'
    OpcaoVotacaoProprietarioNaoResidente:
      type: object
      required:
      - id
      - texto
      - ordem
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        texto:
          type: string
        ordem:
          type: integer
    MinhaSituacaoDeVotoProprietarioNaoResidente:
