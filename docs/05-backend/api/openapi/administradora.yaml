components:
  securitySchemes:
    bearerJwt:
      $ref: ./componentes/comum.yaml#/components/securitySchemes/bearerJwt
  schemas:
    BlocoAdministradora:
      type: object
      required:
      - id
      - nome
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        nome:
          type: string
          examples:
          - Torre A
    BlocoEntradaAdministradora:
      type: object
      required:
      - nome
      properties:
        nome:
          type: string
          description: Nome do bloco (torre ou quadra).
          examples:
          - Torre A
    PortariaAdministradora:
      type: object
      required:
      - id
      - nome
      - atende_todos_blocos
      - blocos_ids
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        nome:
          type: string
          examples:
          - Portaria Principal
        atende_todos_blocos:
          type: boolean
          description: Quando verdadeiro, a portaria atende todos os blocos.
          examples:
          - true
        blocos_ids:
          type: array
          items:
            $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          description: Blocos que a portaria atende; vazio quando atende todos.
    PortariaEntradaAdministradora:
      type: object
      required:
      - nome
      - atende_todos_blocos
      properties:
        nome:
          type: string
          examples:
          - Portaria Torre B
        atende_todos_blocos:
          type: boolean
          examples:
          - false
        blocos_ids:
          type: array
          items:
            $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          description: Obrigatório (ao menos um) quando `atende_todos_blocos` é falso.
    MoradorHabilitadoAdministradora:
      type: object
      required:
      - vinculo_unidade_id
      - nome
      - tipo
      - inicio
      properties:
        vinculo_unidade_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        vinculo_condominio_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        nome:
          type: string
          examples:
          - Ana Souza
        tipo:
          type: string
          enum:
          - proprietario
          - inquilino
          description: Tipo do vínculo na unidade.
          examples:
          - proprietario
        inicio:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
    UnidadeAdministradora:
      type: object
      required:
      - id
      - identificacao
      - situacao_ocupacao
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        bloco_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
        identificacao:
          type: string
          examples:
          - Apto 101
        fracao_ideal:
          type:
          - number
          - 'null'
          description: Fração ideal, positiva quando usada na cobrança.
          examples:
          - 0.0125
        situacao_ocupacao:
          type: string
          enum:
          - residida_pelo_proprietario
          - alugada
          - desocupada
          description: Situação de ocupação. Os nomes oficiais são "alugada" e "desocupada" (RN-CD-20, RN-CD-24); o código do proprietário residente é Proposta.
          examples:
          - alugada
        morador_habilitado:
          oneOf:
          - $ref: '#/components/schemas/MoradorHabilitadoAdministradora'
          - type: 'null'
    UnidadeEntradaAdministradora:
      type: object
      required:
      - identificacao
      properties:
        bloco_id:
          oneOf:
