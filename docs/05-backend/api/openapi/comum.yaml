      - reclamacao_id
      - justificativa
      properties:
        reclamacao_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          description: Reclamação decidida; o recurso liga-se à decisão dela (MER `recurso_reclamacao.decisao_id`, UQ por decisão).
        justificativa:
          type: string
          minLength: 1
    RecursoComum:
      type: object
      description: Nunca traz a identidade do reclamante nem o corpo da reclamação (ADR-010).
      required:
      - id
      - reclamacao_id
      - solicitado_em
      - justificativa
      - estado_reclamacao
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        reclamacao_id:
