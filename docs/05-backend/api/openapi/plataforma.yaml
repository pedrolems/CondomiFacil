        depois_sanitizado:
          type:
          - object
          - 'null'
        registrada_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
    ContagemSolicitacoesSuportePlataforma:
      type: object
      required:
      - condominio_id
      - competencia
      - franquia_mensal
      - atendidas
      - excedentes
