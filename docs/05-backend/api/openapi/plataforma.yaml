          examples:
          - 12
        excedentes:
          type: integer
          description: Atendidas além da franquia.
          examples:
          - 2
        valor_por_excedente_centavos:
          $ref: ./componentes/comum.yaml#/components/schemas/Centavos
        valor_excedente_centavos:
          $ref: ./componentes/comum.yaml#/components/schemas/Centavos
    ParametroPadraoPlataforma:
      type: object
