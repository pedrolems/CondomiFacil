          type: string
          description: 'Estado da candidatura não é enumerado nos docs: lacuna.'
        motivo_inelegibilidade:
          oneOf:
          - type: string
            description: Só na candidatura do próprio usuário (RN-VO-13).
          - type: 'null'
    EleicaoResumoMorador:
      type: object
      required:
      - id
      - candidaturas_inicio
      - candidaturas_fim
      - estado
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        candidaturas_inicio:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        candidaturas_fim:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        estado:
          type: string
          description: Estados de reunião, votação e eleição não estão enumerados nos docs; `Encerrada`, `Sem quórum` e `Empate` são citados em MER/DER 4.9 (lacuna).
    EleicaoMorador:
      allOf:
      - $ref: '#/components/schemas/EleicaoResumoMorador'
      - type: object
        required:
        - candidaturas
        - votacoes
        properties:
          candidaturas:
            type: array
            items:
              $ref: '#/components/schemas/CandidaturaMorador'
          votacoes:
            type: array
            items:
              $ref: '#/components/schemas/VotacaoDaPautaMorador'
            description: Uma por cargo e turno; o segundo turno abre em até 7 dias em caso de empate (RN-VO-07). Resultado só após o encerramento.
    CobrancaMorador:
      type: object
      description: 'Cobrança da unidade. Situação financeira só para quem a SEG-17 permite: responsável financeiro e, no caso do proprietário, a unidade; nunca para outros moradores (RN-FI-10).'
      required:
      - id
      - competencia
      - natureza_despesa
      - principal_centavos
      - total_centavos
      - vencimento
      - estado
      - pode_pagar
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        competencia:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}$
        origem:
          type: string
          description: Mensal ou extra (MER/DER 4.10; enumeração completa é lacuna).
        natureza_despesa:
          type: string
          enum:
          - ordinaria
          - extraordinaria
          description: Taxa mensal é ordinária; fundo de reserva e obras são extraordinárias (RN-FI-20, RF-FI-16).
        descricao:
          oneOf:
          - type: string
            description: Por exemplo, Taxa condominial de novembro ou multa por infração.
          - type: 'null'
        principal_centavos:
          $ref: ./componentes/comum.yaml#/components/schemas/Centavos
        desconto_centavos:
          $ref: ./componentes/comum.yaml#/components/schemas/Centavos
        multa_centavos:
          $ref: ./componentes/comum.yaml#/components/schemas/Centavos
        juros_centavos:
          $ref: ./componentes/comum.yaml#/components/schemas/Centavos
        total_centavos:
          allOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Centavos
          description: Valor atualizado até `valor_calculado_em`, com multa (até 2%) e juros do dia (RN-FI-06, RN-FI-08).
        valor_calculado_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        vencimento:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
        estado:
          $ref: ./componentes/enums.yaml#/components/schemas/EstadoCobranca
        emitida_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        responsavel_papel:
          oneOf:
          - type: string
            enum:
            - proprietario
            - inquilino
            description: Quem é o responsável financeiro desta cobrança, para o selo "Paga pelo inquilino" (UF 13.1).
          - type: 'null'
        pode_pagar:
          type: boolean
          description: 'Falso quando a cobrança foi emitida a outro responsável: aparece com o selo de estado e sem botão de pagar (UF 13.1).'
        comprovantes:
          type: array
          items:
            $ref: '#/components/schemas/ComprovanteMorador'
    PagarCobrancaRequisicaoMorador:
      type: object
      required:
      - meio
      properties:
        meio:
          type: string
          enum:
          - boleto
          - pix
          - cartao
          description: Entre as formas ativas do condomínio (RN-FI-02). Boleto já traz QR Code Pix.
x-lacunas:
- Granularidade dos horários reserváveis (hora cheia, blocos fixos ou intervalo livre) e horário de funcionamento da área não estão definidos nos docs; a disponibilidade devolve só intervalos não livres.
- Estados da tentativa de pagamento (`tentativa_pagamento`) são Proposta até o gateway ser validado em sandbox (MER/DER 4.10); a API devolve só os dados de pagamento, não o estado da tentativa.
- Recusa de cartão acontece no checkout hospedado do Asaas e chega por webhook; o texto "O pagamento não foi aprovado. Seu horário fica guardado até [hora]." (UF 5.1) é entregue por notificação, não como erro desta operação.
- '`Idempotency-Key` em reserva, pagamento e cancelamento é proposta técnica, fora das RN; tempo de guarda é lacuna do guia.'
- Estados de `lista_visitantes` e de `reuniao`, `votacao` e `eleicao` não são enumerados nos docs (MER/DER 4.4 e 4.9); os DTOs usam texto livre com exemplos.
- 'Catálogo de categorias de chamado (ex.: piscina, jardim, ar-condicionado) não está definido (RF-CH-01); `categoria` é texto.'
- 'Lista de entrada bloqueada: a matriz do PRD 3 não dá ao Morador a visão da lista; não há operação.'
- Denúncia de conteúdo (RF-RS-14), recurso (RF-RS-09) e preferências de notificação (RF-NO-01) são de `comum.yaml` por serem abertas a três ou mais perfis com o mesmo DTO.
- 'Nota do setor (RF-PE-04): rota em `comum.yaml` (`/v1/notas-dos-setores`), para todos os perfis; não há rota aqui.'
- Valores de `motivo_negativa` são os da lista de RN-RC-05 em código `snake_case`; a lista de motivos como catálogo não está definida.
- 'Limite de fotos na abertura de chamado e de reclamação: lacuna (RN-CH-14 só limita as fotos de conclusão).'
- Estados da tentativa de pagamento e prazos reais de confirmação de boleto e Pix dependem da validação do Asaas em sandbox (MER/DER 4.10, ADR-002); o texto "Boleto pode levar até 3 dias úteis" é o de UF 13.1.
- Recusa de cartão ("O cartão não foi aprovado. Tente outro cartão, Pix ou boleto.") ocorre no checkout hospedado e chega por webhook; não é erro desta operação.
- Enumeração completa de `origem` da cobrança (mensal, extra, reemissão de multa) não está definida (MER/DER 4.10).
- 'Revogação de procuração: o DER tem `revogada_em`, mas RF e RN não definem a operação; não há rota.'
- Como o morador escolhe o procurador (busca de usuários do condomínio) não está definido nos docs; `possiveis-procuradores` é Proposta de apoio a UF 11.1.
