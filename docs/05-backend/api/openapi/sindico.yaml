  schemas:
    AbrirChamadoSindico:
      type: object
      description: Abertura de chamado pelo síndico profissional, sem unidade. Mesmos campos da abertura de morador (RN-CH-02, RN-CH-09).
      required:
      - tipo
      - categoria
      - descricao
      - urgencia
      properties:
        tipo:
          type: string
          enum:
          - limpeza
          - manutencao
        categoria:
          type: string
          minLength: 1
        local:
          type: string
        descricao:
          type: string
          minLength: 1
        urgencia:
          $ref: '#/components/schemas/UrgenciaChamadoSindico'
        fotos:
          type: array
          items:
            $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          description: 'Fotos já enviadas por `/v1/arquivos/*` (opcionais, RN-CH-03). Limite na abertura: lacuna.'
    UrgenciaChamadoSindico:
      type: string
      description: 'Urgência do chamado (RN-CH-09): alta, média ou leve. Sempre mostrada com texto e cor (RN-CH-10).'
      enum:
      - alta
      - media
      - leve
    BaseAvaliacaoSindico:
      type: string
      description: 'Base da avaliação (RN-CH-16): "Vi as fotos do serviço" ou "Conferi pessoalmente".'
      enum:
      - vi_as_fotos
      - conferi_pessoalmente
    EmpresaManutencaoSindico:
      type: object
      required:
      - id
      - nome
      - servico
      - telefone
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        nome:
          type: string
        servico:
          type: string
        telefone:
          type: string
    ChamadoResumoSindico:
      type: object
      required:
      - id
      - tipo
      - categoria
      - local
      - urgencia
      - estado
      - aberto_em
      - fora_do_prazo
      - autor_nome
      - unidade_identificacao
      - empresa_atual
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        tipo:
          type: string
          enum:
          - limpeza
          - manutencao
        categoria:
          type: string
        local:
          type: string
        urgencia:
          $ref: '#/components/schemas/UrgenciaChamadoSindico'
        estado:
          $ref: ./componentes/enums.yaml#/components/schemas/EstadoChamado
        aberto_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        fora_do_prazo:
          type: boolean
          description: Chamado fora do prazo de RN-CH-06, em destaque para o síndico.
        autor_nome:
          type: string
        unidade_identificacao:
          type:
          - string
          - 'null'
        empresa_atual:
          oneOf:
          - $ref: '#/components/schemas/EmpresaManutencaoSindico'
          - type: 'null'
    AvaliacaoChamadoSindico:
      type: object
      required:
      - nota
      - base
      - comentario
      - avaliada_em
      properties:
        nota:
          type: integer
          minimum: 1
          maximum: 5
        base:
          $ref: '#/components/schemas/BaseAvaliacaoSindico'
        comentario:
          type:
          - string
          - 'null'
        avaliada_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
    ChamadoSindico:
      type: object
      required:
      - id
      - tipo
      - categoria
      - local
      - urgencia
      - estado
      - aberto_em
      - fora_do_prazo
      - autor_nome
      - unidade_identificacao
      - empresa_atual
      - descricao
      - fotos_abertura_arquivo_ids
      - historico
      - conclusao
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        tipo:
          type: string
          enum:
          - limpeza
          - manutencao
        categoria:
          type: string
        local:
          type: string
        urgencia:
          $ref: '#/components/schemas/UrgenciaChamadoSindico'
        estado:
          $ref: ./componentes/enums.yaml#/components/schemas/EstadoChamado
        aberto_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        fora_do_prazo:
          type: boolean
          description: Chamado fora do prazo de RN-CH-06, em destaque para o síndico.
        autor_nome:
          type: string
        unidade_identificacao:
          type:
          - string
          - 'null'
        empresa_atual:
