  /v1/sindico/reclamacoes:
    get:
      operationId: sindicoListarReclamacoes
      summary: Lista as reclamações que você pode consultar como julgador
      description: 'Painel do julgador com identidade do reclamante e semáforo de prazo (RF-RS-03, RF-RS-16); reclamação
        contra você ou sua unidade nunca aparece (RN-RC-11, RN-RC-14). **Escopo por papel (matriz do PRD 3, tabela
        5.1):** "consultar todas, exceto contra si" é diferente de "julgar": o síndico (morador ou profissional)
        consulta todas as reclamações, exceto as contra si, mas só decide as que a tabela 5.1 lhe dá; o síndico
        profissional não tem unidade (RN-CD-11), então só pode ser alvo como pessoa; o síndico julga reclamação
        contra o subsíndico ou a unidade dele só com o síndico presente (com a substituição ativa, o julgador é
        a administradora). **Subsíndico:** fora da substituição vê e julga só as reclamações contra o síndico (RN-CD-27);
        em substituição consulta todas, exceto contra si, e julga as da tabela 5.1 (RN-CD-28). Fora desse escopo
        a resposta é `403`. O score do reclamante e do alvo não vem neste DTO: o julgador o consulta no endpoint
        único `GET /v1/score` de `comum.yaml` com `escopo=reclamacao` (RF-RS-03, ADR-010, RN-SC-02); o painel faz
        chamadas adicionais a `/v1/score`, e devolver em lote é ponto a avaliar. O score é referência, não decide
        sozinho (RN-SC-11). `ordenar=score_reclamante` e `score_alvo` ordenam por um valor que este DTO não mostra
        (o valor vem de `/v1/score`).'
      tags:
      - convivencia
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: ./componentes/comum.yaml#/components/parameters/Limite
      - $ref: ./componentes/comum.yaml#/components/parameters/Cursor
      - $ref: '#/components/parameters/EstadoReclamacaoFiltroSindico'
      - $ref: '#/components/parameters/AlvoReclamacaoFiltroSindico'
      - $ref: '#/components/parameters/SemaforoFiltroSindico'
      - $ref: '#/components/parameters/ALulgarFiltroSindico'
      - name: de
        in: query
        required: false
        description: Abertas a partir desta data, inclusive (aaaa-mm-dd).
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
      - name: ate
        in: query
        required: false
        description: Abertas até esta data, inclusive (aaaa-mm-dd).
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
      - name: ordenar
        in: query
        required: false
        description: Ordenação por data ou por score (RF-RS-03). Padrão `aberta_em`. Os campos de score ordenam
          por valor que o DTO não mostra.
        schema:
          type: string
          enum:
          - aberta_em
          - -aberta_em
          - score_reclamante
          - -score_reclamante
          - score_alvo
          - -score_alvo
          default: aberta_em
      responses:
