                enum:
                - energia
                - agua_e_esgoto
                - gas
                - servicos_terceirizados
                - folha_de_funcionarios
                - manutencao_e_obras
                - seguros
                - administracao
                - outros
                - taxa_condominial
                - cobrancas_extras
                - multas_e_juros_por_atraso
                - multas_por_infracao
                - aluguel_de_areas
                - outras_receitas
            tipo:
              type: string
              enum:
              - receita
              - despesa
            busca:
              type: string
    ExportacaoFinanceiraAdministradora:
      type: object
      required:
      - id
      - formato
      - estado
      - solicitada_em
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        formato:
          type: string
          enum:
          - csv
          - pdf
        estado:
          type: string
          description: 'Estado da exportação (valores: lacuna).'
          examples:
          - concluida
        solicitada_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        concluida_em:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          - type: 'null'
        arquivo_id:
          allOf:
          - oneOf:
            - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
            - type: 'null'
          description: Leitura por URL assinado em `/v1/arquivos/*`.
    ComentarioFinanceiroAdministradora:
      type: object
      required:
      - id
      - autor
      - texto
      - criado_em
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        mes:
          oneOf:
          - type: string
            pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
            description: Competência no formato aaaa-mm.
            examples:
            - 2026-11
          - type: 'null'
        lancamento_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
        autor:
          type: object
          required:
          - nome
          - papel
          properties:
            nome:
              type: string
              examples:
              - Marta Rocha
            papel:
              type: string
              examples:
              - sindico
        texto:
          type: string
          examples:
          - Podemos detalhar esta despesa?
        criado_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
    ReclamacaoAdministradora:
      type: object
      required:
      - id
      - categoria
      - descricao
      - data_ocorrencia
      - estado
      - aberta_em
      - alvo
      - autor_condominio
      - administradora_e_julgadora
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        categoria:
          type: object
          required:
          - nome
          - gravidade_inicial
          properties:
            nome:
              type: string
              examples:
              - Barulho
            gravidade_inicial:
              type: string
              enum:
              - leve
              - media
              - grave
              examples:
              - leve
        descricao:
          type: string
          examples:
          - Música alta depois das 22h.
        data_ocorrencia:
          $ref: ./componentes/comum.yaml#/components/schemas/Data
        estado:
          $ref: ./componentes/enums.yaml#/components/schemas/EstadoReclamacao
        aberta_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        alvo:
          type: object
          required:
          - tipo
          - nome
          - score
          properties:
            tipo:
              type: string
              enum:
              - unidade
              - funcionario
              - sindico
              - subsindico
              examples:
              - unidade
            nome:
              type: string
              examples:
              - Apto 203 (Beatriz Moura)
            score:
              type: integer
              minimum: 0
              maximum: 100
              description: Score de 0 a 100, referência para o julgador; nunca decide sozinho (RN-SC-11). Apresentar sem verde/vermelho.
              examples:
              - 85
        reclamante:
          allOf:
          - oneOf:
            - type: object
              required:
              - nome
              - unidade_identificacao
              - score
              properties:
                nome:
                  type: string
                  examples:
                  - Pedro Nunes
                unidade_identificacao:
                  type: string
                  examples:
                  - Apto 101
                score:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: Score de 0 a 100, referência para o julgador; nunca decide sozinho (RN-SC-11). Apresentar sem verde/vermelho.
                  examples:
                  - 85
            - type: 'null'
          description: Identidade e score do reclamante, visíveis à administradora (RN-RC-08, RN-SC-02). Nulo quando o autor é o condomínio (RN-RC-12).
        autor_condominio:
          type: boolean
          description: Verdadeiro em reclamação por dano de vistoria (RN-RC-12).
          examples:
          - false
        administradora_e_julgadora:
          type: boolean
          description: Verdadeiro quando a tabela 5.1 atribui o julgamento à administradora (RN-RC-03).
          examples:
          - false
        semaforo:
          allOf:
          - oneOf:
            - type: object
              required:
              - situacao
              - texto
              properties:
                situacao:
                  type: string
                  enum:
                  - no_prazo
                  - prazo_se_esgotando
                  - prazo_esgotado
                  examples:
                  - no_prazo
                texto:
                  type: string
                  examples:
                  - No prazo
            - type: 'null'
          description: Só em Aberta e Em conversa com o alvo; é informação, não bloqueia a decisão (RN-RC-17 a RN-RC-19).
    ReclamacaoDetalheAdministradora:
      allOf:
      - $ref: '#/components/schemas/ReclamacaoAdministradora'
      - type: object
        properties:
          conversa:
            type: array
            items:
              type: object
              required:
              - autor
              - texto
              - enviada_em
              properties:
                autor:
                  type: string
                  examples:
                  - Administradora
                texto:
                  type: string
                  examples:
                  - Recebemos uma reclamação sobre ruído. Pode nos contar o que houve?
                enviada_em:
                  $ref: ./componentes/comum.yaml#/components/schemas/DataHora
            description: Conversa com o alvo, um comunicado individual vinculado (RN-CO-04).
          alvo_respondeu:
            type: boolean
            description: A decisão é liberada com a resposta do alvo ou após o prazo sem resposta (RN-RC-04).
            examples:
            - false
          decisao:
            oneOf:
            - type: object
              required:
              - resultado
              - decidida_em
              properties:
                resultado:
                  type: string
                  enum:
                  - validada
                  - negada
                motivo_negativa:
                  type:
                  - string
                  - 'null'
                gravidade_final:
                  type:
                  - string
                  - 'null'
                  enum:
                  - leve
                  - media
                  - grave
                  - null
                justificativa:
                  type:
                  - string
                  - 'null'
                decidida_em:
                  $ref: ./componentes/comum.yaml#/components/schemas/DataHora
                pontos_aplicados:
                  type: integer
                  examples:
                  - 5
            - type: 'null'
    IniciarConversaEntradaAdministradora:
      type: object
      required:
      - texto
      properties:
        texto:
          type: string
          description: Primeira mensagem ao alvo. Não revela quem reclamou (RN-RC-10).
          examples:
          - Recebemos uma reclamação sobre ruído. Pode nos contar o que houve?
    ConversaReclamacaoAdministradora:
      type: object
      required:
      - comunicado_id
      - reclamacao_id
      - estado_reclamacao
      - enviada_em
      properties:
        comunicado_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        reclamacao_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        estado_reclamacao:
          $ref: ./componentes/enums.yaml#/components/schemas/EstadoReclamacao
        enviada_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
    DecidirReclamacaoEntradaAdministradora:
      type: object
      required:
      - resultado
      properties:
        resultado:
          type: string
          enum:
          - validar
          - negar
          description: Valida ou nega (RF-RS-06).
          examples:
          - negar
        motivo_negativa:
          type:
          - string
          - 'null'
          description: Obrigatório ao negar; a lista de motivos é lacuna (RN-RC-05).
          examples:
          - Fatos não confirmados
        gravidade_final:
          type:
          - string
          - 'null'
          enum:
          - leve
          - media
          - grave
          - null
          description: Só ao validar, para mudar a gravidade padrão, com justificativa (RN-RC-09).
        justificativa:
          type:
          - string
          - 'null'
          description: Obrigatória em motivo com penalidade e na mudança de gravidade (RN-RC-05, RN-RC-09).
    DecisaoReclamacaoAdministradora:
      type: object
      required:
      - reclamacao_id
      - estado
      - resultado
      - decidida_em
      properties:
        reclamacao_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        estado:
          $ref: ./componentes/enums.yaml#/components/schemas/EstadoReclamacao
        resultado:
          type: string
          enum:
          - validar
          - negar
        decidida_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        pontos_aplicados:
          type: integer
          description: Pontos efetivos aplicados ao afetado (RN-SC-03).
          examples:
          - 0
        prazo_recurso_ate:
          allOf:
          - oneOf:
            - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
            - type: 'null'
          description: Até 7 dias da decisão, só para quem perdeu pontos (RN-RC-07).
    AvaliacaoAtendimentoAgregadoAdministradora:
      type: object
      description: Agregado por funcionário de limpeza ou por empresa de manutenção, só para leitura da administradora. Sem comentário, sem chamado e sem identificar quem avaliou (RN-CH-19).
      required:
      - atendente_id
      - atendente_nome
      - media
      - quantidade
      - distribuicao
      properties:
        atendente_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        atendente_nome:
          type: string
        media:
          type:
          - number
          - 'null'
          minimum: 1
          maximum: 5
          description: Nula com menos de 3 avaliações (RN-CH-20).
        quantidade:
          type: integer
          minimum: 0
        distribuicao:
          type:
          - array
          - 'null'
          description: Quantidade por número de estrelas (RF-CH-10). Nula com menos de 3 avaliações (Proposta; RN-CH-20 fala da média).
          items:
            type: object
            required:
            - estrelas
            - quantidade
            properties:
              estrelas:
                type: integer
                minimum: 1
                maximum: 5
              quantidade:
                type: integer
                minimum: 0
x-lacunas:
- 'Lista dos condomínios que a administradora atende (painel com vários condomínios): só há a arquitetura 4.4, sem ID de produto; fica sem operação aqui.'
- 'Situação de ocupação da unidade: o DER não lista os códigos; "alugada" e "desocupada" vêm de RN-CD-20 e RN-CD-24, o código do proprietário residente é Proposta.'
- 'Formato da planilha de pré-cadastro e limite de linhas: lacuna; o cliente envia os itens já lidos.'
- 'Dados bancários: o MER/DER só registra `dados_bancarios_protegidos`; os campos exatos são lacuna.'
- 'Verificação (KYC) da subconta no Asaas e motivo de recusa da conta: lacuna (ADR-002). Como o titular pessoa física que não é o usuário logado aceita o termo (SEG-15): lacuna.'
- 'Estados de devolução, de divergência de conciliação e de exportação financeira: o MER/DER não os lista; aparecem como texto.'
- 'Valor da cobrança extra: o MER/DER guarda `valor_centavos` no lote; se é por unidade ou total a ratear é lacuna.'
- 'Lista completa de finalidades de cobrança extra além de rateio, fundo de reserva, obras e multa por infração: lacuna (RN-FI-20).'
- 'Categoria avulsa de "Fundo de reserva" com cobrança desligada: a RN-FI-24 a cita e a lista de categorias da RN-FI-32 não tem essa categoria, por isso não há código para ela (pergunta ao Pedro). "Taxa condominial" avulsa usa `taxa_condominial`.'
- 'Lista de motivos de negativa de reclamação: lacuna (RF-RS-06 cita lista, sem conteúdo nas fontes).'
- 'Cancelamento de reserva pelo condomínio (RN-CA-05): as fontes não dizem quem faz; sem operação aqui.'
- 'Comunicados gerais e individuais: a matriz não dá envio à administradora; só a conversa com o alvo da reclamação (RN-CO-04) e a publicação do regimento.'
- 'Limites de taxa, tempo de guarda da `Idempotency-Key` e política de versão mínima do app: lacunas do guia.'
- 'Código `RECEITA_AVULSA_COM_COBRANCA_ATIVA` (receita avulsa fora de `outras_receitas` com o módulo de cobrança ligado): Proposta, as fontes só dizem que a regra vale com o módulo desligado (RN-FI-24).'
- 'Avaliações de atendimento agregadas (RF-CH-10): as fontes não dizem se a distribuição por estrelas também se esconde com menos de 3 avaliações (RN-CH-20 cita a média); aqui ela fica nula, como Proposta. Os caminhos `/v1/administradora/avaliacoes-atendimento/*` são Proposta.'
