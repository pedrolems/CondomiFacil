    post:
      operationId: moradorAvaliarAtendimento
      summary: Avalia o atendimento de um chamado concluído
      description: Quem abriu (morador, síndico morador, subsíndico) avalia a conclusão efetiva até 7 dias depois; uma avaliação por conclusão, definitiva (RN-CH-15, RN-CH-16, RN-CH-17). Avaliação de 1 ou 2 estrelas oferece reabrir (até 48h, `POST .../reaberturas`) ou abrir novo chamado, sem reabrir sozinha (RN-CH-18). Não altera score de ninguém (RN-CH-21). A resposta nunca identifica o funcionário.
      tags:
      - chamados
      security:
      - bearerJwt: []
      parameters:
