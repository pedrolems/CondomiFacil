        hash_conteudo:
          type:
          - string
          - 'null'
        criado_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
    LeituraArquivoComum:
      type: object
      required:
      - arquivo_id
      - url_leitura
      - expira_em
      properties:
        arquivo_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        url_leitura:
