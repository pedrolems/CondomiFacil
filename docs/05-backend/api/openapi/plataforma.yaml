      - id
      - competencia
      - ciclo_inicio
      - ciclo_fim
      - unidades_apuradas
      - total_centavos
      - estado
      - itens
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        competencia:
          type: string
