      - chamados
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: '#/components/parameters/ChamadoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AjustarUrgenciaChamadoSindico'
            example:
              urgencia: alta
      responses:
        '200':
          description: Chamado com a urgência ajustada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChamadoSindico'
              example:
                id: 00000001-1111-4222-8333-000000000001
                tipo: manutencao
                categoria: Elevador
                local: Elevador social, bloco B
                urgencia: alta
                estado: aberto
                aberto_em: '2026-11-09T08:15:00-03:00'
                fora_do_prazo: false
                autor_nome: Marina Teixeira
                unidade_identificacao: Bloco B, 302
                empresa_atual: null
                descricao: O elevador social parou entre andares e voltou a funcionar sozinho.
                fotos_abertura_arquivo_ids:
                - 00000046-1111-4222-8333-000000000046
                historico:
                - tipo: urgencia_ajustada
                  registrado_em: '2026-11-09T09:00:00-03:00'
                  autor_nome: Carlos Menezes
                  urgencia_anterior: media
                  urgencia_nova: alta
                  estado_anterior: null
                  estado_novo: null
                conclusao: null
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: '#/components/responses/Erro403ForaDaSubstituicao'
        '404':
          $ref: ./componentes/comum.yaml#/components/responses/Erro404
        '422':
          $ref: '#/components/responses/Erro422UrgenciaChamado'
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-CH-07
      - RN-CH-11
      - RN-CH-12
      - RN-CD-28
      - US-CH-03
  /v1/sindico/chamados/{chamado_id}/empresa:
