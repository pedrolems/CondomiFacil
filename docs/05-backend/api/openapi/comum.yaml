      - RF-RS-09
      - RN-RC-07
      - RN-RC-14
      - RN-CD-12
      - RN-CD-28
      - RN-SC-12
      - US-RS-05
  /v1/denuncias:
    post:
      operationId: comumDenunciarConteudo
      summary: Denuncia um conteúdo ofensivo
      description: Qualquer usuário do condomínio pode denunciar um conteúdo a que tem acesso (RF-RS-14, RN-RC-13), pelo menu "Denunciar" de qualquer texto (UF 9.4). A denúncia vai ao síndico; se o conteúdo foi escrito pelo síndico, vai a quem julgaria uma reclamação contra ele (RN-RC-13, tabela 5.1). O destinatário é decidido pelo servidor e não aparece na resposta, nem quem escreveu o conteúdo. O conteúdo precisa ser de um tipo denunciável e estar acessível ao denunciante; de outro condomínio ou fora do alcance responde `404`. A resposta nunca devolve autor do conteúdo, destinatário nem estado. O que o destinatário pode fazer com a denúncia e o que ele vê do conteúdo denunciado não estão definidos nos docs (lacuna).
      tags:
      - convivencia
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarDenunciaComum'
            example:
              origem:
                tipo: mensagem_comunicado
                id: 3f6c1a52-8b1e-4d3a-9a0e-5c1d2b7e9f10
              motivo: Texto ofensivo em resposta a comunicado.
      responses:
        '201':
          description: Denúncia registrada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DenunciaComum'
              example:
                id: d1a2b3c4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                origem:
                  tipo: mensagem_comunicado
                  id: 3f6c1a52-8b1e-4d3a-9a0e-5c1d2b7e9f10
                motivo: Texto ofensivo em resposta a comunicado.
                criada_em: '2026-11-10T14:30:00-03:00'
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '404':
          $ref: ./componentes/comum.yaml#/components/responses/Erro404
        '422':
          description: Conteúdo de tipo válido que não pode ser denunciado por este usuário ou neste estado.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                naoDenunciavel:
                  summary: Conteúdo não denunciável pelo usuário (código e texto Proposta)
                  value:
                    codigo: CONTEUDO_NAO_DENUNCIAVEL
                    mensagem: Este conteúdo não pode ser denunciado.
                    detalhes:
                    - campo: origem.id
                      mensagem: Conteúdo não denunciável.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-RS-14
      - RN-RC-13
      - US-RS-07
  /v1/notas-dos-setores:
    get:
      operationId: comumConsultarNotasDosSetores
      summary: Consulta a nota de cada setor
      description: 'Nota do setor = média das médias dos funcionários avaliados, publicada só com 2 ou mais avaliados no mês (RN-PE-07, RN-PE-08, RF-PE-04); abaixo disso a nota não é publicada e vem o rótulo. Aberta a todos os perfis do condomínio. Notas individuais ficam só com o próprio funcionário (RN-PE-09). Rota única para todos os perfis do condomínio. O score do síndico, também aberto a todos (matriz do PRD 3; RF-RS-12, RN-SC-02), não é daqui: vem de `GET /v1/score` com `escopo=sindico` (`comumObterScore`).'
      tags:
      - convivencia
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - name: competencia
        in: query
        required: false
        description: '**Proposta.** Mês no formato aaaa-mm; padrão: último mês fechado. Mês futuro ou ainda não fechado: comportamento é lacuna.'
        schema:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      responses:
        '200':
          description: Notas dos setores.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotasSetoresComum'
              example:
                competencia: 2026-10
                setores:
                - setor: Limpeza
                  publicada: true
                  nota: 3.7
                  rotulo: null
                - setor: Portaria
                  publicada: false
                  nota: null
                  rotulo: 'Nota não publicada este mês: poucas avaliações.'
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-PE-03
      - RF-PE-04
      - RN-PE-07
      - RN-PE-08
      - RN-PE-09
      - RF-RS-12
      - RN-SC-02
      - US-PE-02
      - US-RS-07
components:
  securitySchemes:
    bearerJwt:
      $ref: ./componentes/comum.yaml#/components/securitySchemes/bearerJwt
  schemas:
    DispositivoInfoComum:
      type: object
      description: Aparelho que abre a sessão; a sessão fica ligada a ele (ADR-007).
      required:
      - identificador_instalacao
      - plataforma
      properties:
        identificador_instalacao:
          type: string
          description: Identificador da instalação do app no aparelho (Proposta).
          examples:
          - inst-8f3a2c1d-aparelho-exemplo
        plataforma:
          type: string
          enum:
          - android
          - ios
          - web
          description: Plataforma do cliente (Proposta; a web aparece em RF-AC-06).
    PedirCodigoComum:
      type: object
      required:
      - email
      - finalidade
      properties:
        email:
          type: string
          format: email
          examples:
          - ana.exemplo@example.com
        finalidade:
          type: string
          enum:
          - primeiro_acesso
          - recuperacao_senha
          description: Finalidade do desafio de acesso (MER `desafio_acesso.finalidade`; valores Proposta).
    RespostaCodigoComum:
      type: object
      required:
      - mensagem
      - pode_pedir_novo_codigo_em
      properties:
        mensagem:
          type: string
          description: Mensagem única, igual para e-mail cadastrado ou não (RN-CD-02).
        pode_pedir_novo_codigo_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          description: Instante em que um novo código pode ser pedido (60 s depois). Calculado igual para qualquer e-mail.
    AtivarComum:
      type: object
      required:
      - email
      - codigo
      - nova_senha
      - dispositivo
      properties:
        email:
          type: string
          format: email
        codigo:
          type: string
          pattern: ^[0-9]{6}$
          description: Código de 6 dígitos (RN-CD-02).
          examples:
          - '483920'
        nova_senha:
          type: string
          minLength: 8
          writeOnly: true
          description: Senha com no mínimo 8 caracteres (RF-AC-01). Nunca é devolvida.
        dispositivo:
          $ref: '#/components/schemas/DispositivoInfoComum'
    RedefinirSenhaComum:
      type: object
      required:
      - email
      - codigo
      - nova_senha
      - dispositivo
      properties:
        email:
          type: string
          format: email
        codigo:
          type: string
          pattern: ^[0-9]{6}$
          examples:
          - '102938'
        nova_senha:
          type: string
          minLength: 8
          writeOnly: true
        dispositivo:
          $ref: '#/components/schemas/DispositivoInfoComum'
    EntrarComum:
      type: object
      required:
      - email
      - senha
      - dispositivo
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          writeOnly: true
        dispositivo:
          $ref: '#/components/schemas/DispositivoInfoComum'
    RenovarComum:
      type: object
      properties:
        refresh_token:
          type: string
          description: Refresh token opaco. Obrigatório no app; na web vem do cookie `httpOnly` e o campo é omitido.
    SairComum:
      type: object
      properties:
        dispositivo_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          description: Aparelho cujo token de push deve ser removido junto com a sessão (opcional).
    SessaoAbertaComum:
      type: object
      required:
      - token_acesso
      - token_acesso_expira_em
      - aceites_pendentes
      properties:
        token_acesso:
          type: string
          description: JWT de 15 minutos, só com `sub` e `sid`, sem papéis nem condomínios (ADR-007, Proposta).
        token_acesso_expira_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        refresh_token:
          type:
          - string
          - 'null'
          description: 'Opaco e rotativo. Nulo na web: nesse caso vai no cookie `httpOnly`.'
        aceites_pendentes:
          type: boolean
          description: Verdadeiro se há documento a aceitar antes de usar o app (RN-CD-03); ver `GET /v1/acesso/aceites`.
    DocumentoPendenteComum:
      type: object
      required:
      - documento_versao_id
      - documento_id
      - tipo
      - titulo
      - numero
      - vigente_desde
      properties:
        documento_versao_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        documento_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        tipo:
          type: string
          description: 'Tipo do documento: termos de uso, política de privacidade, regimento do condomínio e "Como funciona" (RN-CD-03). Os códigos exatos são Proposta.'
          examples:
          - termos_de_uso
          - politica_de_privacidade
          - regimento
          - como_funciona
        titulo:
          type: string
        numero:
          type: integer
          description: Número da versão (MER `documento_versao.numero`).
        condominio_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Nulo nos documentos globais; preenchido no regimento do condomínio.
        publicado_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        vigente_desde:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        conteudo_texto:
          type:
          - string
          - 'null'
          description: Texto da versão; exatamente um entre `conteudo_texto` e `arquivo_id` (MER).
        arquivo_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Arquivo da versão, lido por `POST /v1/arquivos/{arquivo_id}/leituras`.
    RegistrarAceitesComum:
      type: object
      required:
      - documento_versao_ids
      properties:
        documento_versao_ids:
          type: array
          minItems: 1
          items:
            $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          description: Versões vigentes que o usuário aceita agora.
    AceitesRegistradosComum:
      type: object
      required:
      - aceitos
      - pendentes_restantes
      properties:
        aceitos:
          type: array
          items:
            type: object
            required:
            - documento_versao_id
            - aceito_em
            properties:
              documento_versao_id:
                $ref: ./componentes/comum.yaml#/components/schemas/Uuid
              aceito_em:
                $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        pendentes_restantes:
          type: integer
          minimum: 0
    TemaComum:
      type: string
      enum:
      - aparelho
      - claro
      - escuro
      description: '"Igual ao aparelho" (`aparelho`, padrão), "Claro" (`claro`) e "Escuro" (`escuro`) (RF-AC-05). Códigos Proposta.'
    PerfilComum:
      type: object
      required:
      - id
      - nome
      - email
      - tema_preferido
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        nome:
          type: string
        email:
          type: string
          format: email
        tema_preferido:
          $ref: '#/components/schemas/TemaComum'
    AtualizarPerfilComum:
      type: object
      required:
      - tema_preferido
      properties:
        tema_preferido:
          $ref: '#/components/schemas/TemaComum'
    PapelEfetivoComum:
      type: object
      required:
      - papel
      - interface
      properties:
        papel:
          type: string
          enum:
          - morador
          - proprietario_nao_residente
          - sindico
          - subsindico
          - conselho_fiscal
          - portaria
          - limpeza
          - administradora
          - suporte
          - admin_plataforma
          description: Papel efetivo hoje naquele condomínio (Proposta de nomenclatura; perfis do PRD 3). Síndico morador e profissional se distinguem em `funcao_mandato`.
        interface:
          type: string
          enum:
          - morador
          - proprietario-nao-residente
          - sindico
          - conselho-fiscal
          - portaria
          - limpeza
          - administradora
          - plataforma
          description: Prefixo de caminho que o cliente usa para este papel (`/v1/<interface>/...`; guia, seção 4).
        funcao_mandato:
          type:
          - string
          - 'null'
          description: Função do mandato vigente, quando houver (MER `mandato.funcao`).
        em_substituicao:
          type:
          - boolean
          - 'null'
          description: 'Para o subsíndico: verdadeiro durante a substituição do síndico (RN-CD-12, RN-CD-28).'
    UnidadeContextoComum:
      type: object
      required:
      - unidade_id
      - identificacao
      - tipo_vinculo
      properties:
        unidade_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        identificacao:
          type: string
        bloco_nome:
          type:
          - string
          - 'null'
        tipo_vinculo:
          type: string
          enum:
          - proprietario_representante
          - inquilino
          - dependente
          description: MER `vinculo_unidade.tipo` (códigos Proposta).
        morador_habilitado:
          type: boolean
          description: Verdadeiro se é o morador habilitado da unidade (RN-CD-04).
    ContextoComum:
      type: object
      description: Um condomínio onde o usuário tem vínculo vigente, com papéis e unidades.
      required:
      - condominio_id
      - condominio_nome
      - vinculo_condominio_id
      - papeis
      - unidades
      properties:
        condominio_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        condominio_nome:
          type: string
        vinculo_condominio_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        papeis:
          type: array
          items:
            $ref: '#/components/schemas/PapelEfetivoComum'
        unidades:
          type: array
          items:
            $ref: '#/components/schemas/UnidadeContextoComum'
          description: Vazia para quem não tem unidade (funcionário, síndico profissional, administradora).
    SessaoComum:
      type: object
      required:
      - id
      - expira_em
      - atual
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        dispositivo_identificador:
          type:
          - string
          - 'null'
        expira_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        atual:
          type: boolean
          description: Verdadeiro para a sessão que fez esta chamada.
    RegistrarDispositivoComum:
      type: object
      required:
      - identificador_instalacao
      - plataforma
      - token_push
      properties:
        identificador_instalacao:
          type: string
        plataforma:
          type: string
          enum:
          - android
          - ios
          description: Push só no app (Expo Push e FCM); a web não registra token (Proposta).
        token_push:
          type: string
          writeOnly: true
          description: Token do Expo Push. Guardado protegido; nunca devolvido.
    DispositivoComum:
      type: object
      required:
      - id
      - identificador_instalacao
      - plataforma
      - ultima_atividade
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        identificador_instalacao:
          type: string
        plataforma:
          type: string
          enum:
          - android
          - ios
        ultima_atividade:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
    TipoNotificacaoComum:
      type: string
      enum:
      - visitante
      - encomenda
      - reserva
      - lembrete_reserva
      - chamado
      - comunicado
      - votacao
      - reclamacao
      - decisao_reclamacao
      - divergencia_sincronizacao
      description: Os sete tipos de RF-NO-01 (visitante, encomenda, reserva, chamado, comunicado, votação, reclamação), o lembrete de reserva (RN-RE-14, opcional) e os dois obrigatórios (`decisao_reclamacao` e `divergencia_sincronizacao`, US-NO-01). Códigos Proposta.
    PreferenciaNotificacaoComum:
      type: object
      required:
      - tipo
      - habilitada
      - obrigatoria
      properties:
        tipo:
          $ref: '#/components/schemas/TipoNotificacaoComum'
        habilitada:
          type: boolean
        obrigatoria:
          type: boolean
          description: Verdadeiro nos tipos que não podem ser desligados (US-NO-01). A lista é fixa em código no servidor.
        motivo_obrigatoria:
          type:
          - string
          - 'null'
          description: Texto do motivo exibido no interruptor travado (UF 14.1; texto Proposta).
    PreferenciasNotificacaoComum:
      type: object
      required:
      - preferencias
      properties:
        preferencias:
          type: array
          items:
            $ref: '#/components/schemas/PreferenciaNotificacaoComum'
          description: Lista completa e fixa de tipos; não é paginada.
    AtualizarPreferenciasNotificacaoComum:
      type: object
      required:
      - condominio_id
      - preferencias
      properties:
        condominio_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        preferencias:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - tipo
            - habilitada
            properties:
              tipo:
                $ref: '#/components/schemas/TipoNotificacaoComum'
              habilitada:
                type: boolean
    NotificacaoComum:
      type: object
      required:
      - id
      - condominio_id
      - tipo
      - texto_seguro
      - criada_em
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        condominio_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        tipo:
          $ref: '#/components/schemas/TipoNotificacaoComum'
        texto_seguro:
          type: string
          description: Texto sem dados sensíveis (arquitetura 3.7). Nunca traz situação financeira nem quem reclamou.
        criada_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        lida_em:
          type:
          - string
          - 'null'
          format: date-time
        referencia:
          type:
          - object
          - 'null'
          description: Referência de navegação; não concede autorização (MER `referencia_restrita`).
          properties:
            entidade:
              type: string
            id:
              $ref: ./componentes/comum.yaml#/components/schemas/Uuid
    CriarPedidoLgpdComum:
      type: object
      required:
      - tipo
      properties:
        tipo:
          type: string
          enum:
          - copia_dados
          - exclusao_conta
          description: Valores Proposta (MER `pedido_lgpd.tipo`).
        senha:
          type: string
          writeOnly: true
          description: 'Obrigatória em `exclusao_conta`: confirmação com a senha (UF 14.1).'
    PedidoLgpdComum:
      type: object
      required:
      - id
      - tipo
      - estado
      - solicitado_em
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        tipo:
          type: string
          enum:
          - copia_dados
          - exclusao_conta
        estado:
          type: string
          description: 'Estado do pedido (MER `pedido_lgpd.estado`). Os valores não estão definidos nos docs: lacuna.'
          examples:
          - solicitado
        solicitado_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        concluido_em:
          type:
          - string
          - 'null'
          format: date-time
        prazo_envio_ate:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Na cópia: limite de 15 dias para o envio por e-mail (RF-LG-01).'
        administradora_avisada:
          type:
          - boolean
          - 'null'
          description: 'Na exclusão: verdadeiro se a pessoa era morador habilitado, proprietário ou responsável financeiro e a administradora foi avisada (RN-CD-18).'
    ModuloArquivoComum:
      type: string
      enum:
      - etiqueta_encomenda
      - foto_chamado
      - foto_conclusao_chamado
      - checklist_vistoria
      - comprovante_lancamento
      - ata_reuniao
      - lista_presenca
      - comprovante_pagamento
      - foto_area
      - documento_visitante
      description: Usos de arquivo da arquitetura 3.8 (etiqueta de encomenda, foto de chamado, fotos de conclusão, checklist de vistoria RF-RE-08, comprovante de lançamento RN-FI-24, ata e lista de presença RF-VO-09, comprovante de pagamento externo RF-FI-10, fotos de áreas) mais o documento do visitante. Códigos Proposta.
    PedirEnvioArquivoComum:
      type: object
      required:
      - modulo
      - tipo_midia
      - tamanho_bytes
      properties:
        modulo:
          $ref: '#/components/schemas/ModuloArquivoComum'
        tipo_midia:
          type: string
          description: Tipo de mídia declarado; a API valida pelo conteúdo na confirmação. A lista de tipos aceitos é lacuna.
          examples:
          - application/pdf
          - image/jpeg
        tamanho_bytes:
          type: integer
          minimum: 1
        hash_conteudo:
          type:
          - string
          - 'null'
          description: 'Hash do conteúdo, conferido na confirmação. Formato do hash: lacuna.'
        alvo:
          type:
          - object
          - 'null'
          description: Objeto ao qual o arquivo será anexado, para a API autorizar a ação (MER `anexo_dominio`). Os demais usos ligam o arquivo pela operação de domínio.
          required:
          - tipo
          - id
          properties:
            tipo:
              type: string
              enum:
              - reserva
              - vistoria
              - reclamacao
              - chamado
            id:
              $ref: ./componentes/comum.yaml#/components/schemas/Uuid
    EnvioArquivoComum:
      type: object
