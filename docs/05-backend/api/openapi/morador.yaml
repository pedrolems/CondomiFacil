      - pagamentos
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/UnidadeIdObrigatorio
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: ./componentes/comum.yaml#/components/parameters/IdempotencyKey
      - $ref: '#/components/parameters/CobrancaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PagarCobrancaRequisicaoMorador'
            examples:
              boleto:
                summary: Boleto com QR Code Pix
                value:
                  meio: boleto
              pix:
                summary: Pix
                value:
                  meio: pix
              cartao:
                summary: Cartão, em checkout hospedado
                value:
                  meio: cartao
      responses:
        '201':
          description: Dados de pagamento.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DadosDePagamentoMorador'
              examples:
                boleto:
                  summary: Boleto
                  value:
                    id: 9e4d2b71-6a3c-4f58-b0d1-2c7e5a8f3b19
                    meio: boleto
                    valor_centavos: 46050
                    criada_em: '2026-11-12T09:01:00-03:00'
                    linha_digitavel: 23793.38128 60000.000003 00000.000408 1 98760000046050
                    pix_copia_e_cola: 00020126580014br.gov.bcb.pix0136exemplo-chave-fake5204000053039865802BR5909CONDOMINIO6009SAO PAULO62070503***6304ABCD
                    pix_qr_code_base64: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==
                    url_checkout: null
                    expira_em: '2026-11-13T23:59:00-03:00'
                cartao:
                  summary: 'Cartão: abrir `url_checkout`'
                  value:
                    id: 9e4d2b71-6a3c-4f58-b0d1-2c7e5a8f3b19
                    meio: cartao
                    valor_centavos: 46050
                    criada_em: '2026-11-12T09:01:00-03:00'
                    linha_digitavel: null
                    pix_copia_e_cola: null
                    pix_qr_code_base64: null
                    url_checkout: https://sandbox.asaas.com/checkout/exemplo456
                    expira_em: '2026-11-13T23:59:00-03:00'
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          description: Sem vínculo, sem permissão para o papel efetivo ou sem acesso ao dado.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                naoresp:
                  summary: Cobrança emitida a outro responsável (UF 13.1)
                  value:
                    codigo: SEM_PERMISSAO
                    mensagem: Esta área é só para o responsável financeiro.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
                semPermissao:
                  summary: Permissão mudou com o app aberto (texto de UF 15)
                  value:
                    codigo: SEM_PERMISSAO
                    mensagem: Esta área é só para síndico.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '404':
          $ref: ./componentes/comum.yaml#/components/responses/Erro404
        '422':
          description: Regra de negócio violada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                meio:
                  summary: Forma de pagamento não aceita (RN-FI-02)
                  value:
                    codigo: COBRANCA_MEIO_NAO_ACEITO
                    mensagem: Esta forma de pagamento não está ativa neste condomínio.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
                estado:
                  summary: Cobrança já paga ou cancelada
                  value:
                    codigo: COBRANCA_NAO_PAGAVEL
                    mensagem: Esta cobrança não está em aberto.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
                regraDeNegocio:
                  summary: Regra violada, exemplo genérico (texto Proposta)
                  value:
                    codigo: REGRA_DE_NEGOCIO_VIOLADA
                    mensagem: Não foi possível concluir esta ação pelas regras do condomínio.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          description: Serviço indisponível.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
            Retry-After:
              $ref: ./componentes/comum.yaml#/components/headers/RetryAfter
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                gateway:
                  summary: Gateway fora do ar, cobrança vencida (texto de UF 13.1)
                  value:
                    codigo: PAGAMENTO_INDISPONIVEL
                    mensagem: Pagamento indisponível agora. Quando você pagar, o valor será atualizado com multa e juros até o dia do pagamento.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
                gatewayprazo:
                  summary: Gateway fora do ar, cobrança no prazo (texto de UF 13.1)
                  value:
                    codigo: PAGAMENTO_INDISPONIVEL
                    mensagem: Pagamento indisponível agora. Tente de novo mais tarde; o vencimento continua em 10/11/2026.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
                servicoIndisponivel:
                  summary: Serviço indisponível
                  value:
                    codigo: SERVICO_INDISPONIVEL
                    mensagem: Algo deu errado do nosso lado. Tente de novo em alguns minutos.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
      x-rastreabilidade:
      - RF-FI-07
      - RF-FI-08
      - RF-FI-09
      - RN-FI-02
      - RN-FI-08
      - RN-FI-13
      - RN-FI-19
      - SEG-12
      - SEG-17
      - US-FI-03
components:
  securitySchemes:
    bearerJwt:
      $ref: ./componentes/comum.yaml#/components/securitySchemes/bearerJwt
  parameters:
    AreaId:
      name: area_id
      in: path
      required: true
      description: Identificador da área comum.
      schema:
        $ref: ./componentes/comum.yaml#/components/schemas/Uuid
    ReservaId:
      name: reserva_id
      in: path
      required: true
      description: Identificador da reserva.
      schema:
        $ref: ./componentes/comum.yaml#/components/schemas/Uuid
    VisitanteId:
      name: visitante_id
      in: path
      required: true
      description: Identificador da autorização de visita.
      schema:
        $ref: ./componentes/comum.yaml#/components/schemas/Uuid
    ListaId:
      name: lista_id
      in: path
      required: true
      description: Identificador da lista de visitantes.
      schema:
        $ref: ./componentes/comum.yaml#/components/schemas/Uuid
    EntregaId:
      name: entrega_id
      in: path
      required: true
      description: Identificador da entrega esperada.
      schema:
        $ref: ./componentes/comum.yaml#/components/schemas/Uuid
    ChamadoId:
      name: chamado_id
      in: path
      required: true
      description: Identificador do chamado.
      schema:
        $ref: ./componentes/comum.yaml#/components/schemas/Uuid
    ReclamacaoId:
      name: reclamacao_id
      in: path
      required: true
      description: Identificador da reclamação.
      schema:
        $ref: ./componentes/comum.yaml#/components/schemas/Uuid
    FuncionarioId:
      name: funcionario_id
      in: path
      required: true
      description: Identificador do funcionário.
      schema:
        $ref: ./componentes/comum.yaml#/components/schemas/Uuid
    ComunicadoId:
      name: comunicado_id
      in: path
      required: true
      description: Identificador do comunicado.
      schema:
        $ref: ./componentes/comum.yaml#/components/schemas/Uuid
    ReuniaoId:
      name: reuniao_id
      in: path
      required: true
      description: Identificador da reunião.
      schema:
        $ref: ./componentes/comum.yaml#/components/schemas/Uuid
    VotacaoId:
      name: votacao_id
      in: path
      required: true
      description: Identificador da votação.
      schema:
        $ref: ./componentes/comum.yaml#/components/schemas/Uuid
    EleicaoId:
      name: eleicao_id
      in: path
      required: true
      description: Identificador da eleição.
      schema:
        $ref: ./componentes/comum.yaml#/components/schemas/Uuid
    CobrancaId:
      name: cobranca_id
      in: path
      required: true
      description: Identificador da cobrança.
      schema:
        $ref: ./componentes/comum.yaml#/components/schemas/Uuid
  schemas:
    DadosDePagamentoMorador:
      type: object
      description: 'Dados que o cliente usa para concluir o pagamento. Os nomes dos cinco campos de pagamento são fixos. Dados de cartão nunca passam pela API (SEG-12): o cartão é pago no checkout hospedado do Asaas, aberto em `url_checkout`. Os campos que não se aplicam ao meio vêm nulos.'
      required:
      - id
      - meio
      - valor_centavos
      - criada_em
      - expira_em
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        meio:
          type: string
          enum:
          - boleto
          - pix
          - cartao
          description: Boleto vale só para cobrança; reserva aceita Pix e cartão (MER/DER 4.10).
        valor_centavos:
          $ref: ./componentes/comum.yaml#/components/schemas/Centavos
        criada_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        linha_digitavel:
          oneOf:
          - type: string
            description: Linha digitável do boleto.
          - type: 'null'
        pix_copia_e_cola:
          oneOf:
          - type: string
            description: Código Pix copia e cola.
          - type: 'null'
        pix_qr_code_base64:
          oneOf:
          - type: string
            description: Imagem do QR Code Pix em base64.
          - type: 'null'
        url_checkout:
          oneOf:
          - type: string
            description: Endereço do checkout hospedado do Asaas, para pagamento por cartão.
            format: uri
          - type: 'null'
        expira_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
    ComprovanteMorador:
      type: object
      required:
      - tipo
      - arquivo_id
      - emitido_em
      properties:
        tipo:
          type: string
          enum:
          - pagamento
          - reembolso
        arquivo_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        emitido_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
    CondominioMorador:
      type: object
      required:
      - id
      - nome
      - cobranca_ativa
      - meios_cobranca_aceitos
      - blocos
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        nome:
          type: string
        cobranca_ativa:
          type: boolean
          description: Módulo de cobrança ativo (RN-FI-01).
        meios_cobranca_aceitos:
          type: array
          items:
            type: string
            enum:
            - boleto
            - pix
            - cartao
          description: Formas de pagamento aceitas, pelo menos uma quando a cobrança está ativa (RN-FI-02). `boleto` já traz QR Code Pix.
        blocos:
          type: array
          items:
            type: object
            required:
            - id
            - nome
            properties:
              id:
                $ref: ./componentes/comum.yaml#/components/schemas/Uuid
              nome:
                type: string
          description: Vazio em condomínio sem blocos.
    UnidadeMorador:
      type: object
      required:
      - id
      - identificacao
      - situacao_ocupacao
      - meu_vinculo
      - morador_habilitado
      - responsavel_financeiro
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        identificacao:
          type: string
          description: Por exemplo, Apto 101.
        bloco:
          oneOf:
          - type: string
          - type: 'null'
        situacao_ocupacao:
          type: string
          description: 'Situação ocupacional da unidade (não é inadimplência). Valores do MER/DER: lacuna de enumeração.'
        meu_vinculo:
          type: string
          enum:
          - proprietario
          - inquilino
          - dependente
          description: Vínculo do usuário com a unidade ativa (MER/DER 4.2).
        morador_habilitado:
          type: boolean
          description: O usuário é o morador habilitado da unidade (RN-CD-04).
        contrato_fim:
          oneOf:
          - type: string
            description: 'Só para inquilino e dependente: fim vigente do contrato de locação; nulo em prazo indeterminado (RN-CD-20, RN-CD-22).'
            format: date
          - type: 'null'
        responsavel_financeiro:
          type: object
          description: Se o usuário é o responsável financeiro de cada tipo de despesa (RN-FI-03). Não revela quem é o responsável quando não é o usuário.
          required:
          - ordinarias
          - extraordinarias
          properties:
            ordinarias:
              type: boolean
            extraordinarias:
              type: boolean
    AreaComumMorador:
      type: object
      required:
      - id
      - nome
      - tipo_reserva
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        nome:
          type: string
        tipo_reserva:
          type: string
          enum:
          - paga
          - gratuita
          description: Cada área é paga ou gratuita e a reserva herda o tipo (RN-RE-01).
        capacidade:
          oneOf:
          - type: integer
          - type: 'null'
        valor_centavos:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Centavos
          - type: 'null'
        foto_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
        regras:
          type: object
          description: Regras efetivas da área, resolvidas pela herança plataforma, condomínio e área (RF-AD-07). Valores são parâmetros configuráveis (RN 13); os do exemplo são os padrões das regras.
          properties:
            antecedencia_minima_horas:
              type: integer
            antecedencia_maxima_dias:
              type: integer
            limite_reservas_por_mes:
              type: integer
            prazo_reembolso_horas:
              type: integer
            prazo_pagamento_horas:
              type: integer
    IntervaloAreaMorador:
      type: object
      description: Intervalo que não está livre. Tudo o que não aparece está livre. Nunca identifica unidade nem morador (RN-RE-05).
      required:
      - inicio
      - fim
      - estado
      - rotulo
      properties:
        inicio:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        fim:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        estado:
          type: string
          enum:
          - ocupado
          - indisponivel
        rotulo:
          type: string
          description: Texto do estado, para não depender só da cor.
        motivo:
          oneOf:
          - type: string
            enum:
            - score_baixo
            - fora_da_antecedencia
            - limite_mensal_atingido
            - unidade_em_atraso
            - unidade_indisponivel
            - contrato_encerrado
          - type: 'null'
        mensagem:
          oneOf:
          - type: string
            description: Texto de UF 5.1 para o motivo.
          - type: 'null'
    DisponibilidadeAreaMorador:
      type: object
      required:
      - area_id
      - intervalos
      properties:
        area_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        intervalos:
          type: array
          items:
            $ref: '#/components/schemas/IntervaloAreaMorador'
        aviso:
          oneOf:
          - type: string
            description: Aviso fixo do topo do calendário, quando houver (UF 5.1).
          - type: 'null'
    ReservaMorador:
      type: object
      required:
      - id
      - area_id
      - inicio
      - fim
      - estado
      - tipo
      - valor_centavos
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        area_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        area_nome:
          type: string
        inicio:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        fim:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        estado:
          $ref: ./componentes/enums.yaml#/components/schemas/EstadoReserva
        tipo:
          type: string
          enum:
          - paga
          - gratuita
        valor_centavos:
          $ref: ./componentes/comum.yaml#/components/schemas/Centavos
        criada_em:
          $ref: ./componentes/comum.yaml#/components/schemas/DataHora
        pagar_ate:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          - type: 'null'
        sugerir_lista_visitantes:
          type: boolean
          description: Verdadeiro só se a reserva está Confirmada, tem data depois de hoje, sem lista vinculada e a sugestão não foi dispensada (RN-RE-12).
        lista_vinculada:
          oneOf:
          - type: object
            required:
            - id
            - nome
            - pessoas
            - chegaram
            properties:
              id:
                $ref: ./componentes/comum.yaml#/components/schemas/Uuid
              nome:
                type: string
              pessoas:
                type: integer
              chegaram:
                type: integer
          - type: 'null'
        cancelamento_previsto:
          oneOf:
          - type: object
            description: O que acontece se cancelar agora (RN-CA-02, RN-CA-03).
            required:
            - direito_reembolso
            - valor_reembolso_centavos
            properties:
              direito_reembolso:
                type: boolean
              valor_reembolso_centavos:
                $ref: ./componentes/comum.yaml#/components/schemas/Centavos
              aviso:
                oneOf:
                - type: string
                  description: Texto de UF 5.2 quando não há reembolso.
                - type: 'null'
          - type: 'null'
        comprovantes:
          type: array
          items:
            $ref: '#/components/schemas/ComprovanteMorador'
        cancelamento:
          oneOf:
          - type: object
            required:
            - cancelado_em
            - origem
            properties:
              cancelado_em:
                $ref: ./componentes/comum.yaml#/components/schemas/DataHora
              origem:
                type: string
                enum:
                - morador
                - condominio
              motivo:
                oneOf:
                - type: string
                - type: 'null'
              valor_reembolso_centavos:
                $ref: ./componentes/comum.yaml#/components/schemas/Centavos
          - type: 'null'
    PagarReservaMorador:
      type: object
      required:
      - meio
      properties:
        meio:
          type: string
          enum:
          - pix
          - cartao
          description: Pix é a opção principal (RF-PG-01); reserva não aceita boleto.
    CancelarReservaMorador:
      type: object
      description: '`ciente_sem_reembolso` só é exigido verdadeiro quando o cancelamento não dá direito a reembolso (RN-CA-03: o app avisa antes de confirmar). Campo técnico, Proposta.'
      required:
      - ciente_sem_reembolso
      properties:
        motivo:
          type: string
        ciente_sem_reembolso:
          type: boolean
    VisitanteMorador:
      type: object
      description: Autorização de visita da unidade e o estado da ocorrência atual. O documento do visitante só é visto pela portaria e pelo morador que cadastrou, nunca em notificação (RN 8.4).
      required:
      - id
      - tipo
      - nome
      - estado
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        tipo:
          type: string
          enum:
          - avulsa
          - recorrente
          - interfone
          description: '`interfone` é a entrada sem cadastro, autorizada pelo morador e registrada pela portaria (RN-VI-04).'
        nome:
          type: string
        documento:
          oneOf:
          - type: string
          - type: 'null'
        data_avulsa:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Data
          - type: 'null'
        dias_semana:
          type: array
          items:
            type: string
            enum:
            - seg
            - ter
            - qua
            - qui
            - sex
            - sab
            - dom
        inicio_periodo:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Data
          - type: 'null'
        fim_periodo:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Data
          - type: 'null'
        inicio_faixa:
          oneOf:
          - type: string
            pattern: ^[0-2][0-9]:[0-5][0-9]$
          - type: 'null'
        fim_faixa:
          oneOf:
          - type: string
            pattern: ^[0-2][0-9]:[0-5][0-9]$
          - type: 'null'
        lista_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
        estado:
          $ref: ./componentes/enums.yaml#/components/schemas/EstadoVisita
        entrada_em:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          - type: 'null'
        saida_em:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/DataHora
          - type: 'null'
    CriarVisitanteAvulsoMorador:
      type: object
      required:
      - tipo
      - nome
      properties:
        tipo:
          const: avulsa
        nome:
          type: string
          minLength: 1
        documento:
          type: string
          description: Opcional (RN-VI-02).
        data_avulsa:
          allOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Data
          description: 'Padrão: hoje. Não aceita data passada (RN-VI-02).'
    CriarVisitanteRecorrenteMorador:
      type: object
      required:
      - tipo
      - nome
      - dias_semana
      properties:
        tipo:
          const: recorrente
        nome:
          type: string
          minLength: 1
        documento:
          type: string
        dias_semana:
          type: array
          items:
            type: string
            enum:
            - seg
            - ter
            - qua
            - qui
            - sex
            - sab
            - dom
          minItems: 1
        inicio_faixa:
          type: string
