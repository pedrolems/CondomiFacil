          - informativa
          - com_votacao
        envolve_despesa_extraordinaria:
          type: boolean
          description: 'Padrão: envolve (RN-VO-18).'
        votacao:
          oneOf:
          - $ref: '#/components/schemas/VotacaoDaPautaMorador'
          - type: 'null'
    ReuniaoResumoMorador:
      type: object
      required:
      - id
      - titulo
      - inicio_previsto
      - local
      - estado
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        titulo:
