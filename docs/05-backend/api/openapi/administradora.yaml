openapi: 3.1.0
info:
  title: CondomiFacil API - interface da administradora
  version: 0.1.0-proposta
  description: '**Proposta de 10/11/2026**, não aceita pelo Pedro. Tudo o que não vem de decisão do Pedro nem do PRD (caminhos, nomes de campos de entrada, códigos de erro, valores de enumerações de entrada) é Proposta. Estados e regras vêm das Regras de Negócio e do MER/DER.


    Interface do painel web da administradora, em `/v1/administradora/*` (pasta `administradora/`, `01-backend.md` 3.3). O Suporte da plataforma usa as mesmas rotas nos condomínios do plano Gestão + Suporte (PRD 3, RN-CD-16, RN-PL-02), depois de abrir o contexto em `/v1/plataforma/condominios/{condominio_id}/contexto-suporte`. As operações de reclamações recusam o suporte com `403` (PRD 3, `01-backend.md` 3.3); a pasta organiza, a recusa é de guard e de RLS.


    O painel opera vários condomínios: toda rota leva `X-Condominio-Id` e nenhuma leva `X-Unidade-Id` (guia, seção 3). A situação financeira da unidade (SEG-17) só aparece aqui, para a administradora. Receitas de cobrança e de reservas entram sozinhas e agregadas, sem unidade: não existe operação para criá-las à mão (RN-FI-22). As taxas do gateway viram despesa "Administração" sozinhas (RN-PG-05, RN-FI-23). O julgamento do recurso de reclamação é de `comum.yaml` (`/v1/recursos`, RN-RC-07), não desta interface. Ações sensíveis são auditadas (SEG-08).

    '
servers:
- url: https://api.condomifacil.example
  description: Endereço fictício; ambientes ainda não definidos (ADR-004, ADR-011).
tags:
- name: condominio
  description: Blocos, portarias, unidades, pessoas, locação, mandatos e solicitações.
- name: configuracao
  description: Parâmetros por condomínio e por área; áreas comuns.
- name: cobranca
  description: Configuração e acompanhamento da cobrança condominial.
- name: pagamentos
  description: Conta recebedora, duplicidades, devoluções e conciliação.
- name: financas
  description: Receitas e despesas gerenciais do condomínio.
- name: convivencia
  description: 'Reclamações. O suporte da plataforma recebe 403. Score de funcionários: `GET /v1/score` com `escopo=funcionarios`, em `comum.yaml`.'
- name: chamados
  description: Avaliações do atendimento, só o agregado por funcionário e por empresa.
- name: comunicados
  description: Regimento interno, termos e conversa com o alvo da reclamação.
- name: visitantes
  description: Lista de entrada bloqueada.
- name: governanca
  description: Mandatos, substituição do síndico e regras de reeleição.
paths:
  /v1/administradora/blocos:
    get:
      operationId: administradoraListarBlocos
      summary: Lista os blocos do condomínio
      description: Lista blocos (torres ou quadras) do condomínio do contexto (RN-CD-17). Suporte da plataforma usa a mesma rota no plano Gestão + Suporte.
      tags:
      - condominio
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: ./componentes/comum.yaml#/components/parameters/Limite
      - $ref: ./componentes/comum.yaml#/components/parameters/Cursor
      responses:
        '200':
          description: Página de resultados.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                type: object
                required:
                - dados
                - paginacao
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/BlocoAdministradora'
                  paginacao:
                    $ref: ./componentes/comum.yaml#/components/schemas/Paginacao
              example:
                dados:
                - id: 0000000b-0000-4000-8000-00000000000b
                  nome: Torre A
                paginacao:
                  proximo_cursor: null
                  tem_mais: false
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-AD-17
      - RN-CD-17
      - US-AD-08
    post:
      operationId: administradoraCriarBloco
      summary: Cadastra um bloco
      description: Cadastra bloco ou quadra; condomínio sem blocos deixa `bloco_id` nulo nas unidades (RN-CD-17).
      tags:
      - condominio
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlocoEntradaAdministradora'
            example:
              nome: Torre A
      responses:
        '201':
          description: Bloco criado.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlocoAdministradora'
              example:
                id: 0000000b-0000-4000-8000-00000000000b
                nome: Torre A
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-AD-17
      - RN-CD-17
      - US-AD-08
  /v1/administradora/blocos/{bloco_id}:
    put:
      operationId: administradoraAtualizarBloco
      summary: Atualiza um bloco
      description: Renomeia o bloco (RN-CD-17).
      tags:
      - condominio
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - name: bloco_id
        in: path
        required: true
        description: Identificador do bloco.
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlocoEntradaAdministradora'
            example:
              nome: Torre A
      responses:
        '200':
          description: Bloco atualizado.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlocoAdministradora'
              example:
                id: 0000000b-0000-4000-8000-00000000000b
                nome: Torre A
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '404':
          $ref: ./componentes/comum.yaml#/components/responses/Erro404
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-AD-17
      - RN-CD-17
  /v1/administradora/portarias:
    get:
      operationId: administradoraListarPortarias
      summary: Lista as portarias
      description: Lista portarias e os blocos que cada uma atende (RN-CD-17).
      tags:
      - condominio
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: ./componentes/comum.yaml#/components/parameters/Limite
      - $ref: ./componentes/comum.yaml#/components/parameters/Cursor
      responses:
        '200':
          description: Página de resultados.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                type: object
                required:
                - dados
                - paginacao
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortariaAdministradora'
                  paginacao:
                    $ref: ./componentes/comum.yaml#/components/schemas/Paginacao
              example:
                dados:
                - id: 00000015-0000-4000-8000-000000000015
                  nome: Portaria Principal
                  atende_todos_blocos: false
                  blocos_ids:
                  - 0000000b-0000-4000-8000-00000000000b
                paginacao:
                  proximo_cursor: null
                  tem_mais: false
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-AD-17
      - RN-CD-17
      - US-AD-08
    post:
      operationId: administradoraCriarPortaria
      summary: Cadastra uma portaria
      description: Cada portaria atende todos os blocos ou só os escolhidos (RN-CD-17).
      tags:
      - condominio
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortariaEntradaAdministradora'
            example:
              nome: Portaria Principal
              atende_todos_blocos: false
              blocos_ids:
              - 0000000b-0000-4000-8000-00000000000b
      responses:
        '201':
          description: Portaria criada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortariaAdministradora'
              example:
                id: 00000015-0000-4000-8000-000000000015
                nome: Portaria Principal
                atende_todos_blocos: false
                blocos_ids:
                - 0000000b-0000-4000-8000-00000000000b
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '422':
          description: Regra de negócio violada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                semBloco:
                  summary: Portaria que não atende todos os blocos sem bloco escolhido (RN-CD-17)
                  value:
                    codigo: PORTARIA_SEM_BLOCO
                    mensagem: Escolha ao menos um bloco ou marque que a portaria atende todos.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-AD-17
      - RN-CD-17
      - US-AD-08
  /v1/administradora/portarias/{portaria_id}:
    put:
      operationId: administradoraAtualizarPortaria
      summary: Atualiza uma portaria
      description: Altera nome e blocos atendidos (RN-CD-17).
      tags:
      - condominio
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - name: portaria_id
        in: path
        required: true
        description: Identificador da portaria.
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortariaEntradaAdministradora'
            example:
              nome: Portaria Principal
              atende_todos_blocos: true
              blocos_ids: []
      responses:
        '200':
          description: Portaria atualizada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortariaAdministradora'
              example:
                id: 00000015-0000-4000-8000-000000000015
                nome: Portaria Principal
                atende_todos_blocos: false
                blocos_ids:
                - 0000000b-0000-4000-8000-00000000000b
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '404':
          $ref: ./componentes/comum.yaml#/components/responses/Erro404
        '422':
          description: Regra de negócio violada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                semBloco:
                  summary: Portaria que não atende todos os blocos sem bloco escolhido (RN-CD-17)
                  value:
                    codigo: PORTARIA_SEM_BLOCO
                    mensagem: Escolha ao menos um bloco ou marque que a portaria atende todos.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-AD-17
      - RN-CD-17
  /v1/administradora/unidades:
    get:
      operationId: administradoraListarUnidades
      summary: Lista as unidades
      description: Lista unidades com a situação de ocupação e o morador habilitado (RN-CD-04). Situação de ocupação não é inadimplência.
      tags:
      - condominio
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: ./componentes/comum.yaml#/components/parameters/Limite
      - $ref: ./componentes/comum.yaml#/components/parameters/Cursor
      - name: bloco_id
        in: query
        required: false
        description: Filtra por bloco.
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
      - name: situacao_ocupacao
        in: query
        required: false
        description: Um ou mais valores, separados por vírgula.
        schema:
          type: array
          items:
            type: string
            enum:
            - residida_pelo_proprietario
            - alugada
            - desocupada
        style: form
        explode: false
        example:
        - alugada
      - name: busca
        in: query
        required: false
        description: Texto livre na identificação da unidade.
        schema:
          type: string
      - name: ordenar
        in: query
        required: false
        description: Ordenação. Padrão `identificacao`.
        schema:
          type: string
          enum:
          - identificacao
          - -identificacao
          default: identificacao
      responses:
        '200':
          description: Página de resultados.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                type: object
                required:
                - dados
                - paginacao
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/UnidadeAdministradora'
                  paginacao:
                    $ref: ./componentes/comum.yaml#/components/schemas/Paginacao
              example:
                dados:
                - id: 0000001f-0000-4000-8000-00000000001f
                  bloco_id: 0000000b-0000-4000-8000-00000000000b
                  identificacao: Apto 101
                  fracao_ideal: 0.0125
                  situacao_ocupacao: alugada
                  morador_habilitado:
                    vinculo_unidade_id: 00000029-0000-4000-8000-000000000029
                    vinculo_condominio_id: 0000002a-0000-4000-8000-00000000002a
                    nome: João Alves
                    tipo: inquilino
                    inicio: '2026-03-01T00:00:00-03:00'
                paginacao:
                  proximo_cursor: null
                  tem_mais: false
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-AD-04
      - RF-AD-17
      - RN-CD-04
      - US-AD-01
    post:
      operationId: administradoraCriarUnidade
      summary: Cadastra uma unidade
      description: Cadastra apartamento, casa ou sala, vinculada a um bloco quando o condomínio usa blocos (RN-CD-17).
      tags:
      - condominio
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnidadeEntradaAdministradora'
            example:
              bloco_id: 0000000b-0000-4000-8000-00000000000b
              identificacao: Apto 102
              fracao_ideal: 0.0125
      responses:
        '201':
          description: Unidade criada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnidadeAdministradora'
              example:
                id: 0000001f-0000-4000-8000-00000000001f
                bloco_id: 0000000b-0000-4000-8000-00000000000b
                identificacao: Apto 101
                fracao_ideal: 0.0125
                situacao_ocupacao: desocupada
                morador_habilitado: null
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-AD-17
      - RN-CD-04
      - RN-CD-17
      - US-AD-08
  /v1/administradora/unidades/{unidade_id}:
    get:
      operationId: administradoraObterUnidade
      summary: Detalha uma unidade
      description: Devolve a unidade com o morador habilitado atual (RN-CD-04).
      tags:
      - condominio
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - name: unidade_id
        in: path
        required: true
        description: Identificador da unidade.
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
      responses:
        '200':
          description: Unidade.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnidadeAdministradora'
              example:
                id: 0000001f-0000-4000-8000-00000000001f
                bloco_id: 0000000b-0000-4000-8000-00000000000b
                identificacao: Apto 101
                fracao_ideal: 0.0125
                situacao_ocupacao: alugada
                morador_habilitado:
                  vinculo_unidade_id: 00000029-0000-4000-8000-000000000029
                  vinculo_condominio_id: 0000002a-0000-4000-8000-00000000002a
                  nome: João Alves
                  tipo: inquilino
                  inicio: '2026-03-01T00:00:00-03:00'
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          $ref: ./componentes/comum.yaml#/components/responses/Erro403
        '404':
          $ref: ./componentes/comum.yaml#/components/responses/Erro404
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-AD-04
      - US-AD-01
    put:
      operationId: administradoraAtualizarUnidade
      summary: Atualiza uma unidade
      description: Altera bloco, identificação ou fração ideal.
      tags:
      - condominio
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - name: unidade_id
        in: path
        required: true
        description: Identificador da unidade.
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
      requestBody:
        required: true
        content:
