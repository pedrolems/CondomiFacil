                - 'null'
                description: 'Média das médias dos funcionários avaliados (RN-PE-07). Nula se não publicada. Casas decimais e arredondamento: lacuna.'
              rotulo:
                type:
                - string
                - 'null'
                description: Texto exibido quando a nota não é publicada (UF 9.4).
    CriarRecursoComum:
      type: object
