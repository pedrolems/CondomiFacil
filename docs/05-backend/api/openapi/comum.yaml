              $ref: '#/components/schemas/PedirEnvioArquivoComum'
            example:
              modulo: comprovante_lancamento
              tipo_midia: application/pdf
              tamanho_bytes: 482113
              hash_conteudo: sha256:9f2c1ab4d7e3
              alvo: null
