openapi: 3.1.0
info:
  title: CondomiFacil API - interface comum
  version: 0.1.0-proposta
  summary: Acesso e sessão, perfil próprio, notificações, arquivos, LGPD, score e recurso de decisão.
  description: |-
    **Proposta de 10/11/2026**, não aceita pelo Pedro. Interface `comum/` do backend (`01-backend.md` 3.3, decisão de agrupamento 5): rotas sem perfil dono, usadas por três ou mais perfis com o mesmo DTO. Convenções no `01-guia-da-api.md`.

    **Decidido (PRD e regras de negócio):** ninguém se cadastra sozinho; primeiro acesso por código de 6 dígitos no e-mail, 15 minutos, 5 tentativas, reenvio após 60 segundos, mesma resposta para e-mail cadastrado ou não, senha com no mínimo 8 caracteres e pausa de 15 minutos após 5 senhas erradas (RF-AC-01, RN-CD-02, SEG-04).

    **Proposta (não vem de decisão do Pedro nem do PRD):**
    - Os caminhos `/v1/acesso/codigo`, `/ativar`, `/aceites` e `/renovar` vêm da arquitetura 3.3.1; os caminhos de **login (`/entrar`), recuperação (`/redefinir-senha`) e sair (`/sair`) não estão nos docs** e são Proposta.
    - Caminhos `/v1/eu/*`, `/v1/arquivos/*`, `/v1/score` e `/v1/recursos`. `/v1/score` e `/v1/recursos` exigem `X-Condominio-Id`, por isso ficam fora de `/v1/eu`, que não leva cabeçalhos de contexto (guia, seção 3).    - Tokens, rotação do refresh e cookie na web seguem o ADR-007 (Proposta).
    - Nomes de papéis, de tipos de notificação, de módulos de arquivo e de códigos de erro de regra de negócio.

    **Autenticação por grupo de rota** (guia, seção 3): `/v1/acesso/codigo`, `/ativar`, `/entrar`, `/redefinir-senha` e `/renovar` não levam `Authorization` nem cabeçalhos de contexto. `/v1/acesso/sair`, `/v1/acesso/aceites` e todo `/v1/eu/*` levam `Authorization` sem cabeçalhos de contexto. `/v1/arquivos/*`, `/v1/score` e `/v1/recursos` levam `Authorization` e `X-Condominio-Id`.

    **Privacidade:** nenhum exemplo expõe quem reclamou, quem avaliou, voto ou score de terceiros fora de RN-SC-02. O score é só número e texto, nunca verde ou vermelho. Dados de cartão nunca passam pela API (SEG-12). Limites de taxa: lacuna (guia, seção 10).
servers:
- url: /
  description: Endereço base ainda não definido (lacuna de infraestrutura).
tags:
- name: acesso
  description: 'Módulo `acesso`: código, ativação, login, sessão, aceites e perfil próprio.'
- name: condominio
  description: 'Módulo `condominio`: vínculos, unidades e papéis efetivos do usuário.'
- name: notificacoes
  description: 'Módulo `notificacoes`: preferências, dispositivos de push e lista de notificações.'
- name: arquivos
  description: 'Módulo `arquivos`: URL assinado de envio e de leitura.'
- name: lgpd
  description: 'Módulo `lgpd`: cópia dos dados e exclusão da conta.'
- name: convivencia
  description: 'Módulo `convivencia`: endpoint único de score e recurso de decisão de reclamação.'
paths:
  /v1/acesso/codigo:
    post:
      operationId: comumPedirCodigo
      summary: Pede um código de acesso por e-mail
      description: Envia um código de 6 dígitos, válido por 15 minutos, ao e-mail pré-cadastrado (RN-CD-02). A resposta é a mesma para e-mail cadastrado ou não, para não revelar quem tem conta; o código só sai quando o e-mail está pré-cadastrado e ativo. Um novo código só pode ser pedido após 60 segundos e invalida o anterior. O mesmo caminho serve ao primeiro acesso e à recuperação de senha (`finalidade`). Sem `Authorization` nem cabeçalhos de contexto.
      tags:
      - acesso
      security: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedirCodigoComum'
            examples:
              primeiroAcesso:
                summary: Primeiro acesso
                value:
                  email: ana.exemplo@example.com
                  finalidade: primeiro_acesso
              recuperacao:
                summary: Recuperação de senha
                value:
                  email: ana.exemplo@example.com
                  finalidade: recuperacao_senha
      responses:
        '202':
          description: Pedido aceito. Corpo idêntico exista ou não conta com esse e-mail.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaCodigoComum'
              example:
                mensagem: Se o e-mail estiver cadastrado, enviamos um código. Se não chegar, confira o e-mail digitado ou procure a administradora ou o síndico.
                pode_pedir_novo_codigo_em: '2026-11-10T14:31:00-03:00'
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          description: Reenvio antes de 60 segundos ou limite de taxa por IP e por e-mail. A resposta vale igual para qualquer e-mail, cadastrado ou não, para não revelar quem tem conta. Traz `Retry-After`.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
            Retry-After:
              $ref: ./componentes/comum.yaml#/components/headers/RetryAfter
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                reenvioAntecipado:
                  summary: Novo código pedido antes de 60 s (código e texto Proposta, sem origem em UF)
                  value:
                    codigo: CODIGO_REENVIO_ANTECIPADO
                    mensagem: Você poderá pedir um novo código em instantes.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
                limiteDeTaxa:
                  summary: Excesso de pedidos por IP ou e-mail (texto Proposta)
                  value:
                    codigo: LIMITE_DE_TAXA_EXCEDIDO
                    mensagem: Muitas tentativas em pouco tempo. Aguarde um pouco e tente de novo.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-AC-01
      - RF-AC-03
      - RN-CD-01
      - RN-CD-02
      - SEG-04
      - US-AC-01
      - US-AC-04
  /v1/acesso/ativar:
    post:
      operationId: comumAtivar
      summary: Ativa a conta com o código e cria a senha
      description: Valida o código recebido por e-mail e grava a senha (mínimo de 8 caracteres) na mesma chamada; devolve a sessão (RF-AC-01, RN-CD-02). Código errado conta uma das 5 tentativas; na quinta o código é invalidado e é preciso pedir outro. As respostas de erro são as mesmas para e-mail não cadastrado, inclusive a contagem de tentativas restantes, que o servidor simula (Proposta). Antes de usar o app, o usuário ainda precisa aceitar os documentos (`aceites_pendentes`, RN-CD-03). Sem `Authorization` nem cabeçalhos de contexto.
      tags:
      - acesso
      security: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtivarComum'
            example:
              email: ana.exemplo@example.com
              codigo: '483920'
              nova_senha: senha-de-exemplo-123
              dispositivo:
                identificador_instalacao: inst-8f3a2c1d-aparelho-exemplo
                plataforma: android
      responses:
        '200':
          description: Conta ativa e sessão aberta.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
            Set-Cookie:
              description: 'Só na web: refresh token em cookie `httpOnly`, `Secure`, `SameSite=Lax` (ADR-007, Proposta). Nesse caso `refresh_token` não vai no corpo.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoAbertaComum'
              example:
                token_acesso: eyJhbGciOiJFUzI1NiIsImtpZCI6ImsxIn0.eyJzdWIiOiIzZjZjMWE1Mi04YjFlLTRkM2EtOWEwZS01YzFkMmI3ZTlmMTAiLCJzaWQiOiJiMmU0ZjZhOC0xYzNkLTRlNWYtOGE3Yi05YzBkMWUyZjNhNGIifQ.assinatura-de-exemplo
                token_acesso_expira_em: '2026-11-10T14:45:00-03:00'
                refresh_token: rt_9Zk2Qm7xVb3LpA0sTn5Wc8Hd1Yf4Ju6E
                aceites_pendentes: true
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '422':
          description: Código incorreto, vencido ou invalidado (RN-CD-02). Mesmas respostas para e-mail não cadastrado.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                codigoIncorreto:
                  summary: Código errado, ainda com tentativas (texto de UF 3.1)
                  value:
                    codigo: CODIGO_INCORRETO
                    mensagem: Código incorreto. Você tem mais 3 tentativas.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
                codigoInvalidado:
                  summary: 5 erros ou código vencido (texto de UF 3.1)
                  value:
                    codigo: CODIGO_INVALIDO_OU_VENCIDO
                    mensagem: Este código não vale mais. Peça um novo.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-AC-01
      - RN-CD-01
      - RN-CD-02
      - RN-CD-03
      - SEG-04
      - US-AC-01
  /v1/acesso/entrar:
    post:
      operationId: comumEntrar
      summary: Entra com e-mail e senha
      description: '**Proposta:** caminho não definido nos docs (a arquitetura 3.3.1 só cita código, ativação, aceites e renovação). Abre a sessão com e-mail e senha. A mensagem de erro não diz qual dos dois está errado; após 5 senhas erradas seguidas o acesso fica pausado por 15 minutos (SEG-04). Conta desativada por mudança ou desligamento recebe `403` (RN-CD-07). **Proposta, para não revelar quem tem conta (SEG-04, RN-CD-02):** o `403 ACESSO_ENCERRADO` só sai depois de e-mail e senha corretos; e a pausa de 15 minutos por e-mail (`429 ACESSO_PAUSADO`) vale igual para e-mail não cadastrado, contando as falhas pela chave de tentativa. Sem `Authorization` nem cabeçalhos de contexto.'
      tags:
      - acesso
      security: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntrarComum'
            example:
              email: ana.exemplo@example.com
              senha: senha-de-exemplo-123
              dispositivo:
                identificador_instalacao: inst-8f3a2c1d-aparelho-exemplo
                plataforma: android
      responses:
        '200':
          description: Sessão aberta.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
            Set-Cookie:
              description: 'Só na web: refresh token em cookie `httpOnly`, `Secure`, `SameSite=Lax` (ADR-007, Proposta).'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoAbertaComum'
              example:
                token_acesso: eyJhbGciOiJFUzI1NiIsImtpZCI6ImsxIn0.eyJzdWIiOiIzZjZjMWE1Mi04YjFlLTRkM2EtOWEwZS01YzFkMmI3ZTlmMTAiLCJzaWQiOiJiMmU0ZjZhOC0xYzNkLTRlNWYtOGE3Yi05YzBkMWUyZjNhNGIifQ.assinatura-de-exemplo
                token_acesso_expira_em: '2026-11-10T14:45:00-03:00'
                refresh_token: rt_Qm7xVb3LpA0sTn5Wc8Hd1Yf4Ju6E9Zk2
                aceites_pendentes: false
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          description: E-mail ou senha incorretos, sem dizer qual dos dois. Mesma resposta para e-mail não cadastrado.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                credenciaisInvalidas:
                  summary: Erro de login (texto de UF 3.2)
                  value:
                    codigo: CREDENCIAIS_INVALIDAS
                    mensagem: E-mail ou senha incorretos.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '403':
          description: Conta desativada por mudança de morador ou desligamento (RN-CD-07). Só sai depois de credenciais corretas (Proposta).
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                acessoEncerrado:
                  summary: Acesso encerrado (texto de UF 3.2)
                  value:
                    codigo: ACESSO_ENCERRADO
                    mensagem: Seu acesso a este condomínio foi encerrado. Se for um engano, fale com a administradora.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          description: Acesso pausado por 15 minutos após 5 senhas erradas seguidas (SEG-04), ou limite de taxa. Vale igual para e-mail não cadastrado (Proposta). Traz `Retry-After`.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
            Retry-After:
              $ref: ./componentes/comum.yaml#/components/headers/RetryAfter
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                acessoPausado:
                  summary: 5 senhas erradas (texto de UF 3.2; código Proposta)
                  value:
                    codigo: ACESSO_PAUSADO
                    mensagem: Por segurança, o acesso foi pausado por 15 minutos. Você pode redefinir a senha agora.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - SEG-04
      - RN-CD-02
      - RN-CD-03
      - RN-CD-07
      - US-AC-04
  /v1/acesso/redefinir-senha:
    post:
      operationId: comumRedefinirSenha
      summary: Redefine a senha com o código recebido
      description: '**Proposta:** caminho não definido nos docs. Segue o mesmo fluxo do primeiro acesso: o código vem de `POST /v1/acesso/codigo` com `finalidade` `recuperacao_senha` (RF-AC-03, RN-CD-02). A senha antiga deixa de funcionar e as outras sessões são encerradas (US-AC-04); a sessão devolvida é a única ativa. Sem `Authorization` nem cabeçalhos de contexto.'
      tags:
      - acesso
      security: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedefinirSenhaComum'
            example:
              email: ana.exemplo@example.com
              codigo: '102938'
              nova_senha: outra-senha-de-exemplo-456
              dispositivo:
                identificador_instalacao: inst-8f3a2c1d-aparelho-exemplo
                plataforma: android
      responses:
        '200':
          description: Senha trocada, outras sessões encerradas e nova sessão aberta.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
            Set-Cookie:
              description: 'Só na web: refresh token em cookie `httpOnly`, `Secure`, `SameSite=Lax` (ADR-007, Proposta).'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoAbertaComum'
              example:
                token_acesso: eyJhbGciOiJFUzI1NiIsImtpZCI6ImsxIn0.eyJzdWIiOiIzZjZjMWE1Mi04YjFlLTRkM2EtOWEwZS01YzFkMmI3ZTlmMTAiLCJzaWQiOiJiMmU0ZjZhOC0xYzNkLTRlNWYtOGE3Yi05YzBkMWUyZjNhNGIifQ.assinatura-de-exemplo
                token_acesso_expira_em: '2026-11-10T14:45:00-03:00'
                refresh_token: rt_Hd1Yf4Ju6E9Zk2Qm7xVb3LpA0sTn5Wc8
                aceites_pendentes: false
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '422':
          description: Código incorreto, vencido ou invalidado (RN-CD-02). Mesmas respostas para e-mail não cadastrado.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                codigoIncorreto:
                  summary: Código errado, ainda com tentativas (texto de UF 3.1)
                  value:
                    codigo: CODIGO_INCORRETO
                    mensagem: Código incorreto. Você tem mais 2 tentativas.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
                codigoInvalidado:
                  summary: 5 erros ou código vencido (texto de UF 3.1)
                  value:
                    codigo: CODIGO_INVALIDO_OU_VENCIDO
                    mensagem: Este código não vale mais. Peça um novo.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade:
      - RF-AC-03
      - RN-CD-02
      - SEG-04
      - US-AC-04
  /v1/acesso/renovar:
    post:
      operationId: comumRenovar
      summary: Renova o token de acesso
      description: '**Proposta:** origem no ADR-007 e na arquitetura 3.3.1, sem ID de produto. Troca o refresh token por um novo token de acesso (15 minutos) e um novo refresh token: o refresh é rotativo, cada uso gera outro, e o reuso de um já usado revoga a sessão (ADR-007, Proposta). No app, o refresh vai no corpo; na web, vem do cookie `httpOnly` e exige proteção CSRF. Sem `Authorization` nem cabeçalhos de contexto, porque o token de acesso pode já ter expirado.'
      tags:
      - acesso
      security: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenovarComum'
            example:
              refresh_token: rt_9Zk2Qm7xVb3LpA0sTn5Wc8Hd1Yf4Ju6E
      responses:
        '200':
          description: Novo par de tokens.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
            Set-Cookie:
              description: 'Só na web: novo refresh token em cookie `httpOnly`, `Secure`, `SameSite=Lax` (ADR-007, Proposta).'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoAbertaComum'
              example:
                token_acesso: eyJhbGciOiJFUzI1NiIsImtpZCI6ImsxIn0.eyJzdWIiOiIzZjZjMWE1Mi04YjFlLTRkM2EtOWEwZS01YzFkMmI3ZTlmMTAiLCJzaWQiOiJiMmU0ZjZhOC0xYzNkLTRlNWYtOGE3Yi05YzBkMWUyZjNhNGIifQ.assinatura-de-exemplo
                token_acesso_expira_em: '2026-11-10T15:00:00-03:00'
                refresh_token: rt_Wc8Hd1Yf4Ju6E9Zk2Qm7xVb3LpA0sTn5
                aceites_pendentes: false
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          description: Refresh token inválido, expirado, revogado ou reutilizado. O cliente volta ao login e depois à tela onde estava (UF 15).
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                refreshReutilizado:
                  summary: 'Refresh já usado: a sessão foi revogada (texto de UF 15)'
                  value:
                    codigo: SESSAO_EXPIRADA
                    mensagem: Por segurança, entre de novo na sua conta.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
          $ref: ./componentes/comum.yaml#/components/responses/Erro503
      x-rastreabilidade: []
  /v1/acesso/sair:
    post:
      operationId: comumSair
      summary: Sai da conta neste aparelho
      description: '**Proposta:** caminho não definido nos docs; origem no ADR-007 e na arquitetura 3.7, sem ID de produto. Revoga a sessão atual (ADR-007) e, se `dispositivo_id` vier, remove o token de push do aparelho (arquitetura 3.7). O app apaga a cópia offline ao sair da conta (SEG-09). Exige `Authorization`, sem cabeçalhos de contexto.'
      tags:
