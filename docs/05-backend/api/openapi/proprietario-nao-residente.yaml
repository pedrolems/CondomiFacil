        ata_arquivo_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
        presenca_arquivo_id:
          oneOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          - type: 'null'
    ReuniaoProprietarioNaoResidente:
      allOf:
      - $ref: '#/components/schemas/ReuniaoResumoProprietarioNaoResidente'
