      - convivencia
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - name: reclamacao_id
        in: path
        required: true
        description: Identificador da reclamação.
        schema:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecidirReclamacaoEntradaAdministradora'
            example:
              resultado: negar
              motivo_negativa: Fatos não confirmados
      responses:
        '200':
          description: Decisão registrada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisaoReclamacaoAdministradora'
              example:
                reclamacao_id: 0000012d-0000-4000-8000-00000000012d
                estado: negada
                resultado: negar
                decidida_em: '2026-11-10T14:00:00-03:00'
                pontos_aplicados: 0
                prazo_recurso_ate: null
        '400':
          $ref: ./componentes/comum.yaml#/components/responses/Erro400
        '401':
          $ref: ./componentes/comum.yaml#/components/responses/Erro401
        '403':
          description: Sem permissão para o papel efetivo ou sem vínculo com o condomínio (guards de contexto e papel).
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                semPermissao:
                  summary: Suporte da plataforma recebe 403 (PRD 3)
                  value:
                    codigo: SEM_PERMISSAO
                    mensagem: Esta área é só para administradora.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '404':
          $ref: ./componentes/comum.yaml#/components/responses/Erro404
        '422':
          description: Regra de negócio violada.
          headers:
            X-Request-Id:
              $ref: ./componentes/comum.yaml#/components/headers/XRequestId
          content:
            application/json:
              schema:
                $ref: ./componentes/comum.yaml#/components/schemas/Erro
              examples:
                foraDaCompetencia:
                  summary: Julgador definido pela tabela 5.1 é outro (RN-RC-03)
                  value:
                    codigo: RECLAMACAO_FORA_DA_COMPETENCIA_DA_ADMINISTRADORA
                    mensagem: Esta reclamação não cabe à administradora julgar.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
                aguardaAlvo:
                  summary: Alvo ainda não respondeu e o prazo não venceu (RN-RC-04)
                  value:
                    codigo: DECISAO_AGUARDA_RESPOSTA_DO_ALVO
                    mensagem: A decisão é liberada quando o alvo responde ou o prazo de resposta vence.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
                semJustificativa:
                  summary: Motivo com penalidade sem justificativa (RN-RC-05)
                  value:
                    codigo: DECISAO_PENALIDADE_SEM_JUSTIFICATIVA
                    mensagem: Informe a justificativa escrita para este motivo.
                    request_id: req_01JD9ZQ3K8M2T7V5W0X4Y6A1BC
        '426':
          $ref: ./componentes/comum.yaml#/components/responses/Erro426
        '429':
          $ref: ./componentes/comum.yaml#/components/responses/Erro429
        '500':
          $ref: ./componentes/comum.yaml#/components/responses/Erro500
        '503':
