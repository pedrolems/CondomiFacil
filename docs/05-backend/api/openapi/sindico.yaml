      operationId: sindicoIndicarEmpresaChamado
      summary: Indica a empresa de manutenção do chamado
      description: Escolhe uma empresa cadastrada para o chamado de manutenção; a avaliação do atendimento vale
        para ela (RN-CH-05, RN-CH-15). **Subsíndico:** só em substituição. Fora da substituição a resposta é `403`
        (RN-CD-27, RN-CD-28).
      tags:
      - chamados
      security:
      - bearerJwt: []
      parameters:
      - $ref: ./componentes/comum.yaml#/components/parameters/CondominioId
      - $ref: ./componentes/comum.yaml#/components/parameters/AppVersion
      - $ref: '#/components/parameters/ChamadoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndicarEmpresaChamadoSindico'
            example:
              empresa_id: 00000029-1111-4222-8333-000000000029
      responses:
        '200':
