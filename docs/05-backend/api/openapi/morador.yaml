        unidade_representada_id:
          allOf:
          - $ref: ./componentes/comum.yaml#/components/schemas/Uuid
          description: Só para procurador votando por uma unidade que representa por procuração; o guard aceita a procuração no lugar do vínculo com a unidade. Sem o campo, vale `X-Unidade-Id`.
    ProcuracaoMorador:
      type: object
      required:
      - id
      - unidade_id
      - procurador_vinculo_id
      - inicio
      properties:
        id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        unidade_id:
          $ref: ./componentes/comum.yaml#/components/schemas/Uuid
        reuniao_id:
