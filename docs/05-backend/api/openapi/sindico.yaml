      summary: Inicia a conversa com o alvo
      description: O julgador, seja quem for, inicia a conversa com o alvo antes de decidir; é um comunicado individual
        vinculado e a única exceção a RN-CO-01 (RN-RC-04, RN-CO-04). Na unidade, a conversa é com o morador habilitado
        e, na desocupada, com o proprietário. A mensagem ao alvo nunca revela o reclamante (RN-RC-10). **Só o julgador
        vigente (RN-RC-03, tabela 5.1 das RN):** funcionário ou unidade comum, síndico, e com o síndico em substituição,
        subsíndico; síndico ou a unidade dele, subsíndico, e sem subsíndico a administradora, e sem administradora
        o conselho fiscal; subsíndico ou a unidade dele, síndico presente, e com a substituição ativa a administradora,
        e sem administradora fica Pendente até o fim da substituição, quando o síndico julga. Quem não é o julgador
        vigente recebe `403`; reclamação Pendente, sem julgador, responde `409`.
